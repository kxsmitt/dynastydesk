function sparkline(vals, w = 110, h = 28, hi = null) {
  if (!vals.length) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const X = i => vals.length === 1 ? w / 2 : 2 + i * (w - 4) / (vals.length - 1), Y = v => h - 3 - (v - mn) / r * (h - 6);
  const d = vals.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const li = vals.length - 1;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${hi || "var(--accent)"}" stroke-width="1.6"/><circle cx="${X(li)}" cy="${Y(vals[li])}" r="2.6" fill="${hi || "var(--accent)"}"/></svg>`;
}
const bar = (p, col) => `<div class="bar"><i style="width:${Math.max(0, Math.min(100, p * 100))}%;${col ? "background:" + col : ""}"></i><b>${pct(p)}</b></div>`;

/* ---------------- views ---------------- */
const STATE = { view: "gameday", week: null, gd: null, odds: null, values: undefined, trending: null, timer: null, sort: { k: "titles", d: -1 } };

function viewGameday() {
  const s = M.cur, gd = STATE.gd;
  if (STATE.match != null) return viewMatch(s, gd, STATE.match);
  const scored = Object.keys(s.raw.weeks).map(Number).filter(w => (s.raw.weeks[w] || []).some(e => ptsOf(e) > 0));
  const top = Math.min(18, Math.max(1, s.currentWeek || 0, ...scored));
  const wkBtns = range(1, top).map(w => `<button class="wk" type="button" data-week="${w}" aria-pressed="${w === gd.week}">${w}</button>`).join("");
  const label = gd.isPast ? "Final" : gd.anyLive ? "Live" : "Upcoming";
  const cards = gd.matchups.sort((x, y) => Math.abs(0.5 - x.pA) - Math.abs(0.5 - y.pA)).map(mu => matchupCard(mu, s, gd)).join("");
  const projNote = gd.isPast ? "" : `<p class="note">Projected finals use ${gd.hasProj ? "Sleeper's weekly player projections scored with your league's settings" : "each player's season average (projections unavailable)"}${gd.hasSched ? " and live NFL game status" : ""}. Win odds are an estimate, not gospel.</p>`;
  return `<div class="section-h"><div><div class="eyebrow">${s.year} season · Week ${gd.week} · ${label}</div><h2>${gd.isPast ? "The Final Whistle" : gd.anyLive ? "Live From the League" : "This Week's Slate"}</h2></div><div class="weeks" role="group" aria-label="Week">${wkBtns}</div></div>
  ${gd.matchups.length ? `<div class="grid g2">${cards}</div>${projNote}` : `<div class="panel"><h3>No matchups yet</h3><p class="muted">Sleeper hasn't posted matchups for week ${gd.week}. ${s.league.status !== "in_season" ? "The league isn't in season right now; check History and Dynasty." : ""}</p></div>`}`;
}

function matchupCard(mu, s, gd) {
  const sideRow = (x, y, p) => `<div class="side ${x.pts >= y.pts ? "lead" : ""}">${avatarHTML(x.oid)}<div style="min-width:0"><div class="tname">${esc(teamName(x.oid))}</div><div class="mgr">${recStr(s.rec[x.rid] || { w: 0, l: 0 })}${gd.isPast ? "" : `<span class="proj-inline"> · proj ${fmt(x.final)}</span>`}</div></div>
    <div class="proj">${gd.isPast ? "" : `proj ${fmt(x.final)}`}</div><div class="score">${fmt(x.pts, 2)}</div></div>`;
  const pl = x => x.players.map(p => `<div class="pl"><span class="pos">${esc(p.slot.replace("SUPER_FLEX", "SF").replace("FLEX", "FLX").replace("REC_FLX", "RFX"))}</span><span class="nm"><span class="st ${p.status}" title="${p.status === "pre" ? "Yet to play" : p.status === "live" ? "Playing now" : "Finished"}"></span>${esc(pname(p.pid))} <span class="muted" style="font-size:11px">${esc(ppos(p.pid))} ${esc(pteam(p.pid))}</span></span><span class="pts">${fmt(p.actual, 2)}${!gd.isPast && p.status !== "done" ? ` <span class="muted">/${fmt(p.proj, 1)}</span>` : ""}</span></div>`).join("");
  const ca = color(mu.a.oid), cb = color(mu.b.oid);
  return `<article class="mu">
    <a class="mu-teams" href="#match-${gd.week}-${mu.a.mid}" aria-label="Open head-to-head view">${sideRow(mu.a, mu.b)}${sideRow(mu.b, mu.a)}</a>
    <div class="wp" role="img" aria-label="Win probability ${pct(mu.pA)} to ${pct(1 - mu.pA)}"><span style="width:${mu.pA * 100}%;background:${ca}"></span><span style="width:${(1 - mu.pA) * 100}%;background:${cb}"></span></div>
    <div class="wp-l"><span>${gd.isPast ? (mu.a.pts > mu.b.pts ? "WIN" : mu.a.pts < mu.b.pts ? "LOSS" : "TIE") : pct(mu.pA)}</span><span>${gd.isPast ? "" : "win odds"}</span><span>${gd.isPast ? (mu.b.pts > mu.a.pts ? "WIN" : mu.b.pts < mu.a.pts ? "LOSS" : "TIE") : pct(1 - mu.pA)}</span></div>
    <div class="blurb">${esc(gd.isPast ? recapBlurb(mu, s.year, gd.week) : previewBlurb(mu, STATE.odds, s.year, gd.week) + stakesLine(mu, s, gd))}</div>
    <a class="mu-open" href="#match-${gd.week}-${mu.a.mid}">Head-to-head view <span aria-hidden="true">→</span></a>
  </article>`;
}

function storyCard(st) {
  return `<article class="story tone-${st.tone}" style="--team:${st.oid ? color(st.oid) : "var(--accent)"}"><div class="eyebrow">${esc(st.kicker)}</div><h4>${esc(st.head)}</h4>${st.body ? `<p>${esc(st.body)}</p>` : ""}${st.list ? `<dl class="kv">${st.list.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}${st.stat ? `<div class="stat">${esc(st.stat)}</div>` : ""}</article>`;
}
function section(id, title, sub, html) {
  return html ? `<section class="sect" id="sec-${id}"><div class="sect-h"><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ""}</div>${html}</section>` : "";
}

function viewStories() {
  const gd = STATE.gd, odds = STATE.odds, s = M.cur, S = buildStories(gd, odds);
  const out = [];

  // This week
  if (gd && gd.matchups.length && !gd.isPast) {
    const score = m => { const h = M.h2h[m.a.oid]?.[m.b.oid]?.games.length || 0; const close = 1 - Math.abs(0.5 - m.pA) * 2;
      const stake = odds ? (1 - Math.abs(0.5 - (odds.res[m.a.rid]?.playoff ?? .5)) * 2) + (1 - Math.abs(0.5 - (odds.res[m.b.rid]?.playoff ?? .5)) * 2) : 0; return close * 2 + stake + Math.min(h, 6) * 0.15; };
    const ranked = [...gd.matchups].sort((x, y) => score(y) - score(x)), mu = ranked[0];
    const lead = `<div class="panel lead-story"><div><div class="eyebrow">Game of the week</div><h3>${esc(teamName(mu.a.oid))} vs. ${esc(teamName(mu.b.oid))}</h3><p>${esc(previewBlurb(mu, odds, s.year, gd.week))}</p></div>
      <div class="stack">${[mu.a, mu.b].map(x => `<div class="side">${avatarHTML(x.oid)}<div style="min-width:0"><div class="tname">${esc(teamName(x.oid))}</div><div class="mgr">${recStr(s.rec[x.rid] || { w: 0, l: 0 })}${odds ? ` · ${pct(odds.res[x.rid]?.playoff)} playoff odds` : ""}</div></div><div></div><div class="score">${pct(x === mu.a ? mu.pA : 1 - mu.pA)}</div></div>`).join("")}</div></div>`;
    const slate = `<ul class="slate">${ranked.slice(1).map(m => { const fav = m.pA >= 0.5 ? m.a : m.b; return `<li><div class="vs"><span class="chip" style="background:${color(m.a.oid)}"></span>${esc(teamName(m.a.oid))} <span class="muted">vs</span> <span class="chip" style="background:${color(m.b.oid)}"></span>${esc(teamName(m.b.oid))}</div><div class="odds mono">${esc(teamName(fav.oid).split(" ")[0])} ${pct(Math.max(m.pA, 1 - m.pA))}</div><div class="q">${esc(previewLead(m, gd.week))}</div></li>`; }).join("")}</ul>`;
    out.push(section("week", `Week ${gd.week}`, gd.anyLive ? "Live now" : "The slate, ranked by drama", lead + (ranked.length > 1 ? slate : "")));
  }

  // The race
  out.push(section("race", "The Race", odds ? `${odds.pt} playoff spots, ${plural(odds.weeksLeft, "week")} left` : "", S.race.length ? `<div class="grid g3">${S.race.map(storyCard).join("")}</div>` : ""));

  // Form & fortune
  if (S.form.length) {
    const ordered = [...S.form].sort((a, b) => a.r.rank - b.r.rank);
    const formHTML = `<div class="panel"><h4 class="mini">Form guide</h4><div class="formrows">${ordered.map(f => `<div class="formrow"><span class="chip" style="background:${color(f.r.oid)}"></span><span class="fn">${esc(teamName(f.r.oid))}</span><span class="res">${f.last5.map(x => `<i class="r ${x}">${x}</i>`).join("")}</span><span class="fq">${esc(f.quip)}</span></div>`).join("")}</div>
      ${S.pfLead ? `<p class="note" style="margin:12px 0 0">Points leader: <b>${esc(teamName(S.pfLead.oid))}</b>, ${fmt(S.pfLead.pf)} points${S.pfLead.rank > 1 ? `, which somehow only buys ${ordinal(S.pfLead.rank)} place` : ", and the standings agree"}.</p>` : ""}</div>`;
    const maxAbs = Math.max(1, ...S.luck.map(x => Math.abs(x.d)));
    const top = S.luck[0], bot = S.luck[S.luck.length - 1];
    const luckHTML = `<div class="panel"><h4 class="mini">Luck meter</h4><p class="note" style="margin:-4px 0 10px">Actual wins minus the wins you'd expect if every team played everyone every week.</p>
      <div class="luckrows">${S.luck.map(x => { const w = Math.abs(x.d) / maxAbs * 50; return `<div class="luckrow"><span class="fn">${esc(teamName(x.r.oid))}</span><span class="lbar"><i style="${x.d >= 0 ? `left:50%;width:${w}%;background:var(--win)` : `right:50%;width:${w}%;background:var(--loss)`}"></i></span><span class="mono lv">${x.d >= 0 ? "+" : "−"}${fmt(Math.abs(x.d))}</span></div>`; }).join("")}</div>
      <p class="note" style="margin:12px 0 0">${top.d >= 1 ? `${esc(teamName(top.r.oid))} would have about ${fmt(top.exp, 1)} wins on a neutral schedule. Buy a lottery ticket. ` : ""}${bot.d <= -1 ? `${esc(teamName(bot.r.oid))} scores like a contender and wins like a punchline.` : ""}</p></div>`;
    out.push(section("form", "Form &amp; Fortune", "Who's hot, who's not, and who's getting away with it", `<div class="grid g2">${formHTML}${luckHTML}</div>`));
  }

  out.push(section("fame", "Hall of Fame &amp; Shame", `${plural(M.seasons.length, "season")} of receipts`, S.fame.length ? `<div class="grid g3">${S.fame.map(storyCard).join("")}</div>` : ""));
  out.push(section("office", "Front Office", "Trades, picks and other crimes", S.office.length ? `<div class="grid g2">${S.office.map(storyCard).join("")}</div>` : ""));

  const body = out.filter(Boolean);
  const jumps = [["week", "This week"], ["race", "The race"], ["form", "Form"], ["fame", "Hall of fame"], ["office", "Front office"]]
    .filter(([id]) => body.some(h => h.includes(`id="sec-${id}"`))).map(([id, l]) => `<button class="btn" type="button" data-jump="sec-${id}">${l}</button>`).join("");
  return `<div class="section-h"><div><div class="eyebrow">Written from ${plural(M.seasons.length, "season")} of league data</div><h2>Storylines</h2></div><div class="jump">${jumps}</div></div>
    <div class="stack" style="gap:36px">${body.join("") || `<p class="muted">Stories show up once games have been played.</p>`}</div>`;
}

function viewOutlook() {
  const s = M.cur, odds = STATE.odds;
  const rows = s.standings.map(r => {
    const g = r.apW + r.apL, ap = g ? r.apW / g : 0;
    const last3 = mean(r.scores.slice(-3).map(x => x.pts));
    return { r, ap, last3 };
  });
  const l3max = Math.max(...rows.map(x => x.last3), 1), l3min = Math.min(...rows.map(x => x.last3), 0);
  for (const x of rows) { const games = x.r.results.length || 1; x.power = 0.55 * x.ap + 0.25 * ((x.last3 - l3min) / ((l3max - l3min) || 1)) + 0.2 * ((x.r.w + x.r.t / 2) / games); }
  const power = [...rows].sort((a, b) => b.power - a.power);
  const status = rid => { if (!odds) return ""; const p = odds.res[rid].playoff; return p >= 0.995 ? `<span class="pill in">Clinched*</span>` : p <= 0.005 ? `<span class="pill out">Out*</span>` : p >= 0.2 && p <= 0.8 ? `<span class="pill bubble">Bubble</span>` : ""; };
  const table = `<div class="tbl-wrap"><table><thead><tr><th class="n">Pwr</th><th>Team</th><th class="n">Rec</th><th class="n">PF</th><th class="n">All-play</th><th>Last weeks</th>${odds ? `<th>Playoffs</th>${odds.byes ? "<th>Bye</th>" : ""}<th class="n">Proj W</th><th></th>` : ""}</tr></thead><tbody>
    ${power.map((x, i) => `<tr><td class="n">${i + 1}${x.r.rank !== i + 1 ? ` <span class="muted" style="font-size:11px">(${ordinal(x.r.rank)})</span>` : ""}</td><td>${teamCell(x.r.oid)}</td><td class="n">${recStr(x.r)}</td><td class="n">${fmt(x.r.pf)}</td><td class="n">${x.r.apW}-${x.r.apL}</td><td>${sparkline(x.r.scores.map(z => z.pts), 110, 28, color(x.r.oid))}</td>
      ${odds ? `<td>${bar(odds.res[x.r.rid].playoff, color(x.r.oid))}</td>${odds.byes ? `<td>${bar(odds.res[x.r.rid].bye, color(x.r.oid))}</td>` : ""}<td class="n">${fmt(odds.res[x.r.rid].wins, 1)}</td><td>${status(x.r.rid)}</td>` : ""}</tr>`).join("")}
  </tbody></table></div>`;
  const oddsNote = odds ? `<p class="note">Power blends all-play win rate (55%), recent scoring (25%) and actual record (20%). Playoff odds come from ${CONFIG.SIMULATIONS.toLocaleString()} simulations of the remaining ${plural(odds.weeksLeft, "week")}: each team's scoring is drawn from its season average (pulled toward the league average) and spread, with live projections for the week in progress. ${odds.pt} teams make it${odds.byes ? `, top ${odds.byes} get byes` : ""}; ties break on points for. *Clinched/Out means more than 99.5% of simulations agree, not a mathematical lock.</p>`
    : `<p class="note">${s.lastDone === 99 ? "The regular season is over, so playoff odds are retired until next year." : "Playoff odds appear once the regular season has games to simulate."}</p>`;
  const thru = Math.min(s.lastDone, s.pws - 1);
  return `<div class="section-h"><div><div class="eyebrow">${s.year} · ${thru > 0 ? `regular season through week ${thru}` : "season hasn't kicked off"}</div><h2>Outlook</h2></div></div>
    <div class="stack">${table}${oddsNote}${scoringChart(s)}</div>`;
}

function scoringChart(s) {
  const series = s.standings.filter(r => r.scores.length).map(r => ({ oid: r.oid, pts: r.scores.map(x => x.pts), weeks: r.scores.map(x => x.week) }));
  if (!series.length) return "";
  const all = series.flatMap(x => x.pts); const mx = Math.ceil(Math.max(...all) / 20) * 20, mn = Math.floor(Math.min(...all) / 20) * 20;
  const weeks = [...new Set(series.flatMap(x => x.weeks))].sort((a, b) => a - b);
  const W = 760, H = 280, L = 40, R = 12, T = 12, B = 26;
  const X = w => L + (weeks.length === 1 ? (W - L - R) / 2 : (weeks.indexOf(w)) * (W - L - R) / (weeks.length - 1));
  const Y = v => T + (1 - (v - mn) / ((mx - mn) || 1)) * (H - T - B);
  const ticks = []; for (let v = mn; v <= mx; v += 20) ticks.push(v);
  const lgAvg = weeks.map(w => mean(series.map(x => x.pts[x.weeks.indexOf(w)]).filter(v => v != null)));
  return `<section class="panel"><h3>Weekly Scoring</h3><p class="note" style="margin-top:-6px">Every team's weekly score; the dashed line is the league average. Hover a line to see whose it is.</p><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto" role="img" aria-label="Weekly scores by team">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    ${weeks.map(w => `<text x="${X(w)}" y="${H - 8}" text-anchor="middle">${w}</text>`).join("")}
    ${series.map(x => `<path d="${x.pts.map((v, i) => `${i ? "L" : "M"}${X(x.weeks[i]).toFixed(1)},${Y(v).toFixed(1)}`).join("")}" fill="none" stroke="${color(x.oid)}" stroke-width="1.8" opacity=".8"><title>${esc(teamName(x.oid))}</title></path>`).join("")}
    <path d="${lgAvg.map((v, i) => `${i ? "L" : "M"}${X(weeks[i]).toFixed(1)},${Y(v).toFixed(1)}`).join("")}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 4"/>
  </svg></div></section>`;
}

function viewHistory() {
  const done = M.seasons.filter(s => s.complete);
  const banners = done.slice().reverse().map(s => {
    const tg = s.titleGame; const score = tg ? [tg.a, tg.b].sort((x, y) => y.pts - x.pts).map(x => fmt(x.pts)).join("-") : "";
    const r = s.standings.find(x => x.oid === s.champ);
    return `<div class="banner"><div class="yr">${s.year}</div><div class="eyebrow" style="color:inherit;opacity:.7">Champion</div><div class="ch">${esc(teamName(s.champ))}</div><div class="ru">${r ? recStr(r) + " reg. season" : ""}${score ? `<br>Final ${score} over ${esc(teamName(s.runner))}` : ""}</div></div>`;
  }).join("");
  // all-time table
  const rows = Object.values(M.allTime).filter(a => a.g > 0).map(a => ({ ...a, pct: (a.w + a.t / 2) / Math.max(1, a.w + a.l + a.t), ppg: a.pf / Math.max(1, a.g) }));
  const k = STATE.sort.k, d = STATE.sort.d;
  rows.sort((x, y) => ((x[k] ?? 0) > (y[k] ?? 0) ? 1 : (x[k] ?? 0) < (y[k] ?? 0) ? -1 : 0) * d || y.pct - x.pct);
  const th = (key, lbl, n = true) => `<th class="${n ? "n" : ""}"><button type="button" data-sort="${key}">${lbl}${k === key ? (d < 0 ? " ▼" : " ▲") : ""}</button></th>`;
  const table = `<div class="tbl-wrap"><table><thead><tr><th>Manager</th>${th("seasons", "Yrs")}${th("w", "W")}${th("l", "L")}${th("pct", "Win%")}${th("ppg", "PPG")}${th("playoffs", "Playoffs")}${th("pw", "Playoff W")}${th("finals", "Finals")}${th("titles", "Titles")}${th("best", "Best streak")}</tr></thead><tbody>
    ${rows.map(a => `<tr><td>${teamCell(a.oid)}</td><td class="n">${a.seasons}</td><td class="n">${a.w}</td><td class="n">${a.l}</td><td class="n">${fmt(a.pct * 100, 1)}</td><td class="n">${fmt(a.ppg)}</td><td class="n">${a.playoffs}</td><td class="n">${a.pw}-${a.pl}</td><td class="n">${a.finals}</td><td class="n">${a.titles ? "🏆".repeat(Math.min(a.titles, 5)) : "0"}</td><td class="n">${a.best}</td></tr>`).join("")}
  </tbody></table></div>`;
  return `<div class="section-h"><div><div class="eyebrow">${plural(M.seasons.length, "season")} on Sleeper · ${M.seasons[0].year}–${M.cur.year}</div><h2>League History</h2></div></div>
  <div class="stack">
    ${done.length ? `<section><h3>Champions</h3><div class="banners">${banners}</div></section>` : `<div class="panel"><h3>No champions crowned yet</h3><p class="muted">The banner wall fills in when the first season wraps.</p></div>`}
    <section><h3>All-Time Standings</h3>${table}<p class="note">Regular season records; playoff record counts winners-bracket games only.</p></section>
    ${finishChart()}
    ${h2hMatrix()}
    ${recordBook()}
  </div>`;
}

function finishChart() {
  const ss = M.seasons.filter(s => s.standings.some(r => r.results.length));
  if (ss.length < 2) return "";
  const oids = [...new Set(ss.flatMap(s => s.standings.map(r => r.oid)))];
  const n = Math.max(...ss.map(s => s.standings.length));
  const W = 760, H = 40 + n * 26, L = 30, R = 150, T = 20, B = 26;
  const X = i => L + i * (W - L - R) / (ss.length - 1), Y = rk => T + (rk - 1) * (H - T - B) / Math.max(1, n - 1);
  const finish = ss.map(s => {
    const top = s.complete ? [s.champ, s.runner, s.third].filter(Boolean) : [];
    const order = [...top, ...s.standings.map(r => r.oid).filter(o => !top.includes(o))];
    return Object.fromEntries(order.map((o, i) => [o, i + 1]));
  });
  const lines = oids.map(oid => {
    const pts = ss.map((s, i) => ({ i, rk: finish[i][oid] })).filter(p => p.rk);
    if (!pts.length) return "";
    const c = color(oid); const last = pts[pts.length - 1];
    return `<g><title>${esc(teamName(oid))}</title><path d="${pts.map((p, j) => `${j ? "L" : "M"}${X(p.i)},${Y(p.rk)}`).join("")}" fill="none" stroke="${c}" stroke-width="2.4" opacity=".85"/>
      ${pts.map(p => `<circle cx="${X(p.i)}" cy="${Y(p.rk)}" r="${ss[p.i].champ === oid ? 7 : 4}" fill="${ss[p.i].champ === oid ? "var(--accent)" : c}" stroke="var(--surface)" stroke-width="1.5"/>`).join("")}
      ${last.i === ss.length - 1 ? `<text x="${X(last.i) + 10}" y="${Y(last.rk) + 4}" style="fill:${c};font-weight:600">${esc(teamName(oid).slice(0, 18))}</text>` : ""}</g>`;
  }).join("");
  return `<section class="panel"><h3>The Climb and the Fall</h3><p class="note" style="margin-top:-6px">Final finish each season: champion, runner-up and third place first, everyone else by regular-season rank. Gold dots are titles. ${M.cur.complete ? "" : `${M.cur.year} shows current standings.`}</p>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;height:auto" role="img" aria-label="Season finishes by team">
    ${range(1, n).map(rk => `<text x="${L - 10}" y="${Y(rk) + 4}" text-anchor="end">${rk}</text><line x1="${L}" x2="${W - R}" y1="${Y(rk)}" y2="${Y(rk)}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join("")}
    ${ss.map((s, i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${s.year}</text>`).join("")}
    ${lines}</svg></div></section>`;
}

function h2hMatrix() {
  const oids = Object.values(M.owners).filter(o => o.active).map(o => o.id);
  if (oids.length < 2) return "";
  const cells = (x, y) => {
    if (x === y) return `<td style="background:var(--surface-2)"></td>`;
    const m = M.h2h[x]?.[y]; if (!m) return `<td class="muted">–</td>`;
    const p = (m.w + m.t / 2) / Math.max(1, m.w + m.l + m.t);
    const c = p > 0.5 ? "var(--win)" : p < 0.5 ? "var(--loss)" : "var(--muted)";
    return `<td style="background:color-mix(in srgb, ${c} ${Math.round(Math.abs(p - 0.5) * 120)}%, transparent)" title="${esc(teamName(x))} vs ${esc(teamName(y))}: ${m.w}-${m.l}${m.t ? "-" + m.t : ""}, avg ${fmt(m.pf / m.games.length)}-${fmt(m.pa / m.games.length)}">${m.w}-${m.l}${m.t ? "-" + m.t : ""}</td>`;
  };
  const short = oid => esc((teamName(oid) || "").slice(0, 10));
  return `<section><h3>Head-to-Head</h3><div class="tbl-wrap"><table class="h2h"><thead><tr><th class="rowh">Row vs. column</th>${oids.map(o => `<th title="${esc(teamName(o))}"><span class="chip" style="background:${color(o)}"></span>${short(o)}</th>`).join("")}</tr></thead>
    <tbody>${oids.map(x => `<tr><th class="rowh" style="text-align:left"><span class="chip" style="background:${color(x)}"></span>${esc(teamName(x))}</th>${oids.map(y => cells(x, y)).join("")}</tr>`).join("")}</tbody></table></div><p class="note">Regular season plus winners-bracket playoff games, current managers only.</p></section>`;
}

function recordBook() {
  const flat = M.allGames.flatMap(g => [{ g, me: g.a, op: g.b }, { g, me: g.b, op: g.a }]);
  if (!flat.length) return "";
  const by = (f, cmp) => flat.filter(f || (() => true)).reduce((a, b) => (a == null || cmp(b, a)) ? b : a, null);
  const when = x => `${esc(teamName(x.me.oid))} vs ${esc(teamName(x.op.oid))} · ${x.g.year} Wk ${x.g.week}${x.g.post ? " (playoffs)" : ""}`;
  const items = [
    ["Highest score", by(null, (a, b) => a.me.pts > b.me.pts), x => fmt(x.me.pts)],
    ["Lowest score", by(x => x.me.pts > 0, (a, b) => a.me.pts < b.me.pts), x => fmt(x.me.pts)],
    ["Biggest blowout", by(null, (a, b) => a.me.pts - a.op.pts > b.me.pts - b.op.pts), x => "+" + fmt(x.me.pts - x.op.pts)],
    ["Closest finish", by(x => x.me.pts > x.op.pts, (a, b) => a.me.pts - a.op.pts < b.me.pts - b.op.pts), x => "+" + fmt(x.me.pts - x.op.pts, 2)],
    ["Most points in a loss", by(x => x.me.pts < x.op.pts, (a, b) => a.me.pts > b.me.pts), x => fmt(x.me.pts)],
    ["Fewest points in a win", by(x => x.me.pts > x.op.pts, (a, b) => a.me.pts < b.me.pts), x => fmt(x.me.pts)]
  ].filter(i => i[1]);
  const seasonsPF = M.seasons.flatMap(s => s.standings.filter(r => r.results.length >= 3).map(r => ({ s, r, ppg: r.pf / r.results.length })));
  const bestSzn = seasonsPF.sort((a, b) => b.ppg - a.ppg)[0];
  const streak = Object.values(M.allTime).sort((a, b) => b.best - a.best)[0];
  return `<section><h3>Record Book</h3><div class="records">
    ${items.map(([lbl, x, v]) => `<div class="rec"><div class="eyebrow">${lbl}</div><div class="v mono">${v(x)}</div><div class="d">${when(x)}</div></div>`).join("")}
    ${bestSzn ? `<div class="rec"><div class="eyebrow">Best scoring season</div><div class="v mono">${fmt(bestSzn.ppg)} ppg</div><div class="d">${esc(teamName(bestSzn.r.oid))} · ${bestSzn.s.year} (${recStr(bestSzn.r)})</div></div>` : ""}
    ${streak?.best ? `<div class="rec"><div class="eyebrow">Longest win streak</div><div class="v mono">${streak.best}</div><div class="d">${esc(teamName(streak.oid))}</div></div>` : ""}
  </div></section>`;
}

function viewDynasty() {
  const s = M.cur, vals = STATE.values;
  const { seasons: nextSeasons, rounds: rookieRounds, owned } = picksLedger(s);
  const rosterRows = s.raw.rosters.map(r => {
    const oid = s.ownerOf[r.roster_id];
    const ps = (r.players || []).map(pid => ({ pid, ...(M.players[pid] || { n: pname(pid), pos: ppos(pid), age: null }), v: vals?.[pid] || 0 }));
    const skill = ps.filter(p => ["QB", "RB", "WR", "TE"].includes(p.pos));
    const ages = skill.map(p => p.age).filter(Boolean);
    const byPos = {}; for (const p of skill) byPos[p.pos] = (byPos[p.pos] || 0) + p.v;
    const total = sum(ps.map(p => p.v));
    const wAge = total ? sum(skill.filter(p => p.age).map(p => p.age * p.v)) / Math.max(1, sum(skill.filter(p => p.age).map(p => p.v))) : median(ages);
    const young = skill.filter(p => p.age && p.age <= 24);
    const oldRB = skill.filter(p => p.pos === "RB" && p.age >= 27);
    const top = [...ps].sort((a, b) => b.v - a.v || (a.age || 99) - (b.age || 99)).slice(0, 3);
    const pk = (owned[r.roster_id] || []);
    const firsts = pk.filter(p => p.round === 1).length, seconds = pk.filter(p => p.round === 2).length;
    return { oid, rid: r.roster_id, total, byPos, wAge, young, oldRB, top, pk, firsts, seconds, n: skill.length };
  });
  rosterRows.sort((a, b) => vals ? b.total - a.total : (a.wAge || 99) - (b.wAge || 99));
  const maxV = Math.max(...rosterRows.map(r => r.total), 1);
  const posCol = { QB: "hsl(352 60% 55%)", RB: "hsl(160 50% 42%)", WR: "hsl(212 65% 55%)", TE: "hsl(36 85% 52%)" };
  const window_ = r => {
    if (!vals) return r.wAge && r.wAge <= 25.5 ? "Rising" : r.wAge >= 27 ? "Win-now" : "Balanced";
    const rank = rosterRows.indexOf(r) + 1, n = rosterRows.length;
    if (rank <= n / 3 && r.wAge >= 26.5) return "Win-now";
    if (rank <= n / 3) return "Juggernaut";
    if (r.wAge <= 25 || r.firsts >= 4) return "Rising";
    if (rank > 2 * n / 3) return "Rebuild";
    return "Contender";
  };
  const table = `<div class="tbl-wrap"><table><thead><tr><th>Team</th>${vals ? "<th>Roster value by position</th>" : ""}<th class="n">Age${vals ? " (value-wtd)" : ""}</th><th class="n">≤24 yo</th><th>Top assets</th><th class="n">${nextSeasons[0]}–${nextSeasons[2].slice(2)} 1sts</th><th class="n">2nds</th><th>Window</th></tr></thead><tbody>
    ${rosterRows.map(r => `<tr><td>${teamCell(r.oid)}</td>${vals ? `<td><div style="display:flex;height:14px;width:${Math.max(4, r.total / maxV * 220)}px;border-radius:3px;overflow:hidden" title="${Math.round(r.total).toLocaleString()} total value">${["QB", "RB", "WR", "TE"].map(p => `<span style="width:${(r.byPos[p] || 0) / (r.total || 1) * 100}%;background:${posCol[p]}"></span>`).join("")}</div><div class="mono muted" style="font-size:11px">${Math.round(r.total).toLocaleString()}</div></td>` : ""}
      <td class="n">${fmt(r.wAge, 1)}</td><td class="n">${r.young.length}</td><td style="white-space:normal;min-width:200px;font-size:13px">${r.top.map(p => esc(p.n)).join(", ")}${r.oldRB.length ? `<div class="muted" style="font-size:11px">Aging RBs: ${r.oldRB.map(p => esc(p.n)).join(", ")}</div>` : ""}</td>
      <td class="n">${r.firsts}</td><td class="n">${r.seconds}</td><td><span class="pill">${window_(r)}</span></td></tr>`).join("")}
  </tbody></table></div>`;
  const legend = vals ? `<p class="note">${Object.entries(posCol).map(([p, c]) => `<span class="chip" style="background:${c}"></span>${p}`).join(" &nbsp; ")} · Values from FantasyCalc's dynasty trade market, matched to your league's QB format and scoring. Picks counted from Sleeper's traded-pick ledger for the next three rookie drafts (${rookieRounds} rounds).</p>`
    : `<p class="note">Dynasty trade values couldn't be loaded, so teams are sorted by age. Picks counted from Sleeper's traded-pick ledger.</p>`;
  return `<div class="section-h"><div><div class="eyebrow">Built for the long game</div><h2>Dynasty Outlook</h2></div></div>
    <div class="stack">${table}${legend}</div>`;
}

function kickoffText(g) {

function oppLine(p, isPast) {

function playerForm(pid) {
  const s = M.cur, avg = s.pAvg[pid], log = (s.pLog[pid] || []).filter(x => x.week < (STATE.gd?.week || 99));

  return `Avg ${fmt(avg)}${l3.length ? ` · L3 ${fmt(mean(l3))}${trend}` : ""}`;
}
const statusWord = st => st === "pre" ? "Yet to play" : st === "live" ? "Playing" : "Final";

function h2hCell(p, side, isPast, win) {
  if (!p) return `<div class="hc h${side}"></div>`;

function benchQuip(side) {
  const done = side.bench.filter(b => b.actual > 0).sort((a, b) => b.actual - a.actual);
  for (const b of done) {
    const pos = ppos(b.pid);
    const worse = side.players.filter(p => p.pid && p.pid !== "0" && ppos(p.pid) === pos && p.status === "done" && p.actual < b.actual).sort((a, b) => a.actual - b.actual)[0];
    if (worse) return `Coach's decision: ${pname(b.pid)} put up ${fmt(b.actual)} on the bench while ${pname(worse.pid)} started and scored ${fmt(worse.actual)}.`;
  }
  return "";
}

function stakesLine(mu, s, gd) {
  const o = STATE.odds;
  if (!o || gd.isPast || gd.week !== o.week) return "";
  return [mu.a, mu.b].filter(x => (s.rec[x.rid]?.rank ?? 99) <= 9).map(x => {
    const r = o.res[x.rid]; if (r?.ifWin == null) return "";
    const pool = r.ifWin >= 0.97 ? STAKES_LOCK : r.ifWin < 0.05 ? STAKES_LONG : STAKES;
    return " " + fresh(pool, x.oid + gd.week + "stakes", teamName(x.oid), pct(r.ifWin), pct(r.playoff));
  }).join("");
}
function viewMatch(s, gd, mid) {

      <div class="sb-score mono">${fmt(x.pts, 2)}</div>${isPast ? "" : `<div class="sb-proj mono">proj ${fmt(x.final)}</div>`}</div>`;
  const n = Math.max(a.players.length, b.players.length);

  const benchCol = x => {

  };
  const quips = [benchQuip(a), benchQuip(b)].filter(Boolean);
  const blurb = (isPast ? recapBlurb(mu, s.year, gd.week) : previewBlurb(mu, STATE.odds, s.year, gd.week)) + stakesLine(mu, s, gd);

      <div class="h2h-grid">${rows}<div class="hrow total"><div class="hc hl"><div class="hn"><div class="hpn">Total</div></div><div class="hpts"><div class="mono">${fmt(a.pts, 2)}</div></div></div><div class="hslot"></div><div class="hc hr"><div class="hn"><div class="hpn">Total</div></div><div class="hpts"><div class="mono">${fmt(b.pts, 2)}</div></div></div></div></div>
    </section>

      <div class="grid g2">${benchCol(a)}${benchCol(b)}</div></section>`;
}

/* ---------------- draft pick ledger (shared) ---------------- */
function picksLedger(s) {
  const first = ["pre_draft", "drafting"].includes(s.league.status) ? +s.year : +s.year + 1;
  const seasons = [0, 1, 2].map(i => String(first + i));
  const rounds = (s.raw.drafts.find(d => (d.settings?.rounds || 99) <= 6)?.settings?.rounds) || (s.set.draft_rounds && s.set.draft_rounds <= 6 ? s.set.draft_rounds : 4);
  const owned = {};
  for (const r of s.raw.rosters) for (const yr of seasons) for (let rd = 1; rd <= rounds; rd++) (owned[r.roster_id] ||= []).push({ season: yr, round: rd, orig: r.roster_id });
  for (const t of s.raw.traded) {
    if (!seasons.includes(String(t.season)) || t.round > rounds) continue;
    for (const rid of Object.keys(owned)) owned[rid] = owned[rid].filter(p => !(p.season === String(t.season) && p.round === t.round && p.orig === t.roster_id));
    (owned[t.owner_id] ||= []).push({ season: String(t.season), round: t.round, orig: t.roster_id });
  }
  for (const k of Object.keys(owned)) owned[k].sort((a, b) => a.season.localeCompare(b.season) || a.round - b.round || a.orig - b.orig);
  return { seasons, rounds, owned };
}

/* ---------------- franchises ---------------- */
const POS_ORDER = { QB: 1, RB: 2, WR: 3, TE: 4, K: 5, DEF: 6 };
const slotLabel = sl => ({ SUPER_FLEX: "SF", FLEX: "FLX", REC_FLEX: "R-FLX", WRRB_FLEX: "W/R", IDP_FLEX: "IDP" }[sl] || sl);
function teamsAlpha() {
  return [...M.cur.raw.rosters].map(r => ({ rid: r.roster_id, oid: M.cur.ownerOf[r.roster_id] })).sort((a, b) => teamName(a.oid).localeCompare(teamName(b.oid)));
}
function teamPicker(selRid) {
  return `<div class="picker"><label class="eyebrow" for="team-pick">${selRid ? "Switch franchise" : "Pick a franchise"}</label>
    <select id="team-pick" class="sel"><option value="">Choose a team…</option>${teamsAlpha().map(t => `<option value="${t.rid}"${t.rid === selRid ? " selected" : ""}>${esc(teamName(t.oid))}</option>`).join("")}</select></div>`;
}

function viewFranchises() {
  if (STATE.team != null && M.cur.raw.rosters.some(r => r.roster_id === STATE.team)) return viewTeam(STATE.team);
  const s = M.cur, at = M.allTime;
  const tiles = teamsAlpha().map(t => {
    const r = s.rec[t.rid], a = at[t.oid] || {};
    return `<a class="ftile" href="#team-${t.rid}" style="--team:${color(t.oid)}">${avatarHTML(t.oid)}<div style="min-width:0"><div class="tname">${esc(teamName(t.oid))}</div>
      <div class="mgr">${r && r.results.length ? `${recStr(r)} · ${ordinal(r.rank)}` : "No games yet"}${a.titles ? ` · ${"🏆".repeat(Math.min(a.titles, 5))}` : ""}</div></div><span class="arrow" aria-hidden="true">→</span></a>`;
  }).join("");
  return `<div class="section-h"><div><div class="eyebrow">${plural(s.raw.rosters.length, "team")} · ${s.year}</div><h2>Franchises</h2></div>${teamPicker(null)}</div>
    <div class="ftiles">${tiles}</div>`;
}

const POS_COL = { QB: "hsl(352 62% 54%)", RB: "hsl(158 52% 40%)", WR: "hsl(212 66% 54%)", TE: "hsl(32 86% 50%)", K: "hsl(220 10% 55%)", DEF: "hsl(268 45% 56%)" };
const posColor = pid => POS_COL[ppos(pid)] || "var(--muted)";
const injTag = p => p?.inj ? `<span class="inj" title="Injury status">${esc(p.inj)}</span>` : "";

function playerCard(pid, slot, s) {
  if (!pid || pid === "0") return `<div class="pcard empty"><span class="slotb">${esc(slotLabel(slot))}</span><div class="pn">Empty slot</div><div class="pm">Someone forgot to set a lineup.</div></div>`;
  const p = M.players[pid] || {}, ppg = s.pAvg[pid];
  return `<div class="pcard" style="--pos:${posColor(pid)}"><span class="slotb">${esc(slotLabel(slot))}</span>${injTag(p)}
    <div class="pn">${esc(pname(pid))}</div>
    <div class="pm">${esc(ppos(pid))}${pteam(pid) ? " · " + esc(pteam(pid)) : ""}${p.age ? ` · ${p.age} yo` : ""}${p.exp === 0 ? ' · <span class="rk">Rookie</span>' : ""}</div>
    <div class="pp">${ppg ? `${fmt(ppg)}<small> ppg</small>` : `<span class="muted" style="font-size:13px">No points yet</span>`}</div></div>`;
}
function benchRow(pid, s) {
  const p = M.players[pid] || {}, ppg = s.pAvg[pid];
  return `<li><div style="min-width:0"><div class="bn">${esc(pname(pid))}${p.exp === 0 ? ' <span class="rk">R</span>' : ""}</div><div class="bm">${esc(pteam(pid) || "FA")}${p.age ? ` · ${p.age} yo` : ""}${injTag(p)}</div></div><div class="bp mono">${ppg ? fmt(ppg) : "–"}</div></li>`;
}

function viewTeam(rid) {
  const s = M.cur, oid = s.ownerOf[rid], roster = s.raw.rosters.find(r => r.roster_id === rid);
  const r = s.rec[rid], a = M.allTime[oid] || {}, odds = STATE.odds?.res[rid];
  const starters = roster.starters || [];
  const reserve = roster.reserve || [], taxi = roster.taxi || [];
  const startSet = new Set(starters), rs = new Set(reserve), ts = new Set(taxi);
  const byPpg = (x, y) => (s.pAvg[y] || 0) - (s.pAvg[x] || 0) || (M.players[x]?.age || 99) - (M.players[y]?.age || 99);
  const bench = (roster.players || []).filter(p => !startSet.has(p) && !rs.has(p) && !ts.has(p));

  // roster at a glance
  const live = starters.filter(p => p && p !== "0");
  const ages = live.map(p => M.players[p]?.age).filter(Boolean);
  const avgAge = mean(ages);
  const mvp = [...(roster.players || [])].sort(byPpg)[0];
  const youngest = [...live].filter(p => M.players[p]?.age).sort((x, y) => M.players[x].age - M.players[y].age)[0];
  const rookies = (roster.players || []).filter(p => M.players[p]?.exp === 0).length;
  const ageQuip = !ages.length ? "" : avgAge >= 27.5 ? "Lineup qualifies for the senior discount." : avgAge >= 26.5 ? "Veteran savvy. Knees optional." : avgAge <= 24.5 ? "Half this lineup is still on a parent's phone plan." : "Right in the sweet spot.";
  const glance = [
    mvp && s.pAvg[mvp] ? ["Team MVP", esc(pname(mvp)), `${fmt(s.pAvg[mvp])} ppg`] : null,
    ages.length ? ["Avg starter age", fmt(avgAge, 1), ageQuip] : null,
    youngest ? ["Youngest starter", esc(pname(youngest)), `${M.players[youngest].age} years old`] : null,
    ["Rookies on roster", String(rookies), rookies >= 5 ? "Running a daycare." : rookies === 0 ? "No patience for kids." : "Investing in the future."]
  ].filter(Boolean);

  // bench grouped by position
  const groups = {};
  for (const p of bench) (groups[ppos(p) || "Other"] ||= []).push(p);
  const benchHTML = Object.keys(groups).sort((x, y) => (POS_ORDER[x] || 9) - (POS_ORDER[y] || 9)).map(pos => `<div class="bgroup" style="--pos:${POS_COL[pos] || "var(--muted)"}"><div class="bh"><span>${esc(pos)}</span><span class="mono muted">${groups[pos].length}</span></div><ul>${groups[pos].sort(byPpg).map(p => benchRow(p, s)).join("")}</ul></div>`).join("");
  const stashHTML = [["Taxi squad", taxi], ["Injured reserve", reserve]].filter(([, l]) => l.length).map(([t, l]) => `<div class="bgroup stash"><div class="bh"><span>${t}</span><span class="mono muted">${l.length}</span></div><ul>${[...l].sort(byPpg).map(p => benchRow(p, s)).join("")}</ul></div>`).join("");

  // picks
  const L = picksLedger(s);
  const mine = L.owned[rid] || [];
  const gone = L.seasons.flatMap(yr => range(1, L.rounds).map(rd => ({ season: yr, round: rd }))).filter(p => !mine.some(m => m.season === p.season && m.round === p.round && m.orig === rid))
    .map(p => { const holder = Object.entries(L.owned).find(([, list]) => list.some(m => m.season === p.season && m.round === p.round && m.orig === rid)); return { ...p, to: holder ? +holder[0] : null }; });
  const pickCols = L.seasons.map(yr => {
    const list = mine.filter(p => p.season === yr);
    return `<div class="pickcol"><div class="pick-yr">${yr}</div>${list.length ? list.map(p => `<div class="ticket ${p.round === 1 ? "r1" : ""}"><div class="tr">R${p.round}</div><div class="tv">${p.orig === rid ? "Own pick" : "via " + esc(teamName(s.ownerOf[p.orig]))}</div></div>`).join("") : `<div class="muted" style="font-size:13px">Cupboard's empty.</div>`}</div>`;
  }).join("");
  const firsts = mine.filter(p => p.round === 1).length;
  const pickQuip = firsts >= 4 ? "Hoarding first-rounders like it's a doomsday bunker." : firsts === 0 ? "Zero first-rounders. Win-now or bust, apparently." : gone.length === 0 ? "Hasn't moved a single pick. Patience, or paralysis?" : "";
  const drafts = M.seasons.flatMap(x => x.raw.drafts.map(d => ({ d, picks: x.raw.draftPicks[d.draft_id] }))).filter(x => x.d.status === "complete" && x.picks?.length && (x.d.settings?.rounds || 99) <= 6).sort((p, q) => (q.d.start_time || 0) - (p.d.start_time || 0));
  const per = s.league.total_rosters || s.raw.rosters.length;
  const haul = drafts[0] ? drafts[0].picks.filter(p => p.picked_by === oid || p.roster_id === rid).sort((p, q) => p.pick_no - q.pick_no) : [];
  const nm = p => p.metadata?.first_name ? `${p.metadata.first_name} ${p.metadata.last_name}` : pname(p.player_id);

  const stat = (lbl, v) => `<div class="tstat"><div class="lbl">${lbl}</div><div class="v">${v}</div></div>`;
  const quip = r && r.results.length ? formQuip(r) : "";
  return `<div class="team-top"><a class="back" href="#franchises">← All franchises</a>${teamPicker(rid)}</div>
  <header class="team-band" style="--team:${color(oid)}">
    <div class="tb-main">${avatarHTML(oid, "av big")}<div style="min-width:0"><div class="eyebrow">Franchise since ${O(oid).seasons[0] || s.year}</div><h2>${esc(teamName(oid))}</h2>${quip ? `<p class="tquip">${esc(quip)}</p>` : ""}</div></div>
    <div class="tstats">
      ${r && r.results.length ? stat(`${s.year}`, `${recStr(r)} <small>${ordinal(r.rank)}</small>`) + stat("Points for", fmt(r.pf)) : ""}
      ${odds ? stat("Playoff odds", pct(odds.playoff)) : ""}
      ${a.g ? stat("All-time", `${a.w}-${a.l}${a.t ? "-" + a.t : ""}`) : ""}
      ${stat("Titles", a.titles ? "🏆".repeat(Math.min(a.titles, 5)) : "0")}
    </div>
  </header>
  <div class="glance">${glance.map(([l, v, d]) => `<div><div class="lbl">${l}</div><div class="gv">${v}</div><div class="gd">${esc(d)}</div></div>`).join("")}</div>
  <div class="stack" style="gap:32px;margin-top:28px">
    <section><div class="sect-h"><h3>Starting Lineup</h3><p>As set in Sleeper right now</p></div><div class="pcards">${starters.map((pid, i) => playerCard(pid, s.slots[i] || "", s)).join("")}</div></section>
    ${bench.length || stashHTML ? `<section><div class="sect-h"><h3>The Bench</h3><p>${plural(bench.length, "player")} waiting for their moment, sorted by points per game</p></div><div class="bgroups">${benchHTML}${stashHTML}</div></section>` : ""}
    <section><div class="sect-h"><h3>Draft Capital</h3><p>${pickQuip || `${plural(mine.length, "pick")} over the next three drafts`}</p></div>
      <div class="pickgrid">${pickCols}</div>
      ${gone.length ? `<p class="note" style="margin:14px 0 0">Shipped out: ${gone.map(p => `${p.season} R${p.round}${p.to ? ` (now with ${esc(teamName(s.ownerOf[p.to]))})` : ""}`).join(", ")}.</p>` : ""}
      ${haul.length ? `<p class="note" style="margin:6px 0 0">Last rookie draft (${drafts[0].d.season}): ${haul.map(p => `${p.round}.${String(((p.pick_no - 1) % per) + 1).padStart(2, "0")} ${esc(nm(p))}`).join(", ")}.</p>` : ""}
    </section>
  </div>`;
}

/* ---------------- rookie draft order projection ----------------
   League rule: picks 1 to (teams - playoff teams) go to non-playoff teams, lowest Max PF first.
   The rest go to playoff teams in order of elimination; the champion picks last.
   Teams knocked out in the same round are ordered by Max PF, lowest first. */
const maxPF = (season, rid) => { const r = season.raw.rosters.find(x => x.roster_id === rid); const st = r?.settings || {}; return (+st.ppts || 0) + (+st.ppts_decimal || 0) / 100; };

function draftProjection(season, gd) {
  const pt = season.set.playoff_teams || 6, pws = season.pws;
  const rids = season.standings.map(r => r.rid), T = rids.length;
  const lgScores = season.standings.flatMap(r => r.scores.map(s => s.pts));
  const lgMean = mean(lgScores) || 100, lgSd = sd(lgScores) || 22;
  const dist = {}, gap = {}, mpf0 = {};
  for (const r of season.standings) {
    const s = r.scores.map(x => x.pts), n = s.length;
    const m = n ? (n * mean(s) + 3 * lgMean) / (n + 3) : lgMean;
    dist[r.rid] = { m, s: Math.max(14, n >= 3 ? sd(s) : lgSd) };
    mpf0[r.rid] = maxPF(season, r.rid);
    gap[r.rid] = n ? Math.max(0, mpf0[r.rid] / n - mean(s)) : 15;   // how much a team typically leaves on its bench
  }
  const regDone = season.lastDone >= pws - 1;
  const remain = [];
  if (!regDone) for (let w = (season.lastDone || 0) + 1; w < pws; w++) {
    const by = {}; for (const e of season.raw.weeks[w] || []) if (e.matchup_id != null) (by[e.matchup_id] ||= []).push(e.roster_id);
    remain.push({ w, pairs: Object.values(by).filter(p => p.length === 2) });
  }
  const wb = (season.raw.wb || []).filter(m => m.r);
  const useWB = regDone && wb.some(m => m.t1 && m.t2);
  const byes = pt > 1 ? Math.pow(2, Math.ceil(Math.log2(pt))) - pt : 0;
  const play = (x, y) => (dist[x].m + dist[x].s * randn()) > (dist[y].m + dist[y].s * randn()) ? [x, y] : [y, x];
  const known = (x, y) => { const m = wb.find(m => m.w && ((m.t1 === x && m.t2 === y) || (m.t1 === y && m.t2 === x))); return m ? [m.w, m.l] : null; };

  const N = regDone && season.complete ? 1 : CONFIG.SIMULATIONS;
  const count = Object.fromEntries(rids.map(r => [r, new Array(T).fill(0)]));
  const base = Object.fromEntries(season.standings.map(r => [r.rid, { w: r.w + r.t / 2, pf: r.pf }]));
  const mpfSum = Object.fromEntries(rids.map(r => [r, 0])), madePO = Object.fromEntries(rids.map(r => [r, 0]));

  for (let n = 0; n < N; n++) {
    const st = {}; for (const r of rids) st[r] = { rid: r, w: base[r].w, pf: base[r].pf, mpf: mpf0[r] };
    for (const { w, pairs } of remain) {
      const sc = {};
      for (const r of rids) { const live = gd && gd.week === w && !gd.isPast ? gd.sides[r] : null; sc[r] = live ? live.final + Math.sqrt(live.v) * randn() : dist[r].m + dist[r].s * randn(); }
      for (const [x, y] of pairs) { if (!st[x] || !st[y]) continue; if (sc[x] > sc[y]) st[x].w++; else st[y].w++; st[x].pf += sc[x]; st[y].pf += sc[y]; }
      if (season.medianGame) { const med = median(Object.values(sc)); for (const r of rids) if (sc[r] > med) st[r].w++; }
      for (const r of rids) st[r].mpf += sc[r] + gap[r] * (0.7 + 0.6 * Math.random());
    }
    // playoff field + elimination round
    const elim = {};   // rid -> round eliminated (higher = later); champion gets 99
    let field;
    if (useWB) {
      field = [...new Set(wb.flatMap(m => [m.t1, m.t2]).filter(x => typeof x === "number"))];
      const res = {};
      for (const m of [...wb].sort((a, b) => a.r - b.r || a.m - b.m)) {
        const side = (t, from) => t ?? (from?.w != null ? res[from.w]?.[0] : from?.l != null ? res[from.l]?.[1] : null);
        const x = side(m.t1, m.t1_from), y = side(m.t2, m.t2_from);
        if (x == null || y == null) continue;
        const out = m.w ? [m.w, m.l] : play(x, y);
        res[m.m] = out;
        const main = m.p == null || m.p === 1;
        if (main && !(out[1] in elim)) elim[out[1]] = m.r;
        if (m.p === 1) elim[out[0]] = 99;
      }
    } else {
      const order = Object.values(st).sort((a, b) => b.w - a.w || b.pf - a.pf).map(t => t.rid);
      field = order.slice(0, pt);
      const seed = Object.fromEntries(order.map((r, i) => [r, i]));
      let alive = field.slice(byes), waiting = field.slice(0, byes), round = 1;
      while (alive.length + waiting.length > 1) {
        const pool = [...waiting, ...alive].sort((a, b) => seed[a] - seed[b]);
        const playing = round === 1 ? alive.sort((a, b) => seed[a] - seed[b]) : pool;
        const next = round === 1 ? [...waiting] : [];
        for (let i = 0; i < playing.length / 2; i++) {
          const x = playing[i], y = playing[playing.length - 1 - i];
          const [win, lose] = known(x, y) || play(x, y);
          elim[lose] = round; next.push(win);
        }
        if (playing.length % 2) next.push(playing[(playing.length - 1) / 2]);
        alive = next; waiting = []; round++;
        if (alive.length === 1) { elim[alive[0]] = 99; break; }
      }
    }
    const inPO = new Set(field);
    const non = rids.filter(r => !inPO.has(r)).sort((a, b) => st[a].mpf - st[b].mpf);
    const po = [...field].sort((a, b) => (elim[a] ?? 0) - (elim[b] ?? 0) || st[a].mpf - st[b].mpf);
    [...non, ...po].forEach((r, i) => { count[r][i]++; });
    for (const r of rids) { mpfSum[r] += st[r].mpf; if (inPO.has(r)) madePO[r]++; }
  }
  const out = rids.map(r => {
    const p = count[r].map(c => c / N);
    const exp = p.reduce((a, x, i) => a + x * (i + 1), 0);
    const best = p.indexOf(Math.max(...p));
    return { rid: r, p, exp, best, mpf: mpfSum[r] / N, mpfNow: mpf0[r], playoff: madePO[r] / N };
  }).sort((a, b) => a.exp - b.exp);
  return { teams: out, T, pt, nonPO: T - pt, final: N === 1, weeksLeft: remain.length };
}

/* ---------------- draft returns: starter points each franchise got from its own rookie picks ---------------- */
function draftReturns() {
  // points a player scored while in a franchise's starting lineup, keyed owner -> player
  const started = {};
  for (const s of M.seasons) for (const [wk, entries] of Object.entries(s.raw.weeks)) {
    if (+wk > s.lastDone) continue;
    for (const e of entries || []) {
      if (e.matchup_id == null) continue;
      const oid = s.ownerOf[e.roster_id], st = e.starters || [];
      st.forEach((pid, i) => { if (!pid || pid === "0") return; const p = +(e.starters_points?.[i] ?? e.players_points?.[pid] ?? 0) || 0; const key = `${oid}|${pid}`, row = (started[key] ||= {}); row[s.year] = (row[s.year] || 0) + p; });
    }
  }
  const cur = M.cur, curOwner = {};
  for (const r of cur.raw.rosters) for (const pid of r.players || []) curOwner[pid] = cur.ownerOf[r.roster_id];
  const picks = [];
  for (const s of M.seasons) for (const d of s.raw.drafts) {
    if (d.status !== "complete" || (d.settings?.rounds || 99) > 6) continue;   // rookie drafts only; the startup was on Yahoo
    const T = d.settings?.teams || s.raw.rosters.length;
    for (const p of s.raw.draftPicks[d.draft_id] || []) {
      const oid = M.owners[p.picked_by] ? p.picked_by : s.ownerOf[p.roster_id];
      if (!oid || !p.player_id) continue;
      const nm = p.metadata?.first_name ? `${p.metadata.first_name} ${p.metadata.last_name}` : pname(p.player_id);
      picks.push({ oid, pid: p.player_id, name: nm, pos: p.metadata?.position || ppos(p.player_id), season: d.season, label: pickLabel(p.round, p.draft_slot || (((p.pick_no - 1) % T) + 1)), pts: sum(Object.entries(started[`${oid}|${p.player_id}`] || {}).filter(([yr]) => +yr >= +d.season).map(([, v]) => v)), kept: curOwner[p.player_id] === oid });
    }
  }
  const teams = {};
  for (const p of picks) { const t = teams[p.oid] ||= { oid: p.oid, pts: 0, n: 0, hits: 0, best: null, list: [] }; t.pts += p.pts; t.n++; if (p.pts > 0) t.hits++; t.list.push(p); if (!t.best || p.pts > t.best.pts) t.best = p; }
  return { teams: Object.values(teams).sort((a, b) => b.pts - a.pts), picks: [...picks].sort((a, b) => b.pts - a.pts) };
}

function returnsSection() {
  const R = draftReturns();
  if (!R.teams.length) return "";
  const max = Math.max(1, ...R.teams.map(t => t.pts));
  const rows = R.teams.map((t, i) => `<tr><td class="n">${i + 1}</td><td>${teamCell(t.oid)}</td>
    <td style="min-width:200px"><div class="rbar" style="height:22px"><i style="width:${t.pts / max * 100}%;background:${color(t.oid)}"></i><b style="line-height:22px">${fmt(t.pts)}</b></div></td>
    <td class="n">${t.n}</td><td class="n">${t.hits}</td><td class="n">${fmt(t.pts / Math.max(1, t.n))}</td>
    <td style="white-space:normal;min-width:180px;font-size:13px">${t.best && t.best.pts > 0 ? `<b>${esc(t.best.name)}</b> <span class="muted">${esc(t.best.season)} ${esc(t.best.label)} · ${fmt(t.best.pts)} pts</span>` : '<span class="muted">Still waiting on the first point</span>'}</td></tr>`).join("");
  const top = R.teams[0], bot = R.teams[R.teams.length - 1];
  const topQ = fresh([(T) => `${T} drafts like they've seen next season's box scores.`, (T) => `${T}'s scouting department deserves a raise.`, (T) => `${T} is turning rookie picks into actual points. Revolutionary.`], top.oid + "rt", teamName(top.oid));
  if (top.pts <= 0) return section("returns", "Draft Returns", "Points each franchise has gotten from its own rookie picks", `<div class="panel"><p class="tquip" style="margin:0">No rookie pick has scored a point in its drafter's starting lineup yet. Patience is a virtue, allegedly.</p></div>`);
  const botQ = bot !== top ? fresh([(T, x) => `${T}'s draftees have produced ${x} points for them. The scouting department has been notified.`, (T, x) => `${T}: ${x} points from their own picks. The draft board might have been upside down.`, (T, x) => `${T} is ${x} points deep on draft returns. Thoughts and prayers to the war room.`], bot.oid + "rb", teamName(bot.oid), fmt(bot.pts)) : "";
  const best = R.picks.filter(p => p.pts > 0).slice(0, 8);
  const bestHTML = best.length ? `<h4 class="mini" style="margin-top:22px">Most productive draftees</h4><div class="tbl-wrap"><table><thead><tr><th>Player</th><th>Drafted by</th><th>Pick</th><th class="n">Points for them</th><th>Status</th></tr></thead><tbody>
    ${best.map(p => `<tr><td style="font-weight:600">${esc(p.name)} <span class="muted" style="font-size:12px">${esc(p.pos)}</span></td><td>${esc(teamName(p.oid))}</td><td class="mono">${esc(p.season)} ${esc(p.label)}</td><td class="n">${fmt(p.pts)}</td><td>${p.kept ? '<span class="pill in">Still on roster</span>' : '<span class="pill">Moved on</span>'}</td></tr>`).join("")}</tbody></table></div>` : "";

/* ---------------- draft tab ---------------- */
function pickLabel(round, slot) { return `${round}.${String(slot).padStart(2, "0")}`; }

function viewDraft() {
  const cur = M.cur;
  // which season decides the next rookie draft?
  const preDraft = ["pre_draft", "drafting"].includes(cur.league.status) && M.seasons.length > 1;
  const basis = preDraft ? M.seasons[M.seasons.length - 2] : cur;
  const draftYear = basis.year + 1;
  const started = basis.lastDone >= 1 || basis.complete;
  const proj = started ? (STATE.draftProj ||= draftProjection(basis, basis === cur ? STATE.curGd : null)) : null;
  const L = picksLedger(cur);
  const rounds = L.rounds;
  const ownerOfPick = (orig, round) => { for (const [rid, list] of Object.entries(L.owned)) if (list.some(p => p.season === String(draftYear) && p.round === round && p.orig === orig)) return +rid; return orig; };
  const ownerInBasis = rid => basis.ownerOf[rid];
  const tName = rid => teamName(cur.ownerOf[rid] || ownerInBasis(rid));
  const tColor = rid => color(cur.ownerOf[rid] || ownerInBasis(rid));
  const out = [];

  // ---- projected order
  if (proj) {
    const order = proj.teams;   // sorted by expected pick
    const heat = p => p.map((x, i) => `<i style="background:color-mix(in srgb, var(--accent) ${Math.round(Math.min(1, x * 1.6) * 100)}%, var(--surface-2))" title="${pickLabel(1, i + 1)}: ${pct(x)}"></i>`).join("");
    const range = t => { const lo = t.p.findIndex(x => x >= 0.05), hi = t.p.length - 1 - [...t.p].reverse().findIndex(x => x >= 0.05); return lo === hi ? pickLabel(1, lo + 1) : `${pickLabel(1, lo + 1)}–${pickLabel(1, hi + 1)}`; };
    const rows = order.map((t, i) => {
      const own = ownerOfPick(t.rid, 1);
      const later = range1(rounds).slice(1).map(rd => ({ rd, o: ownerOfPick(t.rid, rd) })).filter(x => x.o !== t.rid);
      const isPO = t.playoff >= 0.5;
      return `<tr class="${i === proj.nonPO ? "cut" : ""}"><td class="slotcell"><span class="big-pick">${pickLabel(1, i + 1)}</span></td>
        <td><div class="teamcell">${avatarHTML(cur.ownerOf[t.rid] || ownerInBasis(t.rid))}<div style="min-width:0"><div style="font-weight:600">${esc(tName(t.rid))}</div>${own !== t.rid ? `<div class="via">Pick owned by <b>${esc(tName(own))}</b></div>` : ""}${later.length ? `<div class="via">${later.map(x => `R${x.rd} → ${esc(tName(x.o))}`).join(" · ")}</div>` : ""}</div></div></td>
        <td class="n">${proj.final ? "Locked" : `<span class="mono">${pickLabel(1, t.best + 1)}</span> <span class="via">${pct(t.p[t.best])}</span>`}</td><td class="n mono">${proj.final ? "" : range(t)}</td><td class="n">${proj.final ? "" : pct(sum(t.p.slice(0, proj.nonPO)))}</td>
        <td class="n">${fmt(t.mpfNow)}${proj.final ? "" : `<div class="via">proj ${fmt(t.mpf)}</div>`}</td>
        <td>${proj.final ? (isPO ? '<span class="pill in">Playoffs</span>' : '<span class="pill">Non-playoff</span>') : `<div class="heat">${heat(t.p)}</div>`}</td></tr>`;
    }).join("");
    const head = `<thead><tr><th>Pick</th><th>Team</th><th class="n">${proj.final ? "" : "Most likely"}</th><th class="n">${proj.final ? "" : "Likely range"}</th><th class="n">${proj.final ? "" : `Top-${proj.nonPO} pick`}</th><th class="n">Max PF</th><th>${proj.final ? "" : `Chance of each first-round slot (1.01 → ${pickLabel(1, proj.T)})`}</th></tr></thead>`;
    out.push(section("order", proj.final ? `${draftYear} Draft Order` : `Projected ${draftYear} Draft Order`,

      `<div class="tbl-wrap"><table class="draftorder">${head}<tbody>${rows}</tbody></table></div>
      ${proj.final ? "" : `<p class="note" style="margin:0 0 4px">Teams are listed by their average landing spot across all simulations. "Most likely" is the single slot they land in most often, and "Top-${proj.nonPO} pick" is the chance they miss the playoffs.</p>`}
      <p class="note">Picks 1.01–${pickLabel(1, proj.nonPO)} go to non-playoff teams, lowest Max PF first. Picks ${pickLabel(1, proj.nonPO + 1)}–${pickLabel(1, proj.T)} go to playoff teams in order of elimination, and the champion picks ${pickLabel(1, proj.T)}. Teams knocked out in the same round are ordered by Max PF, lowest first. Max PF is the most a team could have scored with a perfect lineup every week. Later rounds follow the same order.</p>`));

    // ---- the 1.01 race
    const racers = [...proj.teams].filter(t => t.p[0] >= 0.01 || (proj.final && t === proj.teams[0])).sort((a, b) => b.p[0] - a.p[0]).slice(0, 5);
    if (racers.length) {
      const top = racers[0], maxM = Math.max(...racers.map(t => t.mpfNow), 1);
      const quip = proj.final ? `${tName(top.rid)} won the race to the bottom. Enjoy the 1.01, you earned it (by not earning anything).`
        : top.p[0] > 0.6 ? `${tName(top.rid)} is running away with it. Nobody has ever wanted to lose this badly.`

      out.push(section("race101", "The Race for 1.01", "Lowest Max PF among teams that miss the playoffs wins the top pick",
        `<div class="panel"><div class="race">${racers.map(t => `<div class="racer"><span class="fn">${esc(tName(t.rid))}</span><span class="rbar"><i style="width:${t.mpfNow / maxM * 100}%;background:${tColor(t.rid)}"></i><b>${fmt(t.mpfNow)} max PF</b></span><span class="mono rp">${proj.final ? "" : pct(t.p[0])}</span></div>`).join("")}</div><p class="tquip" style="margin-top:12px">${esc(quip)}</p></div>`));
    }
  } else {
    out.push(section("order", `${draftYear} Draft Order`, "", `<div class="panel"><p class="muted" style="margin:0">Projections start once week 1 is in the books. Until then, everyone's tied for the 1.01 and everyone's a contender. Both are lies.</p></div>`));
  }

  // ---- draft capital for the upcoming draft
  const cap = cur.raw.rosters.map(r => { const mine = (L.owned[r.roster_id] || []).filter(p => p.season === String(draftYear)); return { rid: r.roster_id, mine, firsts: mine.filter(p => p.round === 1).length }; })
    .sort((a, b) => b.firsts - a.firsts || b.mine.length - a.mine.length || tName(a.rid).localeCompare(tName(b.rid)));
  const capHTML = `<div class="capgrid">${cap.map(c => `<div class="capcard" style="--team:${tColor(c.rid)}"><div class="fn">${esc(tName(c.rid))}</div><div class="caprow">${range1(rounds).map(rd => { const n = c.mine.filter(p => p.round === rd).length; return `<span class="capchip ${rd === 1 ? "r1" : ""} ${n === 0 ? "none" : ""}" title="Round ${rd}: ${n}">R${rd}${n > 1 ? `×${n}` : n === 0 ? "×0" : ""}</span>`; }).join("")}</div>${c.mine.some(p => p.orig !== c.rid) ? `<div class="via">Extra: ${c.mine.filter(p => p.orig !== c.rid).map(p => `R${p.round} from ${esc(tName(p.orig))}`).join(", ")}</div>` : ""}</div>`).join("")}</div>`;
  const richest = cap[0], broke = cap.filter(c => c.firsts === 0);
  out.push(section("capital", "Who's Holding Picks", `${draftYear} draft, all rounds`, capHTML + `<p class="note">${richest.firsts >= 2 ? `${esc(tName(richest.rid))} has ${richest.firsts} first-rounders and a lot of explaining to do. ` : ""}${broke.length ? `${broke.map(c => esc(tName(c.rid))).join(", ")} ${broke.length === 1 ? "has" : "have"} no first. Bold.` : "Everyone still has a first. How wholesome."}</p>`));

  // ---- past drafts
  // The startup draft happened on Yahoo; the Sleeper copy was a random import, so only rookie drafts are shown.
  const past = M.seasons.flatMap(x => x.raw.drafts.filter(d => d.status === "complete" && (d.settings?.rounds || 99) <= 6).map(d => ({ d, season: x, picks: x.raw.draftPicks[d.draft_id] || [] }))).filter(x => x.picks.length)
    .sort((a, b) => (+b.d.season - +a.d.season) || (b.d.start_time || 0) - (a.d.start_time || 0));
  if (past.length) {
    const sel = past.find(x => x.d.draft_id === STATE.pastDraft) || past[0];
    const kind = x => (x.d.settings?.rounds || 0) > 6 ? "Startup" : "Rookie";
    const tabs = past.map(x => `<button class="btn" type="button" data-draft="${esc(x.d.draft_id)}" aria-pressed="${x === sel}">${esc(x.d.season)} Rookie</button>`).join("");
    const T = sel.d.settings?.teams || sel.season.raw.rosters.length;
    const rds = Math.max(...sel.picks.map(p => p.round));
    const nm = p => p.metadata?.first_name ? `${p.metadata.first_name} ${p.metadata.last_name}` : pname(p.player_id);
    const pos = p => p.metadata?.position || ppos(p.player_id);
    const who = p => { const o = M.owners[p.picked_by] ? p.picked_by : sel.season.ownerOf[p.roster_id]; return o; };
    const slotOf = p => p.draft_slot || (((p.pick_no - 1) % T) + 1);
    const cell = {}; for (const p of sel.picks) cell[`${p.round}-${slotOf(p)}`] = p;
    const board = `<div class="board-wrap"><div class="board" style="grid-template-columns:44px repeat(${T}, minmax(118px,1fr))">
      <div class="bhd"></div>${range1(T).map(i => `<div class="bhd">${i}</div>`).join("")}
      ${range1(rds).map(rd => `<div class="brd">R${rd}</div>${range1(T).map(sl => { const p = cell[`${rd}-${sl}`]; if (!p) return `<div class="bcell empty"></div>`;
        const o = who(p), ppg = M.cur.pAvg[p.player_id];
        return `<div class="bcell" style="--pos:${POS_COL[pos(p)] || "var(--muted)"}"><div class="bpk mono">${pickLabel(rd, slotOf(p))}</div><div class="bpn">${esc(nm(p))}</div><div class="bpm">${esc(pos(p))}${p.metadata?.team ? " · " + esc(p.metadata.team) : ""}</div><div class="bpo" style="color:${o ? color(o) : "var(--muted)"}">${esc(o ? teamName(o) : "")}</div>${ppg ? `<div class="bpp mono">${fmt(ppg)} ppg</div>` : ""}</div>`; }).join("")}`).join("")}
    </div></div>`;
    // steals & busts (rookie drafts only, using this season's points per game)
    let verdict = "";
    if (kind(sel) === "Rookie") {
      const scored = sel.picks.map(p => ({ p, ppg: M.cur.pAvg[p.player_id] || 0 }));
      const steal = scored.filter(x => x.p.round >= 2 && x.ppg > 0).sort((a, b) => b.ppg - a.ppg)[0];
      const bust = scored.filter(x => x.p.round === 1).sort((a, b) => a.ppg - b.ppg)[0];
      const best = [...scored].sort((a, b) => b.ppg - a.ppg)[0];
      const v = [];
      if (best && best.ppg > 0) v.push({ k: "Best of the class", h: nm(best.p), d: `${fmt(best.ppg)} ppg this season. Taken ${pickLabel(best.p.round, slotOf(best.p))} by ${teamName(who(best.p))}.` });
      if (steal) v.push({ k: "Steal of the draft", h: nm(steal.p), d: `Lasted until ${pickLabel(steal.p.round, slotOf(steal.p))} and is putting up ${fmt(steal.ppg)} ppg. ${teamName(who(steal.p))} is insufferable about it.` });
      if (bust && bust.ppg < (best?.ppg || 0) * 0.5) v.push({ k: "Bust watch", h: nm(bust.p), d: `A ${pickLabel(bust.p.round, slotOf(bust.p))} pick ${bust.ppg ? `averaging ${fmt(bust.ppg)} ppg` : "with zero fantasy points this season"}. ${teamName(who(bust.p))} is "trusting the process."` });
      if (v.length) verdict = `<div class="grid g3">${v.map(x => `<article class="story" style="--team:var(--accent)"><div class="eyebrow">${x.k}</div><h4>${esc(x.h)}</h4><p>${esc(x.d)}</p></article>`).join("")}</div>`;
    }
    out.push(section("past", "Draft Archive", "Every rookie draft since the move to Sleeper. The startup draft was held on Yahoo.", `<div class="jump">${tabs}</div>${verdict}${board}<p class="note">Points per game are from the current season, while the player was on a fantasy roster.</p>`));
  }

  out.push(returnsSection());
  const jumps = [["order", "Draft order"], ["race101", "1.01 race"], ["capital", "Pick holdings"], ["past", "Archive"], ["returns", "Draft returns"]]
    .filter(([id]) => out.some(h => h && h.includes(`id="sec-${id}"`))).map(([id, l]) => `<button class="btn" type="button" data-jump="sec-${id}">${l}</button>`).join("");
  return `<div class="section-h"><div><div class="eyebrow">${draftYear} rookie draft · ${plural(rounds, "round")}</div><h2>The Draft Room</h2></div><div class="jump">${jumps}</div></div>
    <div class="stack" style="gap:36px">${out.filter(Boolean).join("")}</div>`;
}
const range1 = n => range(1, n);

/* ---------------- landing gate ---------------- */
const TAGLINES = [
  "Trash talk is mandatory. Setting your lineup is, technically, optional.",
  "Where rebuilds go to become five-year plans.",
  "Home of questionable trades and unquestionable grudges.",
  "Abandon hope, all ye who started a kicker in the flex.",
  "Est. by friends. Maintained by spite."
];
const WRONG = [
  "Nope. That's the password for the toilet bowl.",
  "Wrong. Did you try your Sleeper username backwards?",
  "Denied. The commissioner has been notified (not really).",
  "Incorrect. This is why you didn't make the playoffs."
];
async function sha256(t) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function isUnlocked() {
  if (!CONFIG.PASSWORD_SHA256) return true;
  let v = null;
  try { v = localStorage.getItem("gate") || sessionStorage.getItem("gate"); } catch {}
  return v === CONFIG.PASSWORD_SHA256;
}
function showGate(leagueName) {
  return new Promise(resolve => {
    document.body.classList.add("locked");
    let n = 0;
    $("#app").innerHTML = `<div class="gate"><div class="gate-card">
      <div class="stripes" aria-hidden="true"></div>
      <div class="eyebrow">Members only · Dynasty league</div>
      <h1 id="gate-name">${esc(leagueName || "Dynasty Gameday Desk")}</h1>
      <p class="tag">${esc(pick(TAGLINES, new Date().toDateString()))}</p>
      <form id="gate-form" autocomplete="on">
        <label class="eyebrow" for="gate-pw" style="flex-basis:100%">League password</label>
        <input id="gate-pw" type="password" autocomplete="current-password" required>
        <button class="go" type="submit">Enter</button>
        <label class="remember" for="gate-remember" style="flex-basis:100%"><input id="gate-remember" type="checkbox" checked> Remember me on this device</label>
      </form>
      <p class="msg" id="gate-msg" role="alert"></p>
      <div class="fine">No password? Ask the commissioner. Begging is permitted.</div>
    </div></div>`;
    $("#gate-pw").focus();
    $("#gate-form").addEventListener("submit", async e => {
      e.preventDefault();
      const card = $(".gate-card"), msg = $("#gate-msg");
      let h = "";
      try { h = await sha256($("#gate-pw").value.trim()); } catch { msg.textContent = "This browser can't check the password here. Open the site over https."; return; }
      if (h !== CONFIG.PASSWORD_SHA256) {
        msg.textContent = WRONG[n++ % WRONG.length];
        card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
        $("#gate-pw").select();
        return;
      }
      try { ($("#gate-remember").checked ? localStorage : sessionStorage).setItem("gate", h); } catch {}
      document.body.classList.remove("locked");
      resolve();
    });
  });
}
function lockAgain() { try { localStorage.removeItem("gate"); sessionStorage.removeItem("gate"); } catch {} location.reload(); }

async function refreshGameday(fresh) {
  const s = M.cur;
  STATE.gd = await gamedayModel(s, STATE.week, { fresh });
  const curGd = STATE.week === s.currentWeek ? STATE.gd : STATE.curGd;
  if (STATE.week === s.currentWeek) STATE.curGd = STATE.gd;
  STATE.odds = s.lastDone !== 99 && s.lastDone + 1 < s.pws ? playoffOdds(s, curGd) : null;
  STATE.draftProj = null;

function inGameWindow() {
  const ny = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
  const d = ny.getDay(), h = ny.getHours();
  return (d === 0 && h >= 9) || (d === 1 && (h >= 19 || h < 1)) || (d === 4 && h >= 19) || (d === 5 && h < 1) || (d === 6 && h >= 12) || (d === 2 && h < 1);
}
function schedulePoll() {

  if (STATE.week !== s.currentWeek) return;

  STATE.timer = setTimeout(async () => {

}

async function boot() {
  const id = currentLeagueId();
  $("#lock").hidden = !CONFIG.PASSWORD_SHA256;
  if (!id) return showSetup();

  if (lg.avatar) { const im = $("#lg-av"); im.src = `https://sleepercdn.com/avatars/thumbs/${lg.avatar}`; im.hidden = false; }
  const lastWeekWithGames = Math.max(1, ...Object.entries(s.raw.weeks).filter(([, e]) => (e || []).some(x => x.matchup_id != null)).map(([w]) => +w));
  STATE.week = s.currentWeek ? Math.min(s.currentWeek, lastWeekWithGames) : Math.max(1, ...Object.entries(s.raw.weeks).filter(([, e]) => (e || []).some(x => ptsOf(x) > 0)).map(([w]) => +w));
  if (s.currentWeek) s.currentWeek = STATE.week;
  progress("Running the numbers…");
  await refreshGameday(false);
  route();
  // secondary sources in the background
  loadValues(s).then(v => { STATE.values = v; if (["dynasty", "franchises"].includes(STATE.view)) render(); else renderFooter(); });
  window.scrollTo(0, 0);
}

function route() {
  const v = location.hash.slice(1);
  const tm = v.match(/^team-(\d+)$/), mm = v.match(/^match-(\d+)-(\d+)$/);
  const prev = STATE.view + STATE.team + "/" + STATE.match;
  STATE.team = tm ? +tm[1] : null;
  STATE.match = mm ? +mm[2] : null;
  if (mm && M && +mm[1] !== STATE.week) { STATE.week = +mm[1]; refreshGameday(false).then(() => { if (STATE.match != null) render(); }); }
  STATE.view = tm ? "franchises" : mm ? "gameday" : ["gameday", "stories", "outlook", "history", "dynasty", "franchises", "draft"].includes(v) ? v : "gameday";
  if (M) { render(); if (prev !== STATE.view + STATE.team + "/" + STATE.match) window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", route);
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) location.hash = t.dataset.v; });
$("#app").addEventListener("click", async e => {
  const wk = e.target.closest("[data-week]");
  if (wk) { STATE.week = +wk.dataset.week; await refreshGameday(false); render(); return; }
  const dr = e.target.closest("[data-draft]");
  if (dr) { STATE.pastDraft = dr.dataset.draft; render(); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); return; }
  const so = e.target.closest("[data-sort]");
  if (so) { const k = so.dataset.sort; STATE.sort = { k, d: STATE.sort.k === k ? -STATE.sort.d : -1 }; render(); }
});
$("#app").addEventListener("change", e => { if (e.target.id === "team-pick" && e.target.value) location.hash = "team-" + e.target.value; });
$("#refresh").addEventListener("click", async () => {
  if (!M) return boot();
  const b = $("#refresh"); b.disabled = true; b.textContent = "Refreshing…";
  try { await refreshGameday(true); render(); } catch (e) { console.warn(e); } finally { b.disabled = false; b.textContent = "Refresh"; }
});
$("#lock").addEventListener("click", lockAgain);
$("#change-league").addEventListener("click", () => { clearTimeout(STATE.timer); M = null; showSetup(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && M) schedulePoll(); });
boot();
</script>
</body>
