    ${range(1, n).map(rk => `<text x="${L - 10}" y="${Y(rk) + 4}" text-anchor="end">${rk}</text><line x1="${L}" x2="${W - R}" y1="${Y(rk)}" y2="${Y(rk)}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join("")}
    ${ss.map((s, i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${s.year}</text>`).join("")}
    ${lines}</svg></div></section>`;
}

function h2hMatrix() {
  const oids = Object.values(M.owners).filter(o => o.active).map(o => o.id);
  if (oids.length < 2) return "";
  const cells = (x, y) => {
    if (x === y) return `<td style="background:var(--surface-2)"></td>`;
    const m = M.h2h[x]?.[y]; if (!m) return `<td class="muted">–</td>`;
    const p = (m.w + m.t / 2) / Math.max(1, m.w + m.l + m.t);
    const c = p > 0.5 ? "var(--win)" : p < 0.5 ? "var(--loss)" : "var(--muted)";
    return `<td style="background:color-mix(in srgb, ${c} ${Math.round(Math.abs(p - 0.5) * 120)}%, transparent)" title="${esc(teamName(x))} vs ${esc(teamName(y))}: ${m.w}-${m.l}${m.t ? "-" + m.t : ""}, avg ${fmt(m.pf / m.games.length)}-${fmt(m.pa / m.games.length)}">${m.w}-${m.l}${m.t ? "-" + m.t : ""}</td>`;
  };
  const short = oid => esc((teamName(oid) || "").slice(0, 10));
  return `<section><h3>Head-to-Head</h3><div class="tbl-wrap"><table class="h2h"><thead><tr><th class="rowh">Row vs. column</th>${oids.map(o => `<th title="${esc(teamName(o))}"><span class="chip" style="background:${color(o)}"></span>${short(o)}</th>`).join("")}</tr></thead>
    <tbody>${oids.map(x => `<tr><th class="rowh" style="text-align:left"><span class="chip" style="background:${color(x)}"></span>${esc(teamName(x))}</th>${oids.map(y => cells(x, y)).join("")}</tr>`).join("")}</tbody></table></div><p class="note">Regular season plus winners-bracket playoff games, current managers only.</p></section>`;
}

function recordBook() {
  const flat = M.allGames.flatMap(g => [{ g, me: g.a, op: g.b }, { g, me: g.b, op: g.a }]);
  if (!flat.length) return "";
  const by = (f, cmp) => flat.filter(f || (() => true)).reduce((a, b) => (a == null || cmp(b, a)) ? b : a, null);
  const when = x => `${esc(teamName(x.me.oid))} vs ${esc(teamName(x.op.oid))} · ${x.g.year} Wk ${x.g.week}${x.g.post ? " (playoffs)" : ""}`;
  const items = [
    ["Highest score", by(null, (a, b) => a.me.pts > b.me.pts), x => fmt(x.me.pts)],
    ["Lowest score", by(x => x.me.pts > 0, (a, b) => a.me.pts < b.me.pts), x => fmt(x.me.pts)],
    ["Biggest blowout", by(null, (a, b) => a.me.pts - a.op.pts > b.me.pts - b.op.pts), x => "+" + fmt(x.me.pts - x.op.pts)],
    ["Closest finish", by(x => x.me.pts > x.op.pts, (a, b) => a.me.pts - a.op.pts < b.me.pts - b.op.pts), x => "+" + fmt(x.me.pts - x.op.pts, 2)],
    ["Most points in a loss", by(x => x.me.pts < x.op.pts, (a, b) => a.me.pts > b.me.pts), x => fmt(x.me.pts)],
    ["Fewest points in a win", by(x => x.me.pts > x.op.pts, (a, b) => a.me.pts < b.me.pts), x => fmt(x.me.pts)]
  ].filter(i => i[1]);
  const seasonsPF = M.seasons.flatMap(s => s.standings.filter(r => r.results.length >= 3).map(r => ({ s, r, ppg: r.pf / r.results.length })));
  const bestSzn = seasonsPF.sort((a, b) => b.ppg - a.ppg)[0];
  const streak = Object.values(M.allTime).sort((a, b) => b.best - a.best)[0];
  return `<section><h3>Record Book</h3><div class="records">
    ${items.map(([lbl, x, v]) => `<div class="rec"><div class="eyebrow">${lbl}</div><div class="v mono">${v(x)}</div><div class="d">${when(x)}</div></div>`).join("")}
    ${bestSzn ? `<div class="rec"><div class="eyebrow">Best scoring season</div><div class="v mono">${fmt(bestSzn.ppg)} ppg</div><div class="d">${esc(teamName(bestSzn.r.oid))} · ${bestSzn.s.year} (${recStr(bestSzn.r)})</div></div>` : ""}
    ${streak?.best ? `<div class="rec"><div class="eyebrow">Longest win streak</div><div class="v mono">${streak.best}</div><div class="d">${esc(teamName(streak.oid))}</div></div>` : ""}
  </div></section>`;
}

function viewDynasty() {
  const s = M.cur, vals = STATE.values;
  const { seasons: nextSeasons, rounds: rookieRounds, owned } = picksLedger(s);
  const rosterRows = s.raw.rosters.map(r => {
    const oid = s.ownerOf[r.roster_id];
    const ps = (r.players || []).map(pid => ({ pid, ...(M.players[pid] || { n: pname(pid), pos: ppos(pid), age: null }), v: vals?.[pid] || 0 }));
    const skill = ps.filter(p => ["QB", "RB", "WR", "TE"].includes(p.pos));
    const ages = skill.map(p => p.age).filter(Boolean);
    const byPos = {}; for (const p of skill) byPos[p.pos] = (byPos[p.pos] || 0) + p.v;
    const total = sum(ps.map(p => p.v));
    const wAge = total ? sum(skill.filter(p => p.age).map(p => p.age * p.v)) / Math.max(1, sum(skill.filter(p => p.age).map(p => p.v))) : median(ages);
    const young = skill.filter(p => p.age && p.age <= 24);
    const oldRB = skill.filter(p => p.pos === "RB" && p.age >= 27);
    const top = [...ps].sort((a, b) => b.v - a.v || (a.age || 99) - (b.age || 99)).slice(0, 3);
    const pk = (owned[r.roster_id] || []);
    const firsts = pk.filter(p => p.round === 1).length, seconds = pk.filter(p => p.round === 2).length;
    return { oid, rid: r.roster_id, total, byPos, wAge, young, oldRB, top, pk, firsts, seconds, n: skill.length };
  });
  rosterRows.sort((a, b) => vals ? b.total - a.total : (a.wAge || 99) - (b.wAge || 99));
  const maxV = Math.max(...rosterRows.map(r => r.total), 1);
  const posCol = { QB: "hsl(352 60% 55%)", RB: "hsl(160 50% 42%)", WR: "hsl(212 65% 55%)", TE: "hsl(36 85% 52%)" };
  const window_ = r => {
    if (!vals) return r.wAge && r.wAge <= 25.5 ? "Rising" : r.wAge >= 27 ? "Win-now" : "Balanced";
    const rank = rosterRows.indexOf(r) + 1, n = rosterRows.length;
    if (rank <= n / 3 && r.wAge >= 26.5) return "Win-now";
    if (rank <= n / 3) return "Juggernaut";
    if (r.wAge <= 25 || r.firsts >= 4) return "Rising";
    if (rank > 2 * n / 3) return "Rebuild";
    return "Contender";
  };
  const table = `<div class="tbl-wrap"><table><thead><tr><th>Team</th>${vals ? "<th>Roster value by position</th>" : ""}<th class="n">Age${vals ? " (value-wtd)" : ""}</th><th class="n">≤24 yo</th><th>Top assets</th><th class="n">${nextSeasons[0]}–${nextSeasons[2].slice(2)} 1sts</th><th class="n">2nds</th><th>Window</th></tr></thead><tbody>
    ${rosterRows.map(r => `<tr><td>${teamCell(r.oid)}</td>${vals ? `<td><div style="display:flex;height:14px;width:${Math.max(4, r.total / maxV * 220)}px;border-radius:3px;overflow:hidden" title="${Math.round(r.total).toLocaleString()} total value">${["QB", "RB", "WR", "TE"].map(p => `<span style="width:${(r.byPos[p] || 0) / (r.total || 1) * 100}%;background:${posCol[p]}"></span>`).join("")}</div><div class="mono muted" style="font-size:11px">${Math.round(r.total).toLocaleString()}</div></td>` : ""}
      <td class="n">${fmt(r.wAge, 1)}</td><td class="n">${r.young.length}</td><td style="white-space:normal;min-width:200px;font-size:13px">${r.top.map(p => esc(p.n)).join(", ")}${r.oldRB.length ? `<div class="muted" style="font-size:11px">Aging RBs: ${r.oldRB.map(p => esc(p.n)).join(", ")}</div>` : ""}</td>
      <td class="n">${r.firsts}</td><td class="n">${r.seconds}</td><td><span class="pill">${window_(r)}</span></td></tr>`).join("")}
  </tbody></table></div>`;
  const legend = vals ? `<p class="note">${Object.entries(posCol).map(([p, c]) => `<span class="chip" style="background:${c}"></span>${p}`).join(" &nbsp; ")} · Values from FantasyCalc's dynasty trade market, matched to your league's QB format and scoring. Picks counted from Sleeper's traded-pick ledger for the next three rookie drafts (${rookieRounds} rounds).</p>`
    : `<p class="note">Dynasty trade values couldn't be loaded, so teams are sorted by age. Picks counted from Sleeper's traded-pick ledger.</p>`;
  return `<div class="section-h"><div><div class="eyebrow">Built for the long game</div><h2>Dynasty Outlook</h2></div><div class="jump"><button class="btn" type="button" data-jump="sec-trades">Trade review</button><button class="btn" type="button" data-jump="sec-journeymen">Journeymen</button></div></div>
    <div class="stack" style="gap:36px"><div class="stack">${table}${legend}</div>${tradeSection()}${journeySection()}</div>`;
}


/* ---------------- head-to-head matchup view ---------------- */
const headshot = pid => {
  if (!pid || pid === "0") return `<span class="hs blank"></span>`;
  const src = `https://sleepercdn.com/content/nfl/players/thumb/${pid}.jpg`;
  return `<span class="hs"><img src="${src}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"></span>`;
};
function kickoffText(g) {
  if (!g?.t) return "";
  const o = { timeZone: "America/New_York", weekday: "short" };
  return g.dateOnly ? g.t.toLocaleDateString("en-US", o) : g.t.toLocaleString("en-US", { ...o, hour: "numeric", minute: "2-digit" }) + " ET";
}
function oppLine(p, isPast) {
  const g = p.game;
  if (g === "bye") return `<span class="bye">BYE WEEK</span>`;
  if (!g) return isPast ? "" : `<span class="muted">${statusWord(p.status)}</span>`;
  const opp = `<b>${g.home ? "vs" : "@"} ${esc(g.opp)}</b>`;
  const score = g.my != null && g.their != null && g.my !== "" ? ` · ${esc(g.my)}-${esc(g.their)}` : "";
  const when = isPast || p.status === "done" ? `Final${score}`
    : p.status === "live" ? `<span class="livetxt">${esc(g.clock || "Live")}</span>${score}`
    : (kickoffText(g) || "Upcoming");
  return `${opp} · ${when}`;
}
function playerForm(pid) {
  const s = M.cur, avg = s.pAvg[pid], log = (s.pLog[pid] || []).filter(x => x.week < (STATE.gd?.week || 99));
  if (!avg && !log.length) return "";
  const l3 = log.slice(-3).map(x => x.pts);
  const trend = l3.length === 3 && avg ? (mean(l3) > avg * 1.2 ? " ▲" : mean(l3) < avg * 0.8 ? " ▼" : "") : "";
  return `Avg ${fmt(avg)}${l3.length ? ` · L3 ${fmt(mean(l3))}${trend}` : ""}`;
}
const statusWord = st => st === "pre" ? "Yet to play" : st === "live" ? "Playing" : "Final";

function h2hCell(p, side, isPast, win) {
  if (!p) return `<div class="hc h${side}"></div>`;
  if (!p.pid || p.pid === "0") return `<div class="hc h${side} emptyslot"><span class="hs blank"></span><div class="hn"><div class="hpn">Empty slot</div><div class="hpm">Free points, left on the table</div></div><div class="hpts mono">0.00</div></div>`;
  const pl = M.players[p.pid] || {};
  return `<div class="hc h${side} ${win ? "won" : ""}" style="--pos:${posColor(p.pid)}">${headshot(p.pid)}
    <div class="hn"><div class="hpn">${esc(pname(p.pid))}${pl.inj ? ` <span class="inj">${esc(pl.inj)}</span>` : ""}</div>
    <div class="hpm"><span class="st ${p.status}"></span>${esc(ppos(p.pid))}${pteam(p.pid) ? " · " + esc(pteam(p.pid)) : ""}</div>
    <div class="hopp">${oppLine(p, isPast)}</div>
    <div class="hstat mono">${playerForm(p.pid)}</div></div>
    <div class="hpts"><div class="mono">${fmt(p.actual, 2)}</div>${!isPast && p.status !== "done" ? `<div class="hproj mono">proj ${fmt(p.proj, 1)}</div>` : ""}</div></div>`;
}

function benchQuip(side) {
  const done = side.bench.filter(b => b.actual > 0).sort((a, b) => b.actual - a.actual);
  for (const b of done) {
    const pos = ppos(b.pid);
    const worse = side.players.filter(p => p.pid && p.pid !== "0" && ppos(p.pid) === pos && p.status === "done" && p.actual < b.actual).sort((a, b) => a.actual - b.actual)[0];
    if (worse) return `Coach's decision: ${pname(b.pid)} put up ${fmt(b.actual)} on the bench while ${pname(worse.pid)} started and scored ${fmt(worse.actual)}.`;
  }
  return "";
}

// What a win this week does to playoff odds (top 9 in the standings only)
const STAKES = [
  (T, w, now) => `A win would push ${T}'s playoff odds to ${w}, up from ${now}.`,
  (T, w, now) => `${T} sits at ${now} to make the playoffs; a W bumps that to ${w}.`,
  (T, w, now) => `Win this and ${T} is at ${w} to make the playoffs. Right now: ${now}.`,
  (T, w, now) => `Stakes for ${T}: ${now} playoff odds today, ${w} with a win.`,
  (T, w, now) => `For ${T}, this one is worth a jump from ${now} to ${w} in playoff odds.`,
  (T, w, now) => `${T}'s playoff odds: ${now} now, ${w} if they handle business.`,
  (T, w, now) => `A W moves ${T} from ${now} to ${w} to make the playoffs. No pressure.`,
  (T, w, now) => `Big swing for ${T}: ${w} playoff odds with a win, ${now} as it stands.`,
  (T, w, now) => `${T} goes from ${now} to ${w} playoff odds with a win. Set the lineup accordingly.`
];
const STAKES_LOCK = [
  (T, w, now) => `${T} is already at ${now} to make the playoffs. A win just makes it official-ish (${w}).`,
  (T, w, now) => `A win takes ${T} to ${w} playoff odds. Start ordering the hats.`,
  (T, w, now) => `With a W, ${T} goes to ${w} playoff odds. Pretty much printing tickets.`,
  (T, w, now) => `${T} is ${now} to make the playoffs, ${w} with a win. Basically a formality.`,
  (T, w, now) => `A win puts ${T} at ${w} to make the playoffs. The bracket is already penciled in.`,
  (T, w, now) => `${T}: ${now} now, ${w} with a win. Somebody tell them the playoffs start in week 15.`,
  (T, w, now) => `Win and ${T} is at ${w} playoff odds. Lose and they're still probably fine. Probably.`,
  (T, w, now) => `${T} gets to ${w} with a win. The playoff invite is in the mail.`
];
const STAKES_LONG = [
  (T, w, now) => `Even with a win, ${T} only gets to ${w} playoff odds. Miracles accepted.`,
  (T, w, now) => `A win nudges ${T} to ${w} playoff odds. Long shot, but the dream lives.`,
  (T, w, now) => `${T} at ${now}; a win gets them to ${w}. Please clap.`,
  (T, w, now) => `A W lifts ${T} to ${w} playoff odds. Lottery tickets have better numbers.`,
  (T, w, now) => `${T} would reach ${w} with a win. The 1.01 is looking more realistic.`
];
function stakesTeams(mu, s, gd) {
  const o = STATE.odds;
  if (!o || gd.isPast || gd.week !== o.week) return new Set();
  return new Set([mu.a, mu.b].filter(x => (s.rec[x.rid]?.rank ?? 99) <= 9 && o.res[x.rid]?.ifWin != null).map(x => x.rid));
}
function stakesLine(mu, s, gd) {
  const o = STATE.odds, cov = stakesTeams(mu, s, gd);
  if (!cov.size) return "";
  return [mu.a, mu.b].filter(x => cov.has(x.rid)).map(x => {
    const r = o.res[x.rid]; if (r?.ifWin == null) return "";
    const pool = r.ifWin >= 0.97 ? STAKES_LOCK : r.ifWin < 0.05 ? STAKES_LONG : STAKES;
    return " " + fresh(pool, x.oid + gd.week + "stakes", teamName(x.oid), pct(r.ifWin), pct(r.playoff));
  }).join("");
}
function viewMatch(s, gd, mid) {
  const mu = gd.matchups.find(m => m.a.mid === mid);
  if (!mu) return `<a class="back" href="#gameday">← Back to week ${gd.week}</a><div class="panel" style="margin-top:16px"><h3>Matchup not found</h3><p class="muted">It may not exist for week ${gd.week}.</p></div>`;
  const { a, b } = mu, isPast = gd.isPast;
  const label = isPast ? "Final" : gd.anyLive ? "Live" : "Upcoming";
  const team = (x, y, side) => `<div class="sb-team sb${side} ${x.pts > y.pts ? "ahead" : ""}" style="--team:${color(x.oid)}">
      <a class="sb-id" href="#team-${x.rid}">${avatarHTML(x.oid, "av sb-av")}<div style="min-width:0"><div class="sb-name">${esc(teamName(x.oid))}</div><div class="mgr">${recStr(s.rec[x.rid] || { w: 0, l: 0 })}</div></div></a>
      <div class="sb-score mono">${fmt(x.pts, 2)}</div>${isPast ? "" : `<div class="sb-proj mono">proj ${fmt(x.final)}</div>`}</div>`;
  const n = Math.max(a.players.length, b.players.length);
  const rows = range(0, n - 1).map(i => {
    const pa = a.players[i], pb = b.players[i];
    const fin = pa && pb && (isPast || (pa.status === "done" && pb.status === "done"));
    const aw = fin && pa.actual > pb.actual, bw = fin && pb.actual > pa.actual;
    return `<div class="hrow">${h2hCell(pa, "l", isPast, aw)}<div class="hslot">${esc(slotLabel(pa?.slot || pb?.slot || ""))}</div>${h2hCell(pb, "r", isPast, bw)}</div>`;
  }).join("");
  const real = p => p && p.pid && p.pid !== "0";
  const decided = range(0, n - 1).filter(i => (isPast || (a.players[i]?.status === "done" || !real(a.players[i])) && (b.players[i]?.status === "done" || !real(b.players[i]))) && (real(a.players[i]) || real(b.players[i])));
  const slotsWon = x => { const o = x === a ? b : a; return decided.filter(i => (x.players[i]?.actual || 0) > (o.players[i]?.actual || 0)).length; };
  const left = x => x.players.filter(p => p.status === "pre" && real(p)).length, playing = x => x.players.filter(p => p.status === "live" && real(p)).length;
  const benchCol = x => {
    const list = [...x.bench].sort((p, q) => q.actual - p.actual || (POS_ORDER[ppos(p.pid)] || 9) - (POS_ORDER[ppos(q.pid)] || 9));
    const tot = sum(list.map(p => p.actual));
    return `<div class="hbench"><div class="bh" style="--pos:${color(x.oid)}"><span>${esc(teamName(x.oid))} bench</span><span class="mono muted">${fmt(tot)} pts</span></div><ul>${list.map(p => `<li><div style="min-width:0"><div class="bn">${esc(pname(p.pid))}</div><div class="bm"><span class="st ${p.status}"></span>${esc(ppos(p.pid))}${pteam(p.pid) ? " · " + esc(pteam(p.pid)) : ""}</div><div class="hopp">${oppLine(p, isPast)}</div></div><div class="bp mono">${fmt(p.actual, 2)}</div></li>`).join("") || `<li class="muted">Nobody on the bench.</li>`}</ul></div>`;
  };
  const quips = [benchQuip(a), benchQuip(b)].filter(Boolean);
  const blurb = (isPast ? recapBlurb(mu, s.year, gd.week) : previewBlurb(mu, STATE.odds, s.year, gd.week, stakesTeams(mu, s, gd))) + stakesLine(mu, s, gd);
  return `<div class="team-top"><a class="back" href="#gameday">← All week ${gd.week} matchups</a><div class="eyebrow">${s.year} · Week ${gd.week} · ${label}${gd.anyLive ? ` · updates every ${CONFIG.POLL_SECONDS}s` : ""}</div></div>
    <section class="scoreboard">
      <div class="sb-row">${team(a, b, "l")}<div class="sb-mid"><div class="vs">VS</div></div>${team(b, a, "r")}</div>
      <div class="wp" style="margin:14px 0 0"><span style="width:${mu.pA * 100}%;background:${color(a.oid)}"></span><span style="width:${(1 - mu.pA) * 100}%;background:${color(b.oid)}"></span></div>
      <div class="wp-l" style="margin:6px 0 0"><span>${isPast ? (a.pts > b.pts ? "WIN" : a.pts < b.pts ? "LOSS" : "TIE") : pct(mu.pA)}</span><span>${isPast ? "" : "win odds"}</span><span>${isPast ? (b.pts > a.pts ? "WIN" : b.pts < a.pts ? "LOSS" : "TIE") : pct(1 - mu.pA)}</span></div>
      <div class="sb-facts">
        ${decided.length ? `<div><span class="mono">${slotsWon(a)}–${slotsWon(b)}</span> slots won <span class="muted">(of ${decided.length} finished)</span></div>` : ""}
        ${isPast ? "" : `<div><span class="mono">${playing(a)}–${playing(b)}</span> playing now</div><div><span class="mono">${left(a)}–${left(b)}</span> yet to play</div>`}
      </div>
      <p class="blurb" style="border:0;padding:12px 0 0;margin:0">${esc(blurb)}</p>
    </section>
    <section style="margin-top:24px"><div class="sect-h"><h3>Head to Head</h3><p>Starters, slot by slot</p></div>
      <div class="h2h-grid">${rows}<div class="hrow total"><div class="hc hl"><div class="hn"><div class="hpn">Total</div></div><div class="hpts"><div class="mono">${fmt(a.pts, 2)}</div></div></div><div class="hslot"></div><div class="hc hr"><div class="hn"><div class="hpn">Total</div></div><div class="hpts"><div class="mono">${fmt(b.pts, 2)}</div></div></div></div></div>
    </section>
    <section style="margin-top:24px"><div class="sect-h"><h3>The Benches</h3><p>Points that didn't count</p></div>
      ${quips.length ? `<p class="tquip" style="margin:0 0 12px">${quips.map(esc).join(" ")}</p>` : ""}
      <div class="grid g2">${benchCol(a)}${benchCol(b)}</div></section>`;
}

/* ---------------- gameday ticker ----------------
   Each refresh is compared with the last one this browser saw for the week, so swings, lead changes,
   big plays and finals become headlines. Events are kept per week in this browser only. */
const TICK = { key: null, snap: null, events: [], base: {} };
function tickLoad(key) {
  if (TICK.key === key) return;
  TICK.key = key; TICK.snap = null; TICK.events = []; TICK.base = {};
  try { const v = JSON.parse(localStorage.getItem(key) || "null"); if (v) Object.assign(TICK, { snap: v.snap, events: v.events || [], base: v.base || {} }); } catch {}
}
function tickSave() { try { localStorage.setItem(TICK.key, JSON.stringify({ snap: TICK.snap, events: TICK.events.slice(0, 30), base: TICK.base })); } catch {} }
const tPick = (arr, seed) => arr[hash(seed) % arr.length];

function updateTicker(gd) {
  const s = M.cur;
  if (!gd || gd.isPast || gd.week !== s.currentWeek) return;
  tickLoad(`ticker-${s.league.league_id}-${s.year}-${gd.week}`);
  const now = Date.now(), snap = { t: now, m: {} };
  for (const mu of gd.matchups) {
    const all = [...mu.a.players, ...mu.b.players];
    snap.m[mu.a.mid] = { a: mu.a.rid, b: mu.b.rid, pA: mu.pA, ap: mu.a.pts, bp: mu.b.pts, done: all.every(p => p.status === "done"), pl: Object.fromEntries(all.filter(p => p.pid && p.pid !== "0").map(p => [p.pid, p.actual])) };
    if (!(mu.a.mid in TICK.base) && !all.some(p => p.actual)) TICK.base[mu.a.mid] = mu.pA;   // pre-kickoff odds, for upset alerts
  }
  const prev = TICK.snap, add = (kind, text, mid) => TICK.events.unshift({ t: now, kind, text, mid });
  if (prev) for (const [mid, cur] of Object.entries(snap.m)) {
    const old = prev.m[mid]; if (!old || old.a !== cur.a) continue;
    const A = teamName(s.ownerOf[cur.a]), B = teamName(s.ownerOf[cur.b]);
    const ridOf = pid => (gd.sides[cur.a].players.some(p => p.pid === pid) ? cur.a : cur.b);
    const gains = Object.entries(cur.pl).map(([pid, v]) => ({ pid, d: v - (old.pl[pid] ?? 0) })).filter(x => x.d > 0.05).sort((x, y) => y.d - x.d);
    const hero = gains[0];
    const heroTxt = hero ? ` behind ${pname(hero.pid)} (+${fmt(hero.d)})` : "";
    const seed = mid + now;
    if (cur.done && !old.done) {
      const [w, l, wp, lp] = cur.ap >= cur.bp ? [A, B, cur.ap, cur.bp] : [B, A, cur.bp, cur.ap];
      add("Final", tPick([`${w} beats ${l}, ${fmt(wp)}-${fmt(lp)}.`, `It's over: ${w} ${fmt(wp)}, ${l} ${fmt(lp)}.`, `${w} closes it out against ${l}, ${fmt(wp)}-${fmt(lp)}.`], seed), +mid);
      continue;
    }
    const lead = x => x.ap > x.bp ? "a" : x.bp > x.ap ? "b" : null;
    if (lead(old) && lead(cur) && lead(old) !== lead(cur)) {
      const [L, T, lp, tp] = lead(cur) === "a" ? [A, B, cur.ap, cur.bp] : [B, A, cur.bp, cur.ap];
      add("Lead change", tPick([`${L} jumps ahead of ${T}, ${fmt(lp)}-${fmt(tp)}${heroTxt}.`, `${L} takes the lead over ${T}${heroTxt}.`, `New leader: ${L} over ${T}, ${fmt(lp)}-${fmt(tp)}.`], seed), +mid);
    }
    const dA = cur.pA - old.pA;
    if (Math.abs(dA) >= 0.15) {
      const [W, pOld, pNew] = dA > 0 ? [A, old.pA, cur.pA] : [B, 1 - old.pA, 1 - cur.pA];
      add("Swing", tPick([`${W}'s win odds go from ${pct(pOld)} to ${pct(pNew)}${heroTxt}.`, `Momentum shift: ${W} now ${pct(pNew)} to win, up from ${pct(pOld)}${heroTxt}.`, `${W} surges to ${pct(pNew)}${heroTxt}.`], seed), +mid);
    }
    const base = TICK.base[mid];
    if (base != null) for (const [side, T, O] of [["a", A, B], ["b", B, A]]) {
      const b0 = side === "a" ? base : 1 - base, c0 = side === "a" ? cur.pA : 1 - cur.pA, o0 = side === "a" ? old.pA : 1 - old.pA;
      if (b0 < 0.3 && c0 >= 0.6 && o0 < 0.6) add("Upset alert", tPick([`${T} started at ${pct(b0)} and now leads ${O}. Somebody check on ${O}.`, `${T} was a ${pct(b0)} underdog. Now ${pct(c0)} to beat ${O}.`], seed + side), +mid);
    }
    for (const g of gains.filter(x => x.d >= 8).slice(0, 2)) {
      const team = teamName(s.ownerOf[ridOf(g.pid)]);
      add("Boom", tPick([`${pname(g.pid)} just put up ${fmt(g.d)} for ${team}.`, `${pname(g.pid)} +${fmt(g.d)} for ${team}. That's a whole fantasy week in one drive.`, `${pname(g.pid)} goes off: +${fmt(g.d)} for ${team}.`], seed + g.pid), +mid);
    }
  }
  TICK.snap = snap; tickSave();
}

function tickerItems() {
  const s = M.cur, gd = STATE.curGd;
  if (!gd || gd.isPast || gd.week !== s.currentWeek) return [];
  tickLoad(`ticker-${s.league.league_id}-${s.year}-${gd.week}`);
  const started = gd.matchups.some(mu => [...mu.a.players, ...mu.b.players].some(p => p.actual));
  const items = TICK.events.slice(0, 12).map(e => ({ kind: e.kind, text: e.text, mid: e.mid, when: new Date(e.t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) }));
  if (started) {
    const all = gd.matchups.flatMap(mu => [mu.a, mu.b]);
    const hi = all.reduce((x, y) => y.pts > x.pts ? y : x);
    items.push({ kind: "High score", text: `${teamName(hi.oid)} leads the week with ${fmt(hi.pts)}.`, mid: hi.mid });
    const star = gd.matchups.flatMap(mu => [...mu.a.players.map(p => ({ p, side: mu.a })), ...mu.b.players.map(p => ({ p, side: mu.b }))]).sort((x, y) => y.p.actual - x.p.actual)[0];
    if (star && star.p.actual > 0) items.push({ kind: "Top player", text: `${pname(star.p.pid)} has ${fmt(star.p.actual)} for ${teamName(star.side.oid)}.`, mid: star.side.mid });
    const close = [...gd.matchups].sort((x, y) => Math.abs(0.5 - x.pA) - Math.abs(0.5 - y.pA))[0];
    if (close && Math.max(close.pA, 1 - close.pA) <= 0.7) items.push({ kind: "Nail-biter", text: `${teamName(close.a.oid)} ${fmt(close.a.pts)}, ${teamName(close.b.oid)} ${fmt(close.b.pts)}. Win odds ${pct(Math.max(close.pA, 1 - close.pA))} for ${teamName((close.pA >= 0.5 ? close.a : close.b).oid)}.`, mid: close.a.mid });
    for (const mu of [...gd.matchups].sort((x, y) => Math.abs(0.5 - y.pA) - Math.abs(0.5 - x.pA)).slice(0, 2)) {
      const fav = mu.pA >= 0.5 ? mu.a : mu.b, dog = fav === mu.a ? mu.b : mu.a;
      if (Math.max(mu.pA, 1 - mu.pA) >= 0.9 && fav.pts - dog.pts >= 10) items.push({ kind: "Cruising", text: `${teamName(fav.oid)} up ${fmt(fav.pts - dog.pts)} on ${teamName(dog.oid)}.`, mid: mu.a.mid });
    }
  }
  return items;
}

function renderTicker() {
  const el = $("#ticker"); if (!el || !M) return;
  const items = tickerItems();
  if (!items.length) { el.hidden = true; el.innerHTML = ""; return; }
  const html = items.map(i => `<a class="tk-item" href="#match-${STATE.curGd.week}-${i.mid}"><b class="tk-kind k-${i.kind.toLowerCase().replace(/[^a-z]+/g, "-")}">${esc(i.kind)}</b>${i.when ? `<span class="tk-when">${esc(i.when)}</span>` : ""}${esc(i.text)}</a>`).join('<span class="tk-sep" aria-hidden="true">•</span>');
  if (el.dataset.sig === html) return;   // unchanged: don't restart the scroll
  el.dataset.sig = html; el.hidden = false;
  const len = items.reduce((a, i) => a + i.text.length + 20, 0);
  el.innerHTML = `<span class="tk-label"><span class="dot live"></span>Live wire</span><div class="tk-track"><div class="tk-move" style="--dur:${Math.max(25, Math.round(len * 0.22))}s">${html}<span class="tk-sep" aria-hidden="true">•</span><span class="tk-dup" aria-hidden="true" inert>${html}<span class="tk-sep">•</span></span></div></div>`;
}

/* ---------------- weekly recap ----------------
   Rebuilds each completed matchup game window by game window: a player's points land when his NFL game
   ends, everything not yet played counts at its pre-game projection. That gives a win-probability path
   for every matchup, which drives the swing charts, comebacks and heartbreakers. */
const ELIG = { QB: ["QB"], RB: ["RB"], WR: ["WR"], TE: ["TE"], FLEX: ["RB", "WR", "TE"], WRRB_FLEX: ["WR", "RB"], REC_FLEX: ["WR", "TE"], SUPER_FLEX: ["QB", "RB", "WR", "TE"] };
function optimalPts(slots, roster, ptsMap) {
  const pool = roster.map(pid => ({ pid, pos: ppos(pid), pts: +ptsMap[pid] || 0 })).sort((a, b) => b.pts - a.pts);
  const used = new Set(); let tot = 0;
  const order = slots.filter(sl => ELIG[sl]).sort((x, y) => ELIG[x].length - ELIG[y].length);
  for (const sl of order) { const c = pool.find(p => !used.has(p.pid) && ELIG[sl].includes(p.pos)); if (c) { used.add(c.pid); tot += c.pts; } }
  return tot;
}
function windowLabel(d) {
  if (!d) return "All games";
  const P = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", hourCycle: "h23", minute: "2-digit" }).formatToParts(d).map(p => [p.type, p.value]));
  const h = +P.hour % 24, day = P.weekday;
  if (day === "Thu" && h >= 19) return "TNF";
  if (day === "Mon" && h >= 18) return "MNF";
  if (day === "Sun") return h < 12 ? "Sun AM" : h < 15 ? "Sun 1PM" : h < 19 ? "Sun 4PM" : "SNF";
  const h12 = h % 12 || 12;
  return `${day} ${h12}${P.minute === "00" ? "" : ":" + P.minute}${h < 12 ? "AM" : "PM"}`;
}

async function buildRecap(s, week) {
  const entries = s.raw.weeks[week] || [];
  const [proj, clock, sched] = await Promise.all([loadProjections(s, week), loadGameClock(s, week, false), loadSchedule(s, false)]);
  const kick = {};
  if (clock) for (const [t, c] of Object.entries(clock)) if (c.t) kick[t] = c.t;
  if (!Object.keys(kick).length && sched?.[week]) for (const [t, g] of Object.entries(sched[week])) if (g?.t) kick[t] = g.t;
  const times = [...new Set(Object.values(kick).map(d => +d))].sort((a, b) => a - b);
  let wins = [];
  for (const t of times) if (!wins.length || t - wins[wins.length - 1].start > 90 * 60e3) wins.push({ start: t });
  const hasTimes = wins.length > 1;
  if (!wins.length) wins = [{ start: null }];
  const winOf = t => { let k = 0; wins.forEach((w, i) => { if (w.start != null && t >= w.start) k = i; }); return k; };
  const teamWin = Object.fromEntries(Object.entries(kick).map(([t, d]) => [t, winOf(+d)]));
  const W = wins.length, labels = wins.map(w => w.start == null ? "All games" : windowLabel(new Date(w.start)));
  labels.forEach((l, i) => { const n = labels.slice(0, i).filter(x => x === l).length; if (n) labels[i] = `${l} ${n + 1}`; });

  const sides = {};
  for (const e of entries) {
    if (e.matchup_id == null) continue;
    const st = e.starters || [];
    const players = st.map((pid, i) => {
      const real = pid && pid !== "0", actual = +(e.starters_points?.[i] ?? e.players_points?.[pid] ?? 0) || 0;
      const nfl = pteam(pid);
      let win = !real ? -1 : nfl in teamWin ? teamWin[nfl] : (actual > 0 || !hasTimes ? W - 1 : -1);
      return { pid, slot: s.slots[i] || "", actual, proj: real ? (proj[pid] ?? s.pAvg[pid] ?? 0) : 0, win };
    });
    const roster = e.players || [];
    const act = sum(players.map(p => p.actual));
    sides[e.roster_id] = {
      rid: e.roster_id, oid: s.ownerOf[e.roster_id], mid: e.matchup_id, pts: ptsOf(e), proj: sum(players.map(p => p.proj)), players,
      bench: roster.filter(p => !st.includes(p)).map(pid => ({ pid, actual: +(e.players_points?.[pid] || 0) })),
      optimal: Math.max(act, optimalPts(s.slots, roster, e.players_points || {}))
    };
  }
  const cp = (sd, k) => { let sc = 0, rem = 0, v = 0; for (const p of sd.players) { if (p.win < k) sc += p.actual; else { rem += p.proj; v += (0.55 * p.proj + 2) ** 2; } } return { sc, mean: sc + rem, v }; };
  const by = {}; for (const sd of Object.values(sides)) (by[sd.mid] ||= []).push(sd);
  const mus = Object.values(by).filter(p => p.length === 2).map(([a, b]) => {
    const cps = range(0, W).map(k => { const A = cp(a, k), B = cp(b, k), v = A.v + B.v; return { pa: v > 0.01 ? Phi((A.mean - B.mean) / Math.sqrt(v)) : (A.sc > B.sc ? 1 : A.sc < B.sc ? 0 : 0.5), sa: A.sc, sb: B.sc }; });
    Object.assign(cps[W], { sa: a.pts, sb: b.pts, pa: a.pts > b.pts ? 1 : a.pts < b.pts ? 0 : 0.5 });
    const winner = a.pts >= b.pts ? a : b, loser = winner === a ? b : a, wa = winner === a;
    const pW = k => wa ? cps[k].pa : 1 - cps[k].pa;
    let minK = 0, maxK = 0;
    for (let k = 0; k < W; k++) { if (pW(k) < pW(minK)) minK = k; if (pW(k) > pW(maxK)) maxK = k; }
    let swK = 1, swD = 0;
    for (let k = 1; k <= W; k++) { const d = cps[k].pa - cps[k - 1].pa; if (Math.abs(d) > Math.abs(swD)) { swD = d; swK = k; } }
    const gainer = swD >= 0 ? a : b;
    const hero = [...gainer.players].filter(p => p.win === swK - 1).sort((x, y) => y.actual - x.actual)[0];
    let flips = 0; for (let k = 1; k <= W; k++) if ((cps[k].pa - 0.5) * (cps[k - 1].pa - 0.5) < 0) flips++;
    return { mid: a.mid, a, b, cps, winner, loser, pre: pW(0), minK, minP: pW(minK), loserMaxK: minK, loserMaxP: 1 - pW(minK), swK, swD, gainer, hero, flips, margin: winner.pts - loser.pts };
  });
  return { week, labels, hasTimes, mus, sides, W };
}

/* ---- charts ---- */
function wpChart(mu, labels, id, { w = 680, h = 240, mini = false } = {}) {
  // points sit on window boundaries: point 0 = before the first game, point k = after window k
  const n = mu.cps.length, L = mini ? 4 : 46, R = mini ? 4 : 14, T = mini ? 6 : 16, B = mini ? 6 : 30;
  const X = i => L + (n === 1 ? 0 : i * (w - L - R) / (n - 1)), Y = p => T + (1 - p) * (h - T - B), mid = Y(0.5);
  const line = mu.cps.map((c, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(c.pa).toFixed(1)}`).join("");
  const area = `${line}L${X(n - 1).toFixed(1)},${mid}L${X(0).toFixed(1)},${mid}Z`;
  const ca = color(mu.a.oid), cb = color(mu.b.oid);
  const bands = labels.map((l, k) => `<rect x="${X(k)}" y="${T}" width="${X(k + 1) - X(k)}" height="${h - T - B}" fill="${!mini && k === mu.swK - 1 ? "var(--accent)" : "var(--fg)"}" opacity="${!mini && k === mu.swK - 1 ? 0.1 : k % 2 ? 0.03 : 0}"/>`).join("");
  const seps = mini ? "" : labels.slice(1).map((l, k) => `<line x1="${X(k + 1)}" x2="${X(k + 1)}" y1="${T}" y2="${h - B}" stroke="var(--line)"/>`).join("");
  const note = !mini && mu.hero && Math.abs(mu.swD) >= 0.12 ? (() => { const x = (X(mu.swK - 1) + X(mu.swK)) / 2, anchor = x > w * 0.75 ? "end" : x < w * 0.25 ? "start" : "middle"; return `<text x="${x}" y="${T + 12}" text-anchor="${anchor}" style="fill:var(--fg);font-weight:600">${esc(pname(mu.hero.pid))} +${fmt(mu.hero.actual)}</text>`; })() : "";
  const tip = i => i === 0 ? "Before the first game" : `After ${labels[i - 1]}`;
  const dots = mu.cps.map((c, i) => `<circle cx="${X(i)}" cy="${Y(c.pa)}" r="${mini ? 2.5 : 4}" fill="var(--surface)" stroke="var(--fg)" stroke-width="2"/><rect x="${X(i) - 14}" y="${T}" width="28" height="${h - T - B}" fill="transparent"><title>${esc(tip(i))}: ${esc(teamName(mu.a.oid))} ${pct(c.pa)} to win · ${fmt(c.sa)}-${fmt(c.sb)}</title></rect>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="${mini ? "wp-mini" : "wp-big"}" role="img" aria-label="Win probability for ${esc(teamName(mu.a.oid))} through each NFL game window">
    <defs><clipPath id="${id}-t"><rect x="0" y="0" width="${w}" height="${mid}"/></clipPath><clipPath id="${id}-b"><rect x="0" y="${mid}" width="${w}" height="${h}"/></clipPath></defs>
    ${bands}${seps}
    ${mini ? "" : [0, 0.25, 0.5, 0.75, 1].map(p => `<line x1="${L}" x2="${w - R}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)" ${p === 0.5 ? "" : 'stroke-dasharray="2 4"'}/><text x="${L - 8}" y="${Y(p) + 4}" text-anchor="end">${Math.round(p * 100)}%</text>`).join("")}
    ${mini ? `<line x1="${L}" x2="${w - R}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>` : ""}
    <path d="${area}" fill="${ca}" opacity=".35" clip-path="url(#${id}-t)"/><path d="${area}" fill="${cb}" opacity=".35" clip-path="url(#${id}-b)"/>
    <path d="${line}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${note}
    ${mini ? "" : labels.map((l, k) => `<text x="${(X(k) + X(k + 1)) / 2}" y="${h - 9}" text-anchor="middle" style="${k === mu.swK - 1 ? "fill:var(--fg);font-weight:600" : ""}">${esc(l)}</text>`).join("")}
  </svg>`;
}

/* ---- copy ---- */
const R_LEAD_HI = [(T, x) => `${T} owned the week with ${x}.`, (T, x) => `Top of the board: ${T}, ${x} points.`, (T, x) => `${T} put up ${x}, the best score in the league.`, (T, x) => `${T} dropped ${x} and spent the rest of the week reminding everyone.`];
const R_COMEBACK = [
  (W, L, p, at, h) => `${W} was down to ${p} after ${at} and still beat ${L}.${h}`,
  (W, L, p, at, h) => `At ${at}, ${W} had a ${p} chance. ${L} had already started celebrating.${h}`,
  (W, L, p, at, h) => `${W} climbed out of a ${p} hole (after ${at}) to beat ${L}.${h}`
];
const R_UPSET = [
  (W, L, p) => `${W} came in at ${p} to win and walked out with a W over ${L}.`,
  (W, L, p) => `The projections gave ${W} a ${p} shot against ${L}. The projections can sit down.`,
  (W, L, p) => `${W} (${p} before kickoff) knocked off ${L}.`
];
const R_BLOW = [
  (W, L, m) => `${W} beat ${L} by ${m}. ${L} has been asked to submit a written statement.`,
  (W, L, m) => `${W} by ${m} over ${L}. Mercy rule requested, mercy rule denied.`,
  (W, L, m) => `${m}-point demolition: ${W} over ${L}.`
];
const R_HEART = [
  (L, W, p, at) => `${L} was ${p} to win after ${at}. Then it all fell apart against ${W}.`,
  (L, W, p, at) => `${L} hit ${p} after ${at} and lost anyway. ${W} sends its regards.`
];
const R_CLOSE = [(W, L, m) => `${W} edged ${L} by ${m}. That's one dropped pass.`, (W, L, m) => `${W} over ${L} by ${m}. Somebody's flex is getting a strongly worded text.`, (W, L, m) => `Decided by ${m}: ${W} over ${L}.`];
const R_MINI = {
  comeback: [(W, p) => `${W} rallied from ${p}.`, (W, p) => `${W} came back from ${p}. Wild.`],
  wire: [W => `${W} led wire to wire.`, W => `${W} was never really threatened.`, W => `Business as usual for ${W}.`],
  flip: [(W, n) => `The lead changed hands ${n} times before ${W} held on.`, (W, n) => `${n} lead changes. ${W} survived the chaos.`],
  late: [(W, at) => `${W} won it in the ${at} window.`, (W, at) => `${W} didn't take control until ${at}.`]
};

const afterWin = (d, k) => k === 0 ? "kickoff" : d.labels[k - 1];   // state after k windows
function recapLeadText(d) {
  const all = Object.values(d.sides);
  const hi = all.reduce((x, y) => y.pts > x.pts ? y : x);
  const out = [fresh(R_LEAD_HI, d.week + "hi", teamName(hi.oid), fmt(hi.pts))];
  const cb = d.hasTimes ? [...d.mus].sort((x, y) => x.minP - y.minP)[0] : null;
  const up = [...d.mus].sort((x, y) => x.pre - y.pre)[0];
  const bl = [...d.mus].sort((x, y) => y.margin - x.margin)[0];
  if (cb && cb.minP < 0.3) out.push(fresh(R_COMEBACK, d.week + "cbl", teamName(cb.winner.oid), teamName(cb.loser.oid), pct(cb.minP), afterWin(d, cb.minK), ""));
  else if (up && up.pre < 0.4) out.push(fresh(R_UPSET, d.week + "upl", teamName(up.winner.oid), teamName(up.loser.oid), pct(up.pre)));
  if (bl && bl.margin >= 25) out.push(fresh(R_BLOW, d.week + "bll", teamName(bl.winner.oid), teamName(bl.loser.oid), fmt(bl.margin)));
  return out.join(" ");
}

function viewRecap(week) {
  const s = M.cur;
  const done = range(1, Math.min(18, s.lastDone === 99 ? 18 : s.lastDone)).filter(w => (s.raw.weeks[w] || []).some(e => ptsOf(e) > 0));
  if (!done.length) return `<div class="panel"><h3>No completed weeks yet</h3><p class="muted">The first recap lands after week 1 wraps up.</p></div>`;
  if (!done.includes(week)) week = done[done.length - 1];
  const picker = `<div class="weeks" role="group" aria-label="Week">${done.map(w => `<a class="wk" href="#recap-${w}"${w === week ? ' aria-current="page"' : ""}>${w}</a>`).join("")}</div>`;
  const head = `<div class="team-top"><a class="back" href="#stories">← Storylines</a>${picker}</div>`;
  STATE.recapData ||= {}; STATE.recapLoading ||= {};
  const d = STATE.recapData[week];
  if (!d) {
    if (!STATE.recapLoading[week]) { STATE.recapLoading[week] = true; buildRecap(s, week).then(r => { STATE.recapData[week] = r; }).catch(e => { console.warn(e); STATE.recapData[week] = { error: e.message }; }).finally(() => { if (STATE.view === "stories" && STATE.recap != null) render(); }); }
    return `${head}<div class="loader"><div class="big">Rolling the tape</div><p class="muted">Rebuilding week ${week} game by game…</p></div>`;
  }
  if (d.error) return `${head}<div class="panel err"><h3>Couldn't build this recap</h3><p class="muted">${esc(d.error)}</p></div>`;

  const sides = Object.values(d.sides), mus = d.mus;
  const resOf = rid => { const m = mus.find(x => x.a.rid === rid || x.b.rid === rid); return !m ? "" : m.winner.rid === rid ? (m.margin === 0 ? "T" : "W") : "L"; };
  const med = median(sides.map(x => x.pts));

  // scoreboard chart
  const mx = Math.max(...sides.map(x => Math.max(x.pts, x.proj))) * 1.04 || 1;
  const board = [...sides].sort((x, y) => y.pts - x.pts).map(x => { const r = resOf(x.rid), diff = x.pts - x.proj;
    return `<div class="sc-row" title="${esc(teamName(x.oid))}: ${fmt(x.pts)} (projected ${fmt(x.proj)})"><span class="fn">${esc(teamName(x.oid))}</span>
      <span class="sc-track"><i class="sc-bar" style="width:${x.pts / mx * 100}%;background:${color(x.oid)}"></i><i class="sc-proj" style="left:${x.proj / mx * 100}%"></i><i class="sc-med" style="left:${med / mx * 100}%"></i></span>
      <span class="mono sc-v">${fmt(x.pts)}</span><span class="mono sc-d ${diff >= 0 ? "up" : "dn"}">${diff >= 0 ? "+" : "−"}${fmt(Math.abs(diff))}</span><i class="r ${r}">${r}</i></div>`; }).join("");

  // featured swing
  const crazy = m => Math.max(Math.abs(m.swD), m.flips * 0.22, m.minP < 0.5 ? (0.5 - m.minP) * 2 : 0);
  const feat = d.hasTimes ? [...mus].sort((x, y) => crazy(y) - crazy(x))[0] : null;
  let featHTML = "";
  if (feat) {
    const W = teamName(feat.winner.oid), Lo = teamName(feat.loser.oid), G = teamName(feat.gainer.oid);
    const heroTxt = feat.hero ? ` ${pname(feat.hero.pid)} posted ${fmt(feat.hero.actual)} in that window.` : "";
    const story = feat.minP < 0.3 ? fresh(R_COMEBACK, d.week + "feat", W, Lo, pct(feat.minP), afterWin(d, feat.minK), heroTxt)
      : `The ${d.labels[feat.swK - 1]} window moved ${Math.round(Math.abs(feat.swD) * 100)} points of win probability toward ${G}.${heroTxt}${feat.flips >= 2 ? ` The lead flipped ${plural(feat.flips, "time")} in all.` : ""}`;
    featHTML = `<div class="panel feat"><div class="feat-h"><div><div class="eyebrow">Swing of the week</div><h3>${esc(teamName(feat.a.oid))} ${fmt(feat.a.pts)}, ${esc(teamName(feat.b.oid))} ${fmt(feat.b.pts)}</h3><p class="feat-story">${esc(story)}</p></div>
      <div class="legend"><span><i style="background:${color(feat.a.oid)}"></i>${esc(teamName(feat.a.oid))} favored</span><span><i style="background:${color(feat.b.oid)}"></i>${esc(teamName(feat.b.oid))} favored</span></div></div>
      <div class="chart-scroll">${wpChart(feat, d.labels, `wpf${d.week}`)}</div>
      <p class="note" style="margin:6px 0 0">Win probability for ${esc(teamName(feat.a.oid))} as each NFL game window played out, starting from the pre-game projection on the left. Above the line, ${esc(teamName(feat.a.oid))} was favored; below it, ${esc(teamName(feat.b.oid))}. Hover a point for the score at that moment.</p></div>`;
  }

  // small multiples
  const minis = d.hasTimes ? `<div class="mms">${mus.map(m => {
    const W = teamName(m.winner.oid);
    const line = m.minP < 0.3 ? fresh(R_MINI.comeback, d.week + "mc" + m.mid, W, pct(m.minP)) : m.flips >= 2 ? fresh(R_MINI.flip, d.week + "mf" + m.mid, W, m.flips) : m.pre >= 0.5 && m.minP >= 0.5 ? fresh(R_MINI.wire, d.week + "mw" + m.mid, W) : fresh(R_MINI.late, d.week + "ml" + m.mid, W, d.labels[m.swK - 1]);
    return `<a class="mm" href="#match-${d.week}-${m.mid}"><div class="mm-h"><span><span class="chip" style="background:${color(m.a.oid)}"></span>${esc(teamName(m.a.oid))} <b class="mono">${fmt(m.a.pts)}</b></span><span><b class="mono">${fmt(m.b.pts)}</b> ${esc(teamName(m.b.oid))}<span class="chip" style="background:${color(m.b.oid)};margin:0 0 0 6px"></span></span></div>${wpChart(m, d.labels, `wpm${d.week}-${m.mid}`, { w: 300, h: 90, mini: true })}<div class="mm-q">${esc(line)}</div></a>`;
  }).join("")}</div>` : `<p class="note">Game-by-game swings need NFL kickoff times, which weren't available for this week.</p>`;

  // awards
  const A = [];
  const up = [...mus].sort((x, y) => x.pre - y.pre)[0];
  if (up && up.pre < 0.45) A.push({ tone: "hot", oid: up.winner.oid, kicker: "Upset of the week", head: `${teamName(up.winner.oid)} Shocks ${teamName(up.loser.oid)}`, body: fresh(R_UPSET, d.week + "up", teamName(up.winner.oid), teamName(up.loser.oid), pct(up.pre)), stat: `${fmt(up.winner.pts)}-${fmt(up.loser.pts)}` });
  const cb = d.hasTimes ? [...mus].sort((x, y) => x.minP - y.minP)[0] : null;
  if (cb && cb.minP < 0.3) A.push({ tone: "hot", oid: cb.winner.oid, kicker: "Comeback of the week", head: fresh(["Never Say Never", "Back From the Dead", "Reports of Their Death Were Exaggerated"], d.week + "cbh"), body: fresh(R_COMEBACK, d.week + "cb", teamName(cb.winner.oid), teamName(cb.loser.oid), pct(cb.minP), afterWin(d, cb.minK), ""), stat: `Low point: ${pct(cb.minP)} after ${afterWin(d, cb.minK)}` });
  const hb = d.hasTimes ? [...mus].filter(m => m !== cb).sort((x, y) => x.minP - y.minP)[0] : null;
  if (hb && hb.minP < 0.3) A.push({ tone: "cold", oid: hb.loser.oid, kicker: "Heartbreaker", head: fresh(["So Close, Yet So Far", "It Was Right There", "Pain"], d.week + "hbh"), body: fresh(R_HEART, d.week + "hb", teamName(hb.loser.oid), teamName(hb.winner.oid), pct(1 - hb.minP), afterWin(d, hb.minK)), stat: `Final: ${fmt(hb.loser.pts)}-${fmt(hb.winner.pts)}` });
  const bl = [...mus].sort((x, y) => y.margin - x.margin)[0];
  if (bl) A.push({ tone: "cold", oid: bl.winner.oid, kicker: "Blowout of the week", head: fresh(["Not Close. Not Even a Little.", "Call It Off", "The Massacre"], d.week + "blh"), body: fresh(R_BLOW, d.week + "bl", teamName(bl.winner.oid), teamName(bl.loser.oid), fmt(bl.margin)), stat: `${fmt(bl.winner.pts)}-${fmt(bl.loser.pts)}` });
  const cl = [...mus].sort((x, y) => x.margin - y.margin)[0];
  if (cl && cl !== bl && cl.margin < 10) A.push({ tone: "hot", oid: cl.winner.oid, kicker: "Nail-biter", head: fresh(["Photo Finish", "By a Whisker", "Cardiac Classic"], d.week + "clh"), body: fresh(R_CLOSE, d.week + "cl", teamName(cl.winner.oid), teamName(cl.loser.oid), fmt(cl.margin, 2)), stat: `${fmt(cl.winner.pts)}-${fmt(cl.loser.pts)}` });
  const losers = mus.map(m => m.loser).sort((x, y) => y.pts - x.pts), winners = mus.map(m => m.winner).sort((x, y) => x.pts - y.pts);
  if (losers[0] && losers[0].pts > med) A.push({ tone: "cold", oid: losers[0].oid, kicker: "Wrong place, wrong time", head: "Unluckiest Loss", body: `${teamName(losers[0].oid)} scored ${fmt(losers[0].pts)}, enough to beat ${sides.filter(x => x.pts < losers[0].pts).length} teams. Just not the one across from them.`, stat: `${fmt(losers[0].pts)} pts · league median ${fmt(med)}` });
  if (winners[0] && winners[0].pts < med) A.push({ tone: "hot", oid: winners[0].oid, kicker: "Got away with one", head: "Luckiest Win", body: `${teamName(winners[0].oid)} won with ${fmt(winners[0].pts)}, which would have lost to ${sides.filter(x => x.pts > winners[0].pts).length} teams. Buy a lottery ticket.`, stat: `${fmt(winners[0].pts)} pts · league median ${fmt(med)}` });
  const eff = sides.map(x => ({ x, left: x.optimal - x.pts, e: x.optimal ? x.pts / x.optimal : 1 })).sort((p, q) => q.e - p.e);
  if (eff.length) {
    const best = eff[0], worst = eff[eff.length - 1];
    A.push({ tone: "hot", oid: best.x.oid, kicker: "Coach of the week", head: best.left < 0.5 ? "The Perfect Lineup" : "Set It and Nailed It", body: best.left < 0.5 ? `${teamName(best.x.oid)} started the best possible lineup. Not a single point left on the bench.` : `${teamName(best.x.oid)} got ${pct(best.e)} of their best possible score. Somebody did their homework.`, stat: `${fmt(best.x.pts)} of a possible ${fmt(best.x.optimal)}` });
    if (worst !== best && worst.left >= 5) A.push({ tone: "cold", oid: worst.x.oid, kicker: "Bench warmer award", head: fresh(["Points Left in the Fridge", "The Wrong Guys", "Lineup Malpractice"], d.week + "bwh"), body: `${teamName(worst.x.oid)} left ${fmt(worst.left)} points on the bench. The optimal lineup would have scored ${fmt(worst.x.optimal)}.${(() => { const m = mus.find(mm => mm.a.rid === worst.x.rid || mm.b.rid === worst.x.rid); return m && m.loser.rid === worst.x.rid && worst.x.optimal > m.winner.pts ? " That would have won the matchup." : ""; })()}`, stat: `Started ${fmt(worst.x.pts)} · possible ${fmt(worst.x.optimal)}` });
  }
  let blunder = null;
  for (const x of sides) for (const b of x.bench) { const pos = ppos(b.pid); const st = x.players.filter(p => p.pid && p.pid !== "0" && ppos(p.pid) === pos).sort((p, q) => p.actual - q.actual)[0]; if (st && b.actual - st.actual > (blunder?.d ?? 6)) blunder = { x, b, st, d: b.actual - st.actual }; }
  if (blunder) A.push({ tone: "cold", oid: blunder.x.oid, kicker: "Bench blunder", head: `${pname(blunder.b.pid)} Deserved Better`, body: `${teamName(blunder.x.oid)} benched ${pname(blunder.b.pid)} (${fmt(blunder.b.actual)}) and started ${pname(blunder.st.pid)} (${fmt(blunder.st.actual)}). That's a ${fmt(blunder.d)}-point decision.`, stat: "" });

  // performers
  const starters = sides.flatMap(x => x.players.filter(p => p.pid && p.pid !== "0").map(p => ({ ...p, oid: x.oid })));
  const top = [...starters].sort((a, b) => b.actual - a.actual).slice(0, 8), tmax = Math.max(1, top[0]?.actual || 1);
  const topHTML = top.map((p, i) => `<div class="perf"><span class="mono muted perf-n">${i + 1}</span>${headshot(p.pid)}<div style="min-width:0"><div class="hpn">${esc(pname(p.pid))}</div><div class="hpm">${esc(ppos(p.pid))} · ${esc(teamName(p.oid))}</div></div><span class="perf-bar"><i style="width:${p.actual / tmax * 100}%;background:${posColor(p.pid)}"></i></span><span class="mono perf-v">${fmt(p.actual)}<small class="${p.actual - p.proj >= 0 ? "up" : "dn"}">${p.actual - p.proj >= 0 ? "+" : "−"}${fmt(Math.abs(p.actual - p.proj))}</small></span></div>`).join("");
  const busts = [...starters].filter(p => p.proj >= 10).sort((a, b) => (a.actual - a.proj) - (b.actual - b.proj)).slice(0, 4);
  const bustHTML = busts.map(p => `<div class="perf"><span></span>${headshot(p.pid)}<div style="min-width:0"><div class="hpn">${esc(pname(p.pid))}</div><div class="hpm">${esc(ppos(p.pid))} · ${esc(teamName(p.oid))}</div></div><span class="mono muted perf-proj" style="font-size:12px">proj ${fmt(p.proj)}</span><span class="mono perf-v">${fmt(p.actual)}<small class="dn">−${fmt(p.proj - p.actual)}</small></span></div>`).join("");

  return `${head}
    <div class="section-h"><div><div class="eyebrow">${s.year} · Week ${week} in review</div><h2>The Week ${week} Tape</h2></div></div>
    <p class="recap-lead">${esc(recapLeadText(d))}</p>
    <div class="stack" style="gap:36px;margin-top:20px">
      ${section("rc-board", "The Scoreboard", "Every team's score against its pre-game projection",
        `<div class="panel"><div class="sc">${board}</div><div class="legend" style="margin-top:12px"><span><i class="lg-proj"></i>Pre-game projection</span><span><i class="lg-med"></i>League median (${fmt(med)})</span><span>± vs projection</span></div></div>`)}
      ${featHTML ? section("rc-swing", "Swing of the Week", "The matchup that moved the most", featHTML) : ""}
      ${section("rc-all", "Every Matchup, Window by Window", "Win probability after each NFL game window. Click one for the box score.", minis)}
      ${section("rc-awards", "The Awards", "Honors, dishonors and lineup malpractice", `<div class="grid g3">${A.map(storyCard).join("")}</div>`)}
      ${section("rc-perf", "Who Showed Up", "Top starters this week, and the ones who didn't", `<div class="grid g2"><div class="panel"><h4 class="mini">Top performers</h4><div class="perfs">${topHTML}</div><p class="note" style="margin:8px 0 0">Small number: points above or below projection.</p></div><div class="panel"><h4 class="mini">Biggest busts</h4><div class="perfs">${bustHTML || '<p class="muted">Everyone projected for 10+ showed up. Miraculous.</p>'}</div></div></div>`)}
    </div>`;
}

function recapTeaser() {
  const s = M.cur, last = range(1, Math.min(18, s.lastDone === 99 ? 18 : s.lastDone)).filter(w => (s.raw.weeks[w] || []).some(e => ptsOf(e) > 0)).pop();
  if (!last) return "";
  const games = s.games.filter(g => g.week === last && g.final);
  if (!games.length) return "";
  const flat = games.flatMap(g => [g.a, g.b]), hi = flat.reduce((x, y) => y.pts > x.pts ? y : x);
  const bl = games.reduce((x, y) => Math.abs(y.a.pts - y.b.pts) > Math.abs(x.a.pts - x.b.pts) ? y : x), cl = games.reduce((x, y) => Math.abs(y.a.pts - y.b.pts) < Math.abs(x.a.pts - x.b.pts) ? y : x);
  const wl = g => g.a.pts >= g.b.pts ? [g.a, g.b] : [g.b, g.a];
  const [bw, bL] = wl(bl), [cw, cL] = wl(cl);
  return `<a class="teaser" href="#recap-${last}"><div><div class="eyebrow">Week ${last} in review</div><h3>The Week ${last} Tape</h3>
    <ul><li>High score: <b>${esc(teamName(hi.oid))}</b>, ${fmt(hi.pts)}</li><li>Blowout: <b>${esc(teamName(bw.oid))}</b> by ${fmt(bw.pts - bL.pts)} over ${esc(teamName(bL.oid))}</li>${cl !== bl ? `<li>Closest: <b>${esc(teamName(cw.oid))}</b> by ${fmt(cw.pts - cL.pts, 2)} over ${esc(teamName(cL.oid))}</li>` : ""}</ul></div>
    <span class="teaser-cta">Swing charts, upsets and awards <span aria-hidden="true">→</span></span></a>`;
}

/* ---------------- trade review ----------------
   Each side of a trade is credited with the starter points it got from what it received:
   players (while on that roster, from the trade week on) and rookie picks (the player drafted with
   the pick, if this team made the selection). Unused future picks are "pending". */
function tradeReview() {
  const log = {};
  for (const s of M.seasons) for (const [wk, entries] of Object.entries(s.raw.weeks)) {
    if (+wk > s.lastDone) continue;
    for (const e of entries || []) {
      if (e.matchup_id == null) continue;
      const oid = s.ownerOf[e.roster_id];
      (e.starters || []).forEach((pid, i) => { if (!pid || pid === "0") return; (log[`${oid}|${pid}`] ||= []).push({ y: s.year, w: +wk, pts: +(e.starters_points?.[i] ?? e.players_points?.[pid] ?? 0) || 0 }); });
    }
  }
  const after = (y, w) => x => x.y > y || (x.y === y && x.w >= w);
  const ptsAfter = (oid, pid, y, w) => sum((log[`${oid}|${pid}`] || []).filter(after(y, w)).map(x => x.pts));
  const weeksAll = M.seasons.flatMap(s => range(1, Math.min(18, s.lastDone === 99 ? 18 : s.lastDone)).filter(w => (s.raw.weeks[w] || []).some(e => ptsOf(e) > 0)).map(w => ({ y: s.year, w })));
  const weeksAfter = (y, w) => weeksAll.filter(after(y, w)).length;
  const rookie = {};
  for (const s of M.seasons) for (const d of s.raw.drafts) if (d.status === "complete" && (d.settings?.rounds || 99) <= 6) rookie[String(d.season)] = { d, s, picks: s.raw.draftPicks[d.draft_id] || [] };
  const resolve = pk => {
    const D = rookie[String(pk.season)]; if (!D) return null;
    let slot = null;
    if (D.d.slot_to_roster_id) { const k = Object.keys(D.d.slot_to_roster_id).find(k => D.d.slot_to_roster_id[k] === pk.roster_id); if (k) slot = +k; }
    if (!slot && D.d.draft_order) { const uid = D.s.raw.rosters.find(r => r.roster_id === pk.roster_id)?.owner_id; if (uid && D.d.draft_order[uid]) slot = +D.d.draft_order[uid]; }
    const p = slot ? D.picks.find(x => x.round === pk.round && x.draft_slot === slot) : null;
    return { D, p };
  };
  const trades = [];
  for (const s of M.seasons) for (const [wk, list] of Object.entries(s.raw.tx)) for (const t of list || []) {
    if (t.type !== "trade" || t.status !== "complete") continue;
    const sides = (t.roster_ids || []).map(rid => {
      const oid = s.ownerOf[rid];
      const players = Object.entries(t.adds || {}).filter(([, r]) => r === rid).map(([pid]) => ({ name: pname(pid), pos: ppos(pid), pts: ptsAfter(oid, pid, s.year, +wk) }));
      const picks = (t.draft_picks || []).filter(p => p.owner_id === rid).map(pk => {
        const label = `${pk.season} R${pk.round}`, r = resolve(pk);
        if (!r) return { label, round: pk.round, pending: true };
        if (!r.p) return { label, round: pk.round, pts: 0, note: "used, player unknown" };
        const drafter = pickOwner(r.p, r.D.s);
        const nm = r.p.metadata?.first_name ? `${r.p.metadata.first_name} ${r.p.metadata.last_name}` : pname(r.p.player_id);
        return { label, round: pk.round, player: nm, pts: drafter === oid ? ptsAfter(oid, r.p.player_id, +r.D.d.season, 1) : 0, flipped: drafter !== oid };
      });
      const total = sum(players.map(p => p.pts)) + sum(picks.map(p => p.pts || 0));
      return { rid, oid, players, picks, total, pending: picks.filter(p => p.pending), faab: sum((t.waiver_budget || []).filter(b => b.receiver === rid).map(b => b.amount || 0)) };
    }).filter(x => x.oid);
    if (sides.length < 2) continue;
    const byTotal = [...sides].sort((a, b) => b.total - a.total);
    trades.push({ id: t.transaction_id || `${s.year}-${wk}-${trades.length}`, year: s.year, week: +wk, sides, age: weeksAfter(s.year, +wk), win: byTotal[0], lose: byTotal[byTotal.length - 1], margin: byTotal[0].total - byTotal[byTotal.length - 1].total, floor: byTotal[byTotal.length - 1].total, sum: sum(sides.map(x => x.total)) });
  }
  const settled = trades.filter(t => t.age >= 3 && !t.lose.pending.some(p => p.round <= 2));
  const worst = [...settled].filter(t => t.margin > 0).sort((a, b) => b.margin - a.margin).slice(0, 5);
  const best = [...settled].filter(t => !worst.includes(t) && t.floor > 0).sort((a, b) => b.floor - a.floor || b.sum - a.sum).slice(0, 5);
  const jury = trades.filter(t => !settled.includes(t)).sort((a, b) => b.year - a.year || b.week - a.week).slice(0, 4);
  const teams = {};
  for (const t of settled) for (const sd of t.sides) {
    const others = t.sides.filter(x => x !== sd), net = sd.total - mean(others.map(x => x.total));
    const T = teams[sd.oid] ||= { oid: sd.oid, n: 0, net: 0, w: 0, l: 0, best: null };
    T.n++; T.net += net; if (net > 0) T.w++; else if (net < 0) T.l++;
    if (!T.best || net > T.best.net) T.best = { net, t };
  }
  return { trades, worst, best, jury, teams: Object.values(teams).sort((a, b) => b.net - a.net) };
}

function tradeGrade(sd, t) {
  if (t.sum <= 0) return "INC";
  const share = sd.total / t.sum, f = share * t.sides.length / 2;   // 0.5 share in a 2-team deal = even
  return f >= 0.8 ? "A+" : f >= 0.7 ? "A" : f >= 0.6 ? "B" : f >= 0.4 ? "C" : f >= 0.3 ? "D" : "F";
}
const T_WORST = [
  (W, L) => `${W} Fleeced ${L}`, (W, L) => `Daylight Robbery`, (W, L) => `${L} Wants a Do-Over`, (W, L) => `Somebody Call the Commissioner`, (W, L) => `${W} Pulled a Fast One`, (W, L) => `Lopsided Doesn't Cover It`
];
const T_WORST_Q = [
  (W, L, m) => `${W} has gotten ${m} more starter points out of this. ${L} would like to speak to a manager.`,
  (W, L, m) => `A ${m}-point gap and counting. ${L} still insists it was "a value play."`,
  (W, L, m) => `${m} points separate the two sides. ${W} sends a thank-you card every Christmas.`,
  (W, L, m) => `${L} is down ${m} on this one. The group chat has not let it go.`,
  (W, L, m) => `${W} up ${m}. Veto requests were filed and denied.`
];
const T_BEST = [() => `Everybody Wins`, () => `A Rare Win-Win`, () => `Both Sides Can Brag`, () => `Fair and Square`, () => `The Handshake Deal`];
const T_BEST_Q = [
  (A, B) => `${A} and ${B} both got real starters out of this. Diplomacy lives.`,
  (A, B) => `Real production on both sides. ${A} and ${B} should run the trade seminar.`,
  (A, B) => `Nobody got fleeced. ${A} and ${B} are a model for the league.`,
  (A, B) => `${A} and ${B} both walked away happy. Suspicious, but we'll allow it.`,
  (A, B) => `Proof that trades don't have to end friendships. ${A} and ${B} are still talking.`
];

function tradeCard(t, kind, i) {
  const W = teamName(t.win.oid), L = teamName(t.lose.oid);
  const head = kind === "worst" ? fresh(T_WORST, t.id + "h", W, L) : kind === "best" ? fresh(T_BEST, t.id + "h") : t.sides.map(x => teamName(x.oid)).join(" × ");
  const quip = kind === "worst" ? fresh(T_WORST_Q, t.id + "q", W, L, fmt(t.margin)) : kind === "best" ? fresh(T_BEST_Q, t.id + "q", teamName(t.sides[0].oid), teamName(t.sides[1].oid)) : (t.age < 3 ? `Only ${plural(t.age, "week")} of data so far.` : `Waiting on ${t.lose.pending.map(p => p.label).join(", ")}.`);
  const side = sd => {
    const g = tradeGrade(sd, t), winner = kind !== "jury" && sd === t.win && t.margin > 0;
    const items = [...sd.players.map(p => `<li><span>${esc(p.name)} <span class="muted">${esc(p.pos)}</span></span><span class="mono">${fmt(p.pts)}</span></li>`),
      ...sd.picks.map(p => `<li><span>${esc(p.label)}${p.player ? ` <span class="muted">→ ${esc(p.player)}${p.flipped ? " (flipped)" : ""}</span>` : p.pending ? ' <span class="pend">pending</span>' : p.note ? ` <span class="muted">${esc(p.note)}</span>` : ""}</span><span class="mono">${p.pending ? "–" : fmt(p.pts)}</span></li>`),
      ...(sd.faab ? [`<li><span>$${sd.faab} FAAB</span><span class="mono">–</span></li>`] : [])];
    return `<div class="tside ${winner ? "won" : ""}" style="--team:${color(sd.oid)}"><div class="tside-h"><span class="fn">${esc(teamName(sd.oid))}</span><span class="grade g-${g.replace("+", "p")}">${g}</span></div><div class="muted" style="font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em">Received</div><ul>${items.join("") || '<li class="muted">Nothing listed</li>'}</ul><div class="tside-t"><span>Starter points</span><b class="mono">${fmt(sd.total)}</b></div></div>`;
  };
  return `<article class="trade">
    <div class="trade-h">${kind !== "jury" ? `<span class="trank mono">${i + 1}</span>` : ""}<div style="min-width:0"><div class="eyebrow">${t.year} · Week ${t.week}</div><h4>${esc(head)}</h4></div></div>
    <div class="tsides">${t.sides.map(side).join("")}</div>
    <p class="tquip">${esc(quip)}</p></article>`;
}

function tradeSection() {
  const R = tradeReview();
  if (!R.trades.length) return section("trades", "Trade Review", "", `<div class="panel"><p class="tquip" style="margin:0">Not a single trade on record. Either everyone is a genius or nobody answers their DMs.</p></div>`);
  const list = (arr, kind, empty) => arr.length ? `<div class="trades">${arr.map((t, i) => tradeCard(t, kind, i)).join("")}</div>` : `<p class="muted">${empty}</p>`;
  const maxNet = Math.max(1, ...R.teams.map(x => Math.abs(x.net)));
  const card = R.teams.length ? `<div class="panel"><h4 class="mini">Trade report card</h4><p class="note" style="margin:-4px 0 10px">Net starter points from every settled trade: what each team got minus what it gave up.</p>
    <div class="luckrows">${R.teams.map(x => { const w = Math.abs(x.net) / maxNet * 50; return `<div class="luckrow tr-row"><span class="fn">${esc(teamName(x.oid))}</span><span class="lbar"><i style="${x.net >= 0 ? `left:50%;width:${w}%;background:var(--win)` : `right:50%;width:${w}%;background:var(--loss)`}"></i></span><span class="mono lv">${x.net >= 0 ? "+" : "−"}${fmt(Math.abs(x.net), 0)}</span><span class="mono muted tr-rec">${x.w}-${x.l} in ${plural(x.n, "deal")}</span></div>`; }).join("")}</div></div>` : "";
  return section("trades", "Trade Review", `${plural(R.trades.length, "trade")} in league history, graded on what actually happened`,
    `<div class="stack" style="gap:28px">
      <div><h4 class="mini">The 5 worst trades</h4><p class="note" style="margin:-4px 0 12px">The most lopsided deals, ranked by how many more starter points the winner got.</p>${list(R.worst, "worst", "No lopsided trades yet. Give it time.")}</div>
      <div><h4 class="mini">The 5 best trades</h4><p class="note" style="margin:-4px 0 12px">Deals where both sides got real production, ranked by the smaller side's haul.</p>${list(R.best, "best", "No trade has paid off for both sides yet.")}</div>
      ${card}
      ${R.jury.length ? `<div><h4 class="mini">Jury's still out</h4><p class="note" style="margin:-4px 0 12px">Too recent, or still waiting on draft picks that haven't been used.</p>${list(R.jury, "jury", "")}</div>` : ""}
      <p class="note">Each side is credited with starter points from what it received: players while they stayed on that roster, and rookie picks through the player drafted with them. Bench points don't count. Grades compare each side's share of the total. Trades need 3 weeks of games before they're ranked, and deals still waiting on a first- or second-round pick stay in "Jury's still out."</p>
    </div>`);
}

/* ---------------- journeymen: players who've been on more than one franchise ----------------
   Ownership comes from every completed week's rosters plus today's rosters; moves are counted from transactions. */
function journeymen() {
  const tl = {}, seen = (pid, y, w, oid) => {
    if (!pid || pid === "0" || !oid) return;
    const t = tl[pid] ||= [], last = t[t.length - 1];
    if (last && last.oid === oid) { last.to = y; return; }
    t.push({ oid, from: y, to: y });
  };
  for (const s of M.seasons) {
    for (const wk of Object.keys(s.raw.weeks).map(Number).sort((a, b) => a - b)) {
      if (wk > s.lastDone) continue;
      for (const e of s.raw.weeks[wk] || []) for (const pid of e.players || []) seen(pid, s.year, wk, s.ownerOf[e.roster_id]);
    }
  }
  const cur = M.cur, now = {};
  for (const r of cur.raw.rosters) for (const pid of r.players || []) { now[pid] = cur.ownerOf[r.roster_id]; seen(pid, cur.year, 99, cur.ownerOf[r.roster_id]); }
  const moves = {};
  for (const s of M.seasons) for (const list of Object.values(s.raw.tx)) for (const t of list || []) {
    if (t.status !== "complete") continue;
    for (const pid of Object.keys(t.adds || {})) { const m = moves[pid] ||= { trades: 0, pickups: 0, drops: 0 }; if (t.type === "trade") m.trades++; else m.pickups++; }
    if (t.type !== "trade") for (const pid of Object.keys(t.drops || {})) (moves[pid] ||= { trades: 0, pickups: 0, drops: 0 }).drops++;
  }
  const list = Object.entries(tl).map(([pid, stints]) => {
    const teams = [...new Set(stints.map(x => x.oid))];
    const m = moves[pid] || { trades: 0, pickups: 0, drops: 0 };
    const boomerang = stints.length > teams.length;
    return { pid, stints, teams: teams.length, trades: m.trades, pickups: m.pickups, drops: m.drops, boomerang, now: now[pid] || null };
  }).filter(x => x.teams >= 2)
    .sort((a, b) => b.teams - a.teams || b.stints.length - a.stints.length || b.trades - a.trades || pname(a.pid).localeCompare(pname(b.pid)));
  return list;
}

const J_HEAD = ["Passport Full of Stamps", "Has Lived Everywhere", "Unpacks One Box at a Time", "Frequent Flyer Status: Platinum"];
function journeySection() {
  const L = journeymen();
  if (!L.length) return section("journeymen", "The Journeymen", "", `<div class="panel"><p class="tquip" style="margin:0">Nobody has changed teams yet. This league is surprisingly loyal.</p></div>`);
  const yr = (a, b) => a === b ? `'${String(a).slice(2)}` : `'${String(a).slice(2)}–'${String(b).slice(2)}`;
  const path = j => j.stints.map(st => `<span class="jstop" style="--team:${color(st.oid)}" title="${esc(teamName(st.oid))}, ${st.from === st.to ? st.from : st.from + "–" + st.to}"><i></i>${esc(teamName(st.oid))}<small>${yr(st.from, st.to)}</small></span>`).join('<span class="jarrow" aria-hidden="true">→</span>');
  const row = (j, i) => {
    const p = M.players[j.pid] || {};
    return `<tr><td class="n">${i + 1}</td><td><div class="jname" style="--pos:${posColor(j.pid)}">${esc(pname(j.pid))}${j.boomerang ? ' <span class="jboom" title="Came back to a former franchise">Boomerang</span>' : ""}</div><div class="muted" style="font-size:12px">${esc(ppos(j.pid))}${p.team ? " · " + esc(p.team) : ""}${p.age ? ` · ${p.age} yo` : ""}</div></td>
      <td class="jpath">${path(j)}</td><td class="n">${j.teams}</td><td class="n">${j.trades}</td><td class="n">${j.pickups}</td><td>${j.now ? esc(teamName(j.now)) : '<span class="muted">Free agent</span>'}</td></tr>`;
  };
  const js = STATE.jSort ||= { k: "trades", d: -1 };
  const keyOf = { name: j => pname(j.pid).toLowerCase(), teams: j => j.teams, stops: j => j.stints.length, trades: j => j.trades, pickups: j => j.pickups, now: j => j.now ? teamName(j.now).toLowerCase() : "~" };
  const sorted = [...L].sort((a, b) => { const x = keyOf[js.k](a), y = keyOf[js.k](b); return (x > y ? 1 : x < y ? -1 : 0) * js.d || b.teams - a.teams || b.trades - a.trades || pname(a.pid).localeCompare(pname(b.pid)); });
  const th = (k, lbl, n) => `<th class="${n ? "n" : ""}" aria-sort="${js.k === k ? (js.d < 0 ? "descending" : "ascending") : "none"}"><button type="button" data-jsort="${k}">${lbl}${js.k === k ? (js.d < 0 ? " ▼" : " ▲") : ""}</button></th>`;
  const head = `<thead><tr><th class="n">#</th>${th("name", "Player")}${th("stops", "The journey")}${th("teams", "Teams", 1)}${th("trades", "Trades", 1)}${th("pickups", "Pickups", 1)}${th("now", "Now")}</tr></thead>`;
  const top = sorted.slice(0, 15), rest = sorted.slice(15);
  const most = L[0], traded = [...L].sort((a, b) => b.trades - a.trades)[0], boom = L.find(j => j.boomerang), flyer = [...L].sort((a, b) => b.pickups - a.pickups)[0];
  const cards = [
    { tone: "hot", oid: most.now || most.stints[most.stints.length - 1].oid, kicker: "Most traveled", head: `${pname(most.pid)}: ${fresh(J_HEAD, most.pid)}`, body: `${plural(most.teams, "franchise")} and counting${most.boomerang ? ", including a return trip" : ""}. Somebody get this man a moving company on retainer.`, stat: most.stints.map(s => teamName(s.oid)).join(" → ") },
    traded && traded.trades >= 2 ? { tone: "hot", oid: traded.now || traded.stints[traded.stints.length - 1].oid, kicker: "Most traded", head: `${pname(traded.pid)} Keeps Getting Flipped`, body: `Traded ${traded.trades} times. Every manager wants him until they have him.`, stat: `${plural(traded.teams, "franchise")} · ${plural(traded.trades, "trade")}` } : null,
    boom ? { tone: "hot", oid: boom.now || boom.stints[boom.stints.length - 1].oid, kicker: "Boomerang", head: `${pname(boom.pid)} Came Home`, body: `Left a franchise and ended up right back there. Some breakups don't stick.`, stat: boom.stints.map(s => teamName(s.oid)).join(" → ") } : null,
    flyer && flyer.pickups >= 2 ? { tone: "cold", oid: flyer.now || flyer.stints[flyer.stints.length - 1].oid, kicker: "Waiver wire regular", head: `${pname(flyer.pid)} Knows the Wire by Heart`, body: `Picked up off waivers or free agency ${flyer.pickups} times. Dropped ${plural(flyer.drops, "time")}. The ultimate break-glass-in-case-of-emergency guy.`, stat: `${plural(flyer.teams, "franchise")}` } : null
  ].filter(Boolean);
  return section("journeymen", "The Journeymen", `${plural(L.length, "player")} who've suited up for more than one franchise`,
    `<div class="grid g2" style="margin-bottom:16px">${cards.map(storyCard).join("")}</div>
     <div class="tbl-wrap"><table class="jtable">${head}<tbody>${top.map(row).join("")}</tbody></table></div>
     ${rest.length ? `<details class="jmore"${STATE.jOpen ? " open" : ""}><summary>Show all ${L.length} players</summary><div class="tbl-wrap" style="margin-top:10px"><table class="jtable">${head}<tbody>${rest.map((j, i) => row(j, i + 15)).join("")}</tbody></table></div></details>` : ""}
     <p class="note">Built from every completed week's rosters on Sleeper plus today's rosters, so a player picked up and dropped within the same week won't show that stop. "Trades" and "Pickups" count each time he changed hands by trade, or was added off waivers or free agency. A boomerang came back to a franchise he'd already left.</p>`);
}

/* ---------------- power rankings (this season only) ----------------
   Blends how teams have played (all-play, record, recent form) with how they should play the rest of
   the way (best projected lineup from today's roster, by week), then simulates the rest of the season
   and the playoffs with that forward-looking strength to get title odds. */
// The season as it stood after week `thru` (standings, scores, all-play), for last week's snapshot
function seasonAsOf(s, thru) {
  const rec = {};
  for (const r of s.standings) rec[r.rid] = { rid: r.rid, oid: r.oid, w: 0, l: 0, t: 0, pf: 0, pa: 0, apW: 0, apL: 0, scores: r.scores.filter(x => x.week <= thru), results: [] };
  for (const g of s.games.filter(g => !g.post && g.final && g.week <= thru).sort((a, b) => a.week - b.week)) {
    const A = rec[g.a.rid], B = rec[g.b.rid]; if (!A || !B) continue;
    A.pf += g.a.pts; A.pa += g.b.pts; B.pf += g.b.pts; B.pa += g.a.pts;
    if (g.a.pts > g.b.pts) { A.w++; B.l++; A.results.push("W"); B.results.push("L"); } else if (g.a.pts < g.b.pts) { B.w++; A.l++; A.results.push("L"); B.results.push("W"); } else { A.t++; B.t++; A.results.push("T"); B.results.push("T"); }
  }
  const byWeek = {}; for (const R of Object.values(rec)) for (const x of R.scores) (byWeek[x.week] ||= []).push(x.pts);
  for (const R of Object.values(rec)) for (const x of R.scores) { const all = byWeek[x.week]; R.apW += all.filter(p => p < x.pts).length; R.apL += all.filter(p => p > x.pts).length; if (s.medianGame) { const m = median(all); if (x.pts > m) R.w++; else if (x.pts < m) R.l++; else R.t++; } }
  const standings = Object.values(rec).sort((a, b) => (b.w + b.t / 2) - (a.w + a.t / 2) || b.pf - a.pf);
  standings.forEach((r, i) => r.rank = i + 1);
  return { ...s, lastDone: thru, currentWeek: thru + 1, standings, rec, complete: false };
}

// How well each team has set its lineups: starter points as a share of the best possible lineup
function lineupEfficiency(s) {
  const act = {}, opt = {};
  for (const [wk, entries] of Object.entries(s.raw.weeks)) {
    if (+wk > s.lastDone) continue;
    for (const e of entries || []) { if (e.matchup_id == null) continue; const o = optimalPts(s.slots, e.players || [], e.players_points || {}); act[e.roster_id] = (act[e.roster_id] || 0) + ptsOf(e); opt[e.roster_id] = (opt[e.roster_id] || 0) + Math.max(o, ptsOf(e)); }
  }
  return Object.fromEntries(Object.keys(act).map(k => [k, opt[k] ? act[k] / opt[k] : 1]));
}

async function buildPower(s, gd, opts = {}) {
  const pws = s.pws, lastWk = Math.min(18, pws + 2);
  const start = s.lastDone === 99 ? 99 : s.lastDone + 1;
  const fut = start > lastWk ? [] : range(start, lastWk).slice(0, 8);
  const projs = await Promise.all(fut.map(w => loadProjections(s, w)));
  const has = projs.some(p => Object.keys(p).length);
  const rosters = opts.rosters || s.raw.rosters;
  // Lineup each roster can field week by week. Next week: injured reserve and taxi squad can't play.
  // Later weeks: IR players count again (they can be activated), taxi squad stays out.
  const projOpt = {}, irBack = {};
  for (const r of rosters) {
    const ir = new Set(r.reserve || []), taxi = new Set(r.taxi || []);
    const now = (r.players || []).filter(p => !ir.has(p) && !taxi.has(p)), later = (r.players || []).filter(p => !taxi.has(p));
    projOpt[r.roster_id] = Object.fromEntries(fut.map((w, i) => [w, optimalPts(s.slots, i === 0 ? now : later, projs[i])]));
    irBack[r.roster_id] = [...ir].filter(pid => fut.slice(1).some((w, i) => (projs[i + 1]?.[pid] || 0) >= 5));
  }
  const st = s.standings, played = st.filter(r => r.scores.length);
  const lgScores = played.flatMap(r => r.scores.map(x => x.pts)), lgMean = mean(lgScores) || 100;
  // Form: season average pulled toward the league average early on, plus the last three weeks
  const form = {};
  for (const r of st) { const sc = r.scores.map(x => x.pts), n = sc.length; const shr = n ? (n * mean(sc) + 3 * lgMean) / (n + 3) : lgMean; form[r.rid] = n >= 3 ? 0.7 * shr + 0.3 * mean(sc.slice(-3)) : shr; }
  // Lineup efficiency, relative to the league (projections assume perfect start/sit; real managers aren't)
  const effRaw = lineupEfficiency(s), effMean = mean(Object.values(effRaw)) || 1;
  const effRel = Object.fromEntries(st.map(r => [r.rid, Math.min(1.08, Math.max(0.92, (effRaw[r.rid] ?? effMean) / effMean))]));
  // Put projections on the league's real scoring scale
  const firstProj = has ? mean(rosters.map(r => projOpt[r.roster_id][fut[0]]).filter(Boolean)) : 0;
  const k = has && firstProj ? Math.min(1.25, Math.max(0.7, lgMean / firstProj)) : 1;
  const projAt = (rid, w) => { const pj = has ? projOpt[rid]?.[w] : 0; return pj > 0 ? k * pj * effRel[rid] : null; };
  const avgProj = Object.fromEntries(rosters.map(r => { const v = fut.map(w => projAt(r.roster_id, w)).filter(v => v != null); return [r.roster_id, v.length ? mean(v) : null]; }));
  const meanFor = (rid, w) => { const pj = projAt(rid, w); return pj != null ? 0.5 * pj + 0.5 * form[rid] : avgProj[rid] != null ? 0.5 * avgProj[rid] + 0.5 * form[rid] : form[rid]; };
  // Team strength = expected weekly score going forward (form + roster), shown as points above/below average
  const strength = Object.fromEntries(st.map(r => [r.rid, avgProj[r.rid] != null ? 0.5 * form[r.rid] + 0.5 * avgProj[r.rid] : form[r.rid]]));
  const sMean = mean(Object.values(strength));
  const rating = Object.fromEntries(Object.entries(strength).map(([k2, v]) => [k2, v - sMean]));
  const sim = draftProjection(s, gd, { meanFor, N: opts.N });
  const T = sim.T;
  const sos = {};
  for (const r of st) {
    const opps = [];
    for (let w = start; w < pws && w <= 18; w++) for (const e of s.raw.weeks[w] || []) if (e.roster_id === r.rid) { const o = (s.raw.weeks[w] || []).find(x => x.matchup_id === e.matchup_id && x.roster_id !== r.rid); if (o) opps.push(meanFor(o.roster_id, w)); }
    sos[r.rid] = opps.length ? mean(opps) : null;
  }
  return { fut, has, k, projOpt, avgProj, form, sim, sos, T, irBack, effRaw, effRel, strength, rating };
}

function powerTable(s, d, thru) {
  // ingredients measured through week `thru`
  const rows = s.standings.map(r => {
    const sc = r.scores.filter(x => x.week <= thru);
    const wkPts = {}; for (const g of s.games) if (!g.post && g.final && g.week <= thru) for (const x of [g.a, g.b]) (wkPts[g.week] ||= []).push(x);
    let apW = 0, apL = 0, w = 0, l = 0, t = 0;
    for (const x of sc) { const all = (wkPts[x.week] || []).map(y => y.pts); apW += all.filter(p => p < x.pts).length; apL += all.filter(p => p > x.pts).length; }
    for (const g of s.games) if (!g.post && g.final && g.week <= thru) { const me = g.a.rid === r.rid ? g.a : g.b.rid === r.rid ? g.b : null; if (!me) continue; const op = me === g.a ? g.b : g.a; if (me.pts > op.pts) w++; else if (me.pts < op.pts) l++; else t++; }
    const tm = d.sim.teams.find(x => x.rid === r.rid);
    return { r, rid: r.rid, oid: r.oid, ap: apW + apL ? apW / (apW + apL) : 0.5, apW, apL, win: w + l + t ? (w + t / 2) / (w + l + t) : 0.5, rec: { w, l, t }, l3: sc.length ? mean(sc.slice(-3).map(x => x.pts)) : 0, ppg: sc.length ? mean(sc.map(x => x.pts)) : 0,
      roster: d.avgProj[r.rid], strength: d.strength[r.rid], rating: d.rating[r.rid], eff: d.effRaw[r.rid], title: tm ? tm.p[d.T - 1] : 0, final2: tm ? tm.p[d.T - 1] + tm.p[d.T - 2] : 0, playoff: tm ? tm.playoff : 0, wins: tm ? tm.wins : 0, sos: d.sos[r.rid] };
  });
  const z = key => { const v = rows.map(x => x[key] ?? 0), m = mean(v), sdv = sd(v) || 1; return x => ((x[key] ?? 0) - m) / sdv; };
  // Strength (form + roster going forward) leads; résumé (all-play, record) and title odds round it out
  const parts = [["strength", 0.45, "Strength"], ["ap", 0.2, "All-play"], ["win", 0.15, "Record"], ["title", 0.2, "Title odds"]];
  const zs = Object.fromEntries(parts.map(([k]) => [k, z(k)]));
  for (const x of rows) {
    x.parts = parts.map(([k, wgt, lbl]) => ({ lbl, v: 18 * wgt * zs[k](x) }));
    const zz = sum(parts.map(([k, wgt]) => zs[k](x) * wgt));
    x.score = Math.max(1, Math.min(99, Math.round(50 + 18 * zz))); x.zz = zz;
  }
  rows.sort((a, b) => b.zz - a.zz);
  rows.forEach((x, i) => x.rank = i + 1);
  return rows;
}

const PWR_TIER = r => r.title >= 0.25 ? "Title favorite" : r.playoff >= 0.75 ? "Contender" : r.playoff >= 0.4 ? "Bubble" : r.playoff >= 0.1 ? "Long shot" : "Lottery bound";
const PWR_Q = {
  "Title favorite": [T => `${T} is the team everyone else is game-planning against.`, T => `The trophy engraver has ${T} on speed dial.`, T => `${T} is the favorite, and knows it.`, T => `Everybody's chasing ${T}.`],
  "Contender": [T => `${T} has a real shot, and a few managers are nervous about it.`, T => `Nobody wants to draw ${T} in round one.`, T => `${T} belongs in the conversation.`, T => `${T} is built to make noise in December.`],
  "Bubble": [T => `${T} is one bad Sunday from the consolation bracket.`, T => `${T} lives on the bubble. Every lineup decision matters.`, T => `${T} could go either way. Mostly sideways.`, T => `Hold your breath, ${T}.`],
