const STATE = { view: "gameday", week: null, gd: null, odds: null, values: undefined, trending: null, timer: null, sort: { k: "titles", d: -1 } };

function viewGameday() {
  const s = M.cur, gd = STATE.gd;
  const scored = Object.keys(s.raw.weeks).map(Number).filter(w => (s.raw.weeks[w] || []).some(e => ptsOf(e) > 0));
  const top = Math.min(18, Math.max(1, s.currentWeek || 0, ...scored));
  const wkBtns = range(1, top).map(w => `<button class="wk" type="button" data-week="${w}" aria-pressed="${w === gd.week}">${w}</button>`).join("");
  const label = gd.isPast ? "Final" : gd.anyLive ? "Live" : "Upcoming";
  const cards = gd.matchups.sort((x, y) => Math.abs(0.5 - x.pA) - Math.abs(0.5 - y.pA)).map(mu => matchupCard(mu, s, gd)).join("");
  const projNote = gd.isPast ? "" : `<p class="note">Projected finals use ${gd.hasProj ? "Sleeper's weekly player projections scored with your league's settings" : "each player's season average (projections unavailable)"}${gd.hasSched ? " and live NFL game status" : ""}. Win odds are an estimate, not gospel.</p>`;
  return `<div class="section-h"><div><div class="eyebrow">${s.year} season · Week ${gd.week} · ${label}</div><h2>${gd.isPast ? "The Final Whistle" : gd.anyLive ? "Live From the League" : "This Week's Slate"}</h2></div><div class="weeks" role="group" aria-label="Week">${wkBtns}</div></div>
  ${gd.matchups.length ? `<div class="grid g2">${cards}</div>${projNote}` : `<div class="panel"><h3>No matchups yet</h3><p class="muted">Sleeper hasn't posted matchups for week ${gd.week}. ${s.league.status !== "in_season" ? "The league isn't in season right now; check History and Dynasty." : ""}</p></div>`}`;
}

function matchupCard(mu, s, gd) {
  const sideRow = (x, y, p) => `<div class="side ${x.pts >= y.pts ? "lead" : ""}">${avatarHTML(x.oid)}<div style="min-width:0"><div class="tname">${esc(teamName(x.oid))}</div><div class="mgr">${recStr(s.rec[x.rid] || { w: 0, l: 0 })}${gd.isPast ? "" : `<span class="proj-inline"> · proj ${fmt(x.final)}</span>`}</div></div>
    <div class="proj">${gd.isPast ? "" : `proj ${fmt(x.final)}`}</div><div class="score">${fmt(x.pts, 2)}</div></div>`;
  const pl = x => x.players.map(p => `<div class="pl"><span class="pos">${esc(p.slot.replace("SUPER_FLEX", "SF").replace("FLEX", "FLX").replace("REC_FLX", "RFX"))}</span><span class="nm"><span class="st ${p.status}" title="${p.status === "pre" ? "Yet to play" : p.status === "live" ? "Playing now" : "Finished"}"></span>${esc(pname(p.pid))} <span class="muted" style="font-size:11px">${esc(ppos(p.pid))} ${esc(pteam(p.pid))}</span></span><span class="pts">${fmt(p.actual, 2)}${!gd.isPast && p.status !== "done" ? ` <span class="muted">/${fmt(p.proj, 1)}</span>` : ""}</span></div>`).join("");
  const ca = color(mu.a.oid), cb = color(mu.b.oid);
  return `<article class="mu">
    <div class="mu-teams">${sideRow(mu.a, mu.b)}${sideRow(mu.b, mu.a)}</div>
    <div class="wp" role="img" aria-label="Win probability ${pct(mu.pA)} to ${pct(1 - mu.pA)}"><span style="width:${mu.pA * 100}%;background:${ca}"></span><span style="width:${(1 - mu.pA) * 100}%;background:${cb}"></span></div>
    <div class="wp-l"><span>${gd.isPast ? (mu.a.pts > mu.b.pts ? "WIN" : mu.a.pts < mu.b.pts ? "LOSS" : "TIE") : pct(mu.pA)}</span><span>${gd.isPast ? "" : "win odds"}</span><span>${gd.isPast ? (mu.b.pts > mu.a.pts ? "WIN" : mu.b.pts < mu.a.pts ? "LOSS" : "TIE") : pct(1 - mu.pA)}</span></div>
    <div class="blurb">${esc(gd.isPast ? recapBlurb(mu, s.year, gd.week) : previewBlurb(mu, STATE.odds, s.year, gd.week))}</div>
    <details class="lu"><summary>Starting lineups</summary><div class="lineups"><div>${pl(mu.a)}</div><div>${pl(mu.b)}</div></div></details>
  </article>`;
}

function storyCard(st) {
  return `<article class="story tone-${st.tone}" style="--team:${st.oid ? color(st.oid) : "var(--accent)"}"><div class="eyebrow">${esc(st.kicker)}</div><h4>${esc(st.head)}</h4>${st.body ? `<p>${esc(st.body)}</p>` : ""}${st.list ? `<dl class="kv">${st.list.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}${st.stat ? `<div class="stat">${esc(st.stat)}</div>` : ""}</article>`;
}
function section(id, title, sub, html) {
  return html ? `<section class="sect" id="sec-${id}"><div class="sect-h"><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ""}</div>${html}</section>` : "";
}

function viewStories() {
  const gd = STATE.gd, odds = STATE.odds, s = M.cur, S = buildStories(gd, odds);
  const out = [];

  // This week
  if (gd && gd.matchups.length && !gd.isPast) {
    const score = m => { const h = M.h2h[m.a.oid]?.[m.b.oid]?.games.length || 0; const close = 1 - Math.abs(0.5 - m.pA) * 2;
      const stake = odds ? (1 - Math.abs(0.5 - (odds.res[m.a.rid]?.playoff ?? .5)) * 2) + (1 - Math.abs(0.5 - (odds.res[m.b.rid]?.playoff ?? .5)) * 2) : 0; return close * 2 + stake + Math.min(h, 6) * 0.15; };
    const ranked = [...gd.matchups].sort((x, y) => score(y) - score(x)), mu = ranked[0];
    const lead = `<div class="panel lead-story"><div><div class="eyebrow">Game of the week</div><h3>${esc(teamName(mu.a.oid))} vs. ${esc(teamName(mu.b.oid))}</h3><p>${esc(previewBlurb(mu, odds, s.year, gd.week))}</p></div>
      <div class="stack">${[mu.a, mu.b].map(x => `<div class="side">${avatarHTML(x.oid)}<div style="min-width:0"><div class="tname">${esc(teamName(x.oid))}</div><div class="mgr">${recStr(s.rec[x.rid] || { w: 0, l: 0 })}${odds ? ` · ${pct(odds.res[x.rid]?.playoff)} playoff odds` : ""}</div></div><div></div><div class="score">${pct(x === mu.a ? mu.pA : 1 - mu.pA)}</div></div>`).join("")}</div></div>`;
    const slate = `<ul class="slate">${ranked.slice(1).map(m => { const fav = m.pA >= 0.5 ? m.a : m.b; return `<li><div class="vs"><span class="chip" style="background:${color(m.a.oid)}"></span>${esc(teamName(m.a.oid))} <span class="muted">vs</span> <span class="chip" style="background:${color(m.b.oid)}"></span>${esc(teamName(m.b.oid))}</div><div class="odds mono">${esc(teamName(fav.oid).split(" ")[0])} ${pct(Math.max(m.pA, 1 - m.pA))}</div><div class="q">${esc(previewLead(m, gd.week))}</div></li>`; }).join("")}</ul>`;
    out.push(section("week", `Week ${gd.week}`, gd.anyLive ? "Live now" : "The slate, ranked by drama", lead + (ranked.length > 1 ? slate : "")));
  }

  // The race
  out.push(section("race", "The Race", odds ? `${odds.pt} playoff spots, ${plural(odds.weeksLeft, "week")} left` : "", S.race.length ? `<div class="grid g3">${S.race.map(storyCard).join("")}</div>` : ""));

  // Form & fortune
  if (S.form.length) {
    const ordered = [...S.form].sort((a, b) => a.r.rank - b.r.rank);
    const formHTML = `<div class="panel"><h4 class="mini">Form guide</h4><div class="formrows">${ordered.map(f => `<div class="formrow"><span class="chip" style="background:${color(f.r.oid)}"></span><span class="fn">${esc(teamName(f.r.oid))}</span><span class="res">${f.last5.map(x => `<i class="r ${x}">${x}</i>`).join("")}</span><span class="fq">${esc(f.quip)}</span></div>`).join("")}</div>
      ${S.pfLead ? `<p class="note" style="margin:12px 0 0">Points leader: <b>${esc(teamName(S.pfLead.oid))}</b>, ${fmt(S.pfLead.pf)} points${S.pfLead.rank > 1 ? `, which somehow only buys ${ordinal(S.pfLead.rank)} place` : ", and the standings agree"}.</p>` : ""}</div>`;
    const maxAbs = Math.max(1, ...S.luck.map(x => Math.abs(x.d)));
    const top = S.luck[0], bot = S.luck[S.luck.length - 1];
    const luckHTML = `<div class="panel"><h4 class="mini">Luck meter</h4><p class="note" style="margin:-4px 0 10px">Actual wins minus the wins you'd expect if every team played everyone every week.</p>
      <div class="luckrows">${S.luck.map(x => { const w = Math.abs(x.d) / maxAbs * 50; return `<div class="luckrow"><span class="fn">${esc(teamName(x.r.oid))}</span><span class="lbar"><i style="${x.d >= 0 ? `left:50%;width:${w}%;background:var(--win)` : `right:50%;width:${w}%;background:var(--loss)`}"></i></span><span class="mono lv">${x.d >= 0 ? "+" : "−"}${fmt(Math.abs(x.d))}</span></div>`; }).join("")}</div>
      <p class="note" style="margin:12px 0 0">${top.d >= 1 ? `${esc(teamName(top.r.oid))} would have about ${fmt(top.exp, 1)} wins on a neutral schedule. Buy a lottery ticket. ` : ""}${bot.d <= -1 ? `${esc(teamName(bot.r.oid))} scores like a contender and wins like a punchline.` : ""}</p></div>`;
    out.push(section("form", "Form &amp; Fortune", "Who's hot, who's not, and who's getting away with it", `<div class="grid g2">${formHTML}${luckHTML}</div>`));
  }

  out.push(section("fame", "Hall of Fame &amp; Shame", `${plural(M.seasons.length, "season")} of receipts`, S.fame.length ? `<div class="grid g3">${S.fame.map(storyCard).join("")}</div>` : ""));
  out.push(section("office", "Front Office", "Trades, picks and other crimes", S.office.length ? `<div class="grid g2">${S.office.map(storyCard).join("")}</div>` : ""));

  const body = out.filter(Boolean);
  const jumps = [["week", "This week"], ["race", "The race"], ["form", "Form"], ["fame", "Hall of fame"], ["office", "Front office"]]
    .filter(([id]) => body.some(h => h.includes(`id="sec-${id}"`))).map(([id, l]) => `<button class="btn" type="button" data-jump="sec-${id}">${l}</button>`).join("");
  return `<div class="section-h"><div><div class="eyebrow">Written from ${plural(M.seasons.length, "season")} of league data</div><h2>Storylines</h2></div><div class="jump">${jumps}</div></div>
    <div class="stack" style="gap:36px">${body.join("") || `<p class="muted">Stories show up once games have been played.</p>`}</div>`;
}

function viewOutlook() {
  const s = M.cur, odds = STATE.odds;
  const rows = s.standings.map(r => {
    const g = r.apW + r.apL, ap = g ? r.apW / g : 0;
    const last3 = mean(r.scores.slice(-3).map(x => x.pts));
    return { r, ap, last3 };
  });
  const l3max = Math.max(...rows.map(x => x.last3), 1), l3min = Math.min(...rows.map(x => x.last3), 0);
  for (const x of rows) { const games = x.r.results.length || 1; x.power = 0.55 * x.ap + 0.25 * ((x.last3 - l3min) / ((l3max - l3min) || 1)) + 0.2 * ((x.r.w + x.r.t / 2) / games); }
  const power = [...rows].sort((a, b) => b.power - a.power);
  const status = rid => { if (!odds) return ""; const p = odds.res[rid].playoff; return p >= 0.995 ? `<span class="pill in">Clinched*</span>` : p <= 0.005 ? `<span class="pill out">Out*</span>` : p >= 0.2 && p <= 0.8 ? `<span class="pill bubble">Bubble</span>` : ""; };
  const table = `<div class="tbl-wrap"><table><thead><tr><th class="n">Pwr</th><th>Team</th><th class="n">Rec</th><th class="n">PF</th><th class="n">All-play</th><th>Last weeks</th>${odds ? `<th>Playoffs</th>${odds.byes ? "<th>Bye</th>" : ""}<th class="n">Proj W</th><th></th>` : ""}</tr></thead><tbody>
    ${power.map((x, i) => `<tr><td class="n">${i + 1}${x.r.rank !== i + 1 ? ` <span class="muted" style="font-size:11px">(${ordinal(x.r.rank)})</span>` : ""}</td><td>${teamCell(x.r.oid)}</td><td class="n">${recStr(x.r)}</td><td class="n">${fmt(x.r.pf)}</td><td class="n">${x.r.apW}-${x.r.apL}</td><td>${sparkline(x.r.scores.map(z => z.pts), 110, 28, color(x.r.oid))}</td>
      ${odds ? `<td>${bar(odds.res[x.r.rid].playoff, color(x.r.oid))}</td>${odds.byes ? `<td>${bar(odds.res[x.r.rid].bye, color(x.r.oid))}</td>` : ""}<td class="n">${fmt(odds.res[x.r.rid].wins, 1)}</td><td>${status(x.r.rid)}</td>` : ""}</tr>`).join("")}
  </tbody></table></div>`;
  const oddsNote = odds ? `<p class="note">Power blends all-play win rate (55%), recent scoring (25%) and actual record (20%). Playoff odds come from ${CONFIG.SIMULATIONS.toLocaleString()} simulations of the remaining ${plural(odds.weeksLeft, "week")}: each team's scoring is drawn from its season average (pulled toward the league average) and spread, with live projections for the week in progress. ${odds.pt} teams make it${odds.byes ? `, top ${odds.byes} get byes` : ""}; ties break on points for. *Clinched/Out means more than 99.5% of simulations agree, not a mathematical lock.</p>`
    : `<p class="note">${s.lastDone === 99 ? "The regular season is over, so playoff odds are retired until next year." : "Playoff odds appear once the regular season has games to simulate."}</p>`;
  const thru = Math.min(s.lastDone, s.pws - 1);
  return `<div class="section-h"><div><div class="eyebrow">${s.year} · ${thru > 0 ? `regular season through week ${thru}` : "season hasn't kicked off"}</div><h2>Outlook</h2></div></div>
    <div class="stack">${table}${oddsNote}${scoringChart(s)}</div>`;
}

function scoringChart(s) {
  const series = s.standings.filter(r => r.scores.length).map(r => ({ oid: r.oid, pts: r.scores.map(x => x.pts), weeks: r.scores.map(x => x.week) }));
  if (!series.length) return "";
  const all = series.flatMap(x => x.pts); const mx = Math.ceil(Math.max(...all) / 20) * 20, mn = Math.floor(Math.min(...all) / 20) * 20;
  const weeks = [...new Set(series.flatMap(x => x.weeks))].sort((a, b) => a - b);
  const W = 760, H = 280, L = 40, R = 12, T = 12, B = 26;
  const X = w => L + (weeks.length === 1 ? (W - L - R) / 2 : (weeks.indexOf(w)) * (W - L - R) / (weeks.length - 1));
  const Y = v => T + (1 - (v - mn) / ((mx - mn) || 1)) * (H - T - B);
  const ticks = []; for (let v = mn; v <= mx; v += 20) ticks.push(v);
  const lgAvg = weeks.map(w => mean(series.map(x => x.pts[x.weeks.indexOf(w)]).filter(v => v != null)));
  return `<section class="panel"><h3>Weekly Scoring</h3><p class="note" style="margin-top:-6px">Every team's weekly score; the dashed line is the league average. Hover a line to see whose it is.</p><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto" role="img" aria-label="Weekly scores by team">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    ${weeks.map(w => `<text x="${X(w)}" y="${H - 8}" text-anchor="middle">${w}</text>`).join("")}
    ${series.map(x => `<path d="${x.pts.map((v, i) => `${i ? "L" : "M"}${X(x.weeks[i]).toFixed(1)},${Y(v).toFixed(1)}`).join("")}" fill="none" stroke="${color(x.oid)}" stroke-width="1.8" opacity=".8"><title>${esc(teamName(x.oid))}</title></path>`).join("")}
    <path d="${lgAvg.map((v, i) => `${i ? "L" : "M"}${X(weeks[i]).toFixed(1)},${Y(v).toFixed(1)}`).join("")}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 4"/>
  </svg></div></section>`;
}

function viewHistory() {
  const done = M.seasons.filter(s => s.complete);
  const banners = done.slice().reverse().map(s => {
    const tg = s.titleGame; const score = tg ? [tg.a, tg.b].sort((x, y) => y.pts - x.pts).map(x => fmt(x.pts)).join("-") : "";
    const r = s.standings.find(x => x.oid === s.champ);
    return `<div class="banner"><div class="yr">${s.year}</div><div class="eyebrow" style="color:inherit;opacity:.7">Champion</div><div class="ch">${esc(teamName(s.champ))}</div><div class="ru">${r ? recStr(r) + " reg. season" : ""}${score ? `<br>Final ${score} over ${esc(teamName(s.runner))}` : ""}</div></div>`;
  }).join("");
  // all-time table
  const rows = Object.values(M.allTime).filter(a => a.g > 0).map(a => ({ ...a, pct: (a.w + a.t / 2) / Math.max(1, a.w + a.l + a.t), ppg: a.pf / Math.max(1, a.g) }));
  const k = STATE.sort.k, d = STATE.sort.d;
  rows.sort((x, y) => ((x[k] ?? 0) > (y[k] ?? 0) ? 1 : (x[k] ?? 0) < (y[k] ?? 0) ? -1 : 0) * d || y.pct - x.pct);
  const th = (key, lbl, n = true) => `<th class="${n ? "n" : ""}"><button type="button" data-sort="${key}">${lbl}${k === key ? (d < 0 ? " ▼" : " ▲") : ""}</button></th>`;
  const table = `<div class="tbl-wrap"><table><thead><tr><th>Manager</th>${th("seasons", "Yrs")}${th("w", "W")}${th("l", "L")}${th("pct", "Win%")}${th("ppg", "PPG")}${th("playoffs", "Playoffs")}${th("pw", "Playoff W")}${th("finals", "Finals")}${th("titles", "Titles")}${th("best", "Best streak")}</tr></thead><tbody>
    ${rows.map(a => `<tr><td>${teamCell(a.oid)}</td><td class="n">${a.seasons}</td><td class="n">${a.w}</td><td class="n">${a.l}</td><td class="n">${fmt(a.pct * 100, 1)}</td><td class="n">${fmt(a.ppg)}</td><td class="n">${a.playoffs}</td><td class="n">${a.pw}-${a.pl}</td><td class="n">${a.finals}</td><td class="n">${a.titles ? "🏆".repeat(Math.min(a.titles, 5)) : "0"}</td><td class="n">${a.best}</td></tr>`).join("")}
  </tbody></table></div>`;
  return `<div class="section-h"><div><div class="eyebrow">${plural(M.seasons.length, "season")} on Sleeper · ${M.seasons[0].year}–${M.cur.year}</div><h2>League History</h2></div></div>
  <div class="stack">
    ${done.length ? `<section><h3>Champions</h3><div class="banners">${banners}</div></section>` : `<div class="panel"><h3>No champions crowned yet</h3><p class="muted">The banner wall fills in when the first season wraps.</p></div>`}
    <section><h3>All-Time Standings</h3>${table}<p class="note">Regular season records; playoff record counts winners-bracket games only.</p></section>
    ${finishChart()}
    ${h2hMatrix()}
    ${recordBook()}
  </div>`;
}

function finishChart() {
  const ss = M.seasons.filter(s => s.standings.some(r => r.results.length));
  if (ss.length < 2) return "";
  const oids = [...new Set(ss.flatMap(s => s.standings.map(r => r.oid)))];
  const n = Math.max(...ss.map(s => s.standings.length));
  const W = 760, H = 40 + n * 26, L = 30, R = 150, T = 20, B = 26;
  const X = i => L + i * (W - L - R) / (ss.length - 1), Y = rk => T + (rk - 1) * (H - T - B) / Math.max(1, n - 1);
  const finish = ss.map(s => {
    const top = s.complete ? [s.champ, s.runner, s.third].filter(Boolean) : [];
    const order = [...top, ...s.standings.map(r => r.oid).filter(o => !top.includes(o))];
    return Object.fromEntries(order.map((o, i) => [o, i + 1]));
  });
  const lines = oids.map(oid => {
    const pts = ss.map((s, i) => ({ i, rk: finish[i][oid] })).filter(p => p.rk);
    if (!pts.length) return "";
    const c = color(oid); const last = pts[pts.length - 1];
    return `<g><title>${esc(teamName(oid))}</title><path d="${pts.map((p, j) => `${j ? "L" : "M"}${X(p.i)},${Y(p.rk)}`).join("")}" fill="none" stroke="${c}" stroke-width="2.4" opacity=".85"/>
      ${pts.map(p => `<circle cx="${X(p.i)}" cy="${Y(p.rk)}" r="${ss[p.i].champ === oid ? 7 : 4}" fill="${ss[p.i].champ === oid ? "var(--accent)" : c}" stroke="var(--surface)" stroke-width="1.5"/>`).join("")}
      ${last.i === ss.length - 1 ? `<text x="${X(last.i) + 10}" y="${Y(last.rk) + 4}" style="fill:${c};font-weight:600">${esc(teamName(oid).slice(0, 18))}</text>` : ""}</g>`;
  }).join("");
  return `<section class="panel"><h3>The Climb and the Fall</h3><p class="note" style="margin-top:-6px">Final finish each season: champion, runner-up and third place first, everyone else by regular-season rank. Gold dots are titles. ${M.cur.complete ? "" : `${M.cur.year} shows current standings.`}</p>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;height:auto" role="img" aria-label="Season finishes by team">
    ${range(1, n).map(rk => `<text x="${L - 10}" y="${Y(rk) + 4}" text-anchor="end">${rk}</text><line x1="${L}" x2="${W - R}" y1="${Y(rk)}" y2="${Y(rk)}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join("")}
    ${ss.map((s, i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${s.year}</text>`).join("")}
    ${lines}</svg></div></section>`;
}

function h2hMatrix() {
  const oids = Object.values(M.owners).filter(o => o.active).map(o => o.id);
  if (oids.length < 2) return "";
  const cells = (x, y) => {
    if (x === y) return `<td style="background:var(--surface-2)"></td>`;
    const m = M.h2h[x]?.[y]; if (!m) return `<td class="muted">–</td>`;
    const p = (m.w + m.t / 2) / Math.max(1, m.w + m.l + m.t);
    const c = p > 0.5 ? "var(--win)" : p < 0.5 ? "var(--loss)" : "var(--muted)";
    return `<td style="background:color-mix(in srgb, ${c} ${Math.round(Math.abs(p - 0.5) * 120)}%, transparent)" title="${esc(teamName(x))} vs ${esc(teamName(y))}: ${m.w}-${m.l}${m.t ? "-" + m.t : ""}, avg ${fmt(m.pf / m.games.length)}-${fmt(m.pa / m.games.length)}">${m.w}-${m.l}${m.t ? "-" + m.t : ""}</td>`;
  };
  const short = oid => esc((teamName(oid) || "").slice(0, 10));
  return `<section><h3>Head-to-Head</h3><div class="tbl-wrap"><table class="h2h"><thead><tr><th class="rowh">Row vs. column</th>${oids.map(o => `<th title="${esc(teamName(o))}"><span class="chip" style="background:${color(o)}"></span>${short(o)}</th>`).join("")}</tr></thead>
    <tbody>${oids.map(x => `<tr><th class="rowh" style="text-align:left"><span class="chip" style="background:${color(x)}"></span>${esc(teamName(x))}</th>${oids.map(y => cells(x, y)).join("")}</tr>`).join("")}</tbody></table></div><p class="note">Regular season plus winners-bracket playoff games, current managers only.</p></section>`;
}

function recordBook() {
  const flat = M.allGames.flatMap(g => [{ g, me: g.a, op: g.b }, { g, me: g.b, op: g.a }]);
  if (!flat.length) return "";
  const by = (f, cmp) => flat.filter(f || (() => true)).reduce((a, b) => (a == null || cmp(b, a)) ? b : a, null);
  const when = x => `${esc(teamName(x.me.oid))} vs ${esc(teamName(x.op.oid))} · ${x.g.year} Wk ${x.g.week}${x.g.post ? " (playoffs)" : ""}`;
  const items = [
    ["Highest score", by(null, (a, b) => a.me.pts > b.me.pts), x => fmt(x.me.pts)],
    ["Lowest score", by(x => x.me.pts > 0, (a, b) => a.me.pts < b.me.pts), x => fmt(x.me.pts)],
    ["Biggest blowout", by(null, (a, b) => a.me.pts - a.op.pts > b.me.pts - b.op.pts), x => "+" + fmt(x.me.pts - x.op.pts)],
    ["Closest finish", by(x => x.me.pts > x.op.pts, (a, b) => a.me.pts - a.op.pts < b.me.pts - b.op.pts), x => "+" + fmt(x.me.pts - x.op.pts, 2)],
    ["Most points in a loss", by(x => x.me.pts < x.op.pts, (a, b) => a.me.pts > b.me.pts), x => fmt(x.me.pts)],
    ["Fewest points in a win", by(x => x.me.pts > x.op.pts, (a, b) => a.me.pts < b.me.pts), x => fmt(x.me.pts)]
  ].filter(i => i[1]);
  const seasonsPF = M.seasons.flatMap(s => s.standings.filter(r => r.results.length >= 3).map(r => ({ s, r, ppg: r.pf / r.results.length })));
  const bestSzn = seasonsPF.sort((a, b) => b.ppg - a.ppg)[0];
  const streak = Object.values(M.allTime).sort((a, b) => b.best - a.best)[0];
  return `<section><h3>Record Book</h3><div class="records">
    ${items.map(([lbl, x, v]) => `<div class="rec"><div class="eyebrow">${lbl}</div><div class="v mono">${v(x)}</div><div class="d">${when(x)}</div></div>`).join("")}
    ${bestSzn ? `<div class="rec"><div class="eyebrow">Best scoring season</div><div class="v mono">${fmt(bestSzn.ppg)} ppg</div><div class="d">${esc(teamName(bestSzn.r.oid))} · ${bestSzn.s.year} (${recStr(bestSzn.r)})</div></div>` : ""}
    ${streak?.best ? `<div class="rec"><div class="eyebrow">Longest win streak</div><div class="v mono">${streak.best}</div><div class="d">${esc(teamName(streak.oid))}</div></div>` : ""}
  </div></section>`;
}

function viewDynasty() {
  const s = M.cur, vals = STATE.values;

  const rosterRows = s.raw.rosters.map(r => {

    const skill = ps.filter(p => ["QB", "RB", "WR", "TE"].includes(p.pos));
    const ages = skill.map(p => p.age).filter(Boolean);
    const byPos = {}; for (const p of skill) byPos[p.pos] = (byPos[p.pos] || 0) + p.v;
    const total = sum(ps.map(p => p.v));
    const wAge = total ? sum(skill.filter(p => p.age).map(p => p.age * p.v)) / Math.max(1, sum(skill.filter(p => p.age).map(p => p.v))) : median(ages);
    const young = skill.filter(p => p.age && p.age <= 24);
    const oldRB = skill.filter(p => p.pos === "RB" && p.age >= 27);
    const top = [...ps].sort((a, b) => b.v - a.v || (a.age || 99) - (b.age || 99)).slice(0, 3);
    const pk = (owned[r.roster_id] || []);
    const firsts = pk.filter(p => p.round === 1).length, seconds = pk.filter(p => p.round === 2).length;
    return { oid, rid: r.roster_id, total, byPos, wAge, young, oldRB, top, pk, firsts, seconds, n: skill.length };
  });

  const maxV = Math.max(...rosterRows.map(r => r.total), 1);

  const window_ = r => {

    if (rank <= n / 3) return "Juggernaut";

  };
  const table = `<div class="tbl-wrap"><table><thead><tr><th>Team</th>${vals ? "<th>Roster value by position</th>" : ""}<th class="n">Age${vals ? " (value-wtd)" : ""}</th><th class="n">≤24 yo</th><th>Top assets</th><th class="n">${nextSeasons[0]}–${nextSeasons[2].slice(2)} 1sts</th><th class="n">2nds</th><th>Window</th></tr></thead><tbody>
    ${rosterRows.map(r => `<tr><td>${teamCell(r.oid)}</td>${vals ? `<td><div style="display:flex;height:14px;width:${Math.max(4, r.total / maxV * 220)}px;border-radius:3px;overflow:hidden" title="${Math.round(r.total).toLocaleString()} total value">${["QB", "RB", "WR", "TE"].map(p => `<span style="width:${(r.byPos[p] || 0) / (r.total || 1) * 100}%;background:${posCol[p]}"></span>`).join("")}</div><div class="mono muted" style="font-size:11px">${Math.round(r.total).toLocaleString()}</div></td>` : ""}
      <td class="n">${fmt(r.wAge, 1)}</td><td class="n">${r.young.length}</td><td style="white-space:normal;min-width:200px;font-size:13px">${r.top.map(p => esc(p.n)).join(", ")}${r.oldRB.length ? `<div class="muted" style="font-size:11px">Aging RBs: ${r.oldRB.map(p => esc(p.n)).join(", ")}</div>` : ""}</td>
      <td class="n">${r.firsts}</td><td class="n">${r.seconds}</td><td><span class="pill">${window_(r)}</span></td></tr>`).join("")}

  const legend = vals ? `<p class="note">${Object.entries(posCol).map(([p, c]) => `<span class="chip" style="background:${c}"></span>${p}`).join(" &nbsp; ")} · Values from FantasyCalc's dynasty trade market, matched to your league's QB format and scoring. Picks counted from Sleeper's traded-pick ledger for the next three rookie drafts (${rookieRounds} rounds).</p>`
    : `<p class="note">Dynasty trade values couldn't be loaded, so teams are sorted by age. Picks counted from Sleeper's traded-pick ledger.</p>`;

/* ---------------- draft pick ledger (shared) ---------------- */
function picksLedger(s) {
  const first = ["pre_draft", "drafting"].includes(s.league.status) ? +s.year : +s.year + 1;
  const seasons = [0, 1, 2].map(i => String(first + i));
  const rounds = (s.raw.drafts.find(d => (d.settings?.rounds || 99) <= 6)?.settings?.rounds) || (s.set.draft_rounds && s.set.draft_rounds <= 6 ? s.set.draft_rounds : 4);
  const owned = {};
  for (const r of s.raw.rosters) for (const yr of seasons) for (let rd = 1; rd <= rounds; rd++) (owned[r.roster_id] ||= []).push({ season: yr, round: rd, orig: r.roster_id });
  for (const t of s.raw.traded) {
    if (!seasons.includes(String(t.season)) || t.round > rounds) continue;
    for (const rid of Object.keys(owned)) owned[rid] = owned[rid].filter(p => !(p.season === String(t.season) && p.round === t.round && p.orig === t.roster_id));
    (owned[t.owner_id] ||= []).push({ season: String(t.season), round: t.round, orig: t.roster_id });
  }
  for (const k of Object.keys(owned)) owned[k].sort((a, b) => a.season.localeCompare(b.season) || a.round - b.round || a.orig - b.orig);
  return { seasons, rounds, owned };
}

function viewTeam(rid) {
  const s = M.cur, oid = s.ownerOf[rid], roster = s.raw.rosters.find(r => r.roster_id === rid), vals = STATE.values;
  const r = s.rec[rid], a = M.allTime[oid] || {}, odds = STATE.odds?.res[rid];
  const starters = roster.starters || [];
  const reserve = new Set(roster.reserve || []), taxi = new Set(roster.taxi || []), startSet = new Set(starters);
  const sortP = (x, y) => (POS_ORDER[ppos(x)] || 9) - (POS_ORDER[ppos(y)] || 9) || (vals?.[y] || 0) - (vals?.[x] || 0) || (s.pAvg[y] || 0) - (s.pAvg[x] || 0);
  const bench = (roster.players || []).filter(p => !startSet.has(p) && !reserve.has(p) && !taxi.has(p)).sort(sortP);
  const head = (withSlot) => `<thead><tr>${withSlot ? "<th>Slot</th>" : ""}<th>Player</th><th>Pos · NFL</th><th class="n">Age</th><th class="n">PPG</th>${vals ? '<th class="n">Value</th>' : ""}</tr></thead>`;

  // picks
  const L = picksLedger(s);
  const mine = L.owned[rid] || [];
  const gone = L.seasons.flatMap(yr => range(1, L.rounds).map(rd => ({ season: yr, round: rd }))).filter(p => !mine.some(m => m.season === p.season && m.round === p.round && m.orig === rid))
    .map(p => { const holder = Object.entries(L.owned).find(([, list]) => list.some(m => m.season === p.season && m.round === p.round && m.orig === rid)); return { ...p, to: holder ? +holder[0] : null }; });
  const pickCols = L.seasons.map(yr => {

  }).join("");
  const goneHTML = gone.length ? `<p class="note" style="margin:12px 0 0">Traded away: ${gone.map(p => `${p.season} R${p.round}${p.to ? ` (now ${esc(teamName(s.ownerOf[p.to]))})` : ""}`).join(", ")}.</p>` : "";
  const firsts = mine.filter(p => p.round === 1).length;
  const pickQuip = firsts >= 4 ? "Hoarding firsts like it's a doomsday bunker." : firsts === 0 ? "Zero first-rounders. Win-now or bust, apparently." : gone.length === 0 && mine.length === L.seasons.length * L.rounds ? "Hasn't traded a single pick. Patience or paralysis?" : "";

  // last rookie draft haul
  const drafts = M.seasons.flatMap(x => x.raw.drafts.map(d => ({ d, picks: x.raw.draftPicks[d.draft_id] }))).filter(x => x.d.status === "complete" && x.picks?.length && (x.d.settings?.rounds || 99) <= 6).sort((p, q) => (q.d.start_time || 0) - (p.d.start_time || 0));
  const haul = drafts[0] ? drafts[0].picks.filter(p => p.picked_by === oid || p.roster_id === rid).sort((p, q) => p.pick_no - q.pick_no) : [];
  const nm = p => p.metadata?.first_name ? `${p.metadata.first_name} ${p.metadata.last_name}` : pname(p.player_id);
  const per = (s.league.total_rosters || s.raw.rosters.length);
  const haulHTML = haul.length ? `<p class="note" style="margin:8px 0 0">${drafts[0].d.season} rookie draft: ${haul.map(p => `${p.round}.${String(((p.pick_no - 1) % per) + 1).padStart(2, "0")} ${esc(nm(p))}`).join(", ")}.</p>` : "";

  const stat = (lbl, v) => `<div class="tstat"><div class="eyebrow">${lbl}</div><div class="v">${v}</div></div>`;

    <div class="tstats">
      ${r && r.results.length ? stat(`${s.year} record`, `${recStr(r)} <small>${ordinal(r.rank)}</small>`) + stat("Points for", fmt(r.pf)) : ""}
      ${odds ? stat("Playoff odds", pct(odds.playoff)) : ""}
      ${a.g ? stat("All-time", `${a.w}-${a.l}${a.t ? "-" + a.t : ""}`) : ""}

      <section><h3>Draft picks <span class="count">${mine.length}</span></h3>${pickQuip ? `<p class="note" style="margin:-6px 0 10px">${pickQuip}</p>` : ""}
        <div class="panel"><div class="pickgrid">${pickCols}</div>${goneHTML}${haulHTML}</div></section>

/* ---------------- landing gate ---------------- */
const TAGLINES = [
  "Trash talk is mandatory. Setting your lineup is, technically, optional.",
  "Where rebuilds go to become five-year plans.",
  "Home of questionable trades and unquestionable grudges.",
  "Abandon hope, all ye who started a kicker in the flex.",
  "Est. by friends. Maintained by spite."
];
const WRONG = [
  "Nope. That's the password for the toilet bowl.",
  "Wrong. Did you try your Sleeper username backwards?",
  "Denied. The commissioner has been notified (not really).",
  "Incorrect. This is why you didn't make the playoffs."
];
async function sha256(t) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function isUnlocked() {
  if (!CONFIG.PASSWORD_SHA256) return true;
  let v = null;
  try { v = localStorage.getItem("gate") || sessionStorage.getItem("gate"); } catch {}
  return v === CONFIG.PASSWORD_SHA256;
}
function showGate(leagueName) {
  return new Promise(resolve => {
    document.body.classList.add("locked");
    let n = 0;
    $("#app").innerHTML = `<div class="gate"><div class="gate-card">
      <div class="stripes" aria-hidden="true"></div>
      <div class="eyebrow">Members only · Dynasty league</div>
      <h1 id="gate-name">${esc(leagueName || "Dynasty Gameday Desk")}</h1>
      <p class="tag">${esc(pick(TAGLINES, new Date().toDateString()))}</p>
      <form id="gate-form" autocomplete="on">
        <label class="eyebrow" for="gate-pw" style="flex-basis:100%">League password</label>
        <input id="gate-pw" type="password" autocomplete="current-password" required>
        <button class="go" type="submit">Enter</button>
        <label class="remember" for="gate-remember" style="flex-basis:100%"><input id="gate-remember" type="checkbox" checked> Remember me on this device</label>
      </form>
      <p class="msg" id="gate-msg" role="alert"></p>
      <div class="fine">No password? Ask the commissioner. Begging is permitted.</div>
    </div></div>`;
    $("#gate-pw").focus();
    $("#gate-form").addEventListener("submit", async e => {
      e.preventDefault();
      const card = $(".gate-card"), msg = $("#gate-msg");
      let h = "";
      try { h = await sha256($("#gate-pw").value.trim()); } catch { msg.textContent = "This browser can't check the password here. Open the site over https."; return; }
      if (h !== CONFIG.PASSWORD_SHA256) {
        msg.textContent = WRONG[n++ % WRONG.length];
        card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
        $("#gate-pw").select();
        return;
      }
      try { ($("#gate-remember").checked ? localStorage : sessionStorage).setItem("gate", h); } catch {}
      document.body.classList.remove("locked");
      resolve();
    });
  });
}
function lockAgain() { try { localStorage.removeItem("gate"); sessionStorage.removeItem("gate"); } catch {} location.reload(); }

async function refreshGameday(fresh) {

function inGameWindow() {
  const ny = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
  const d = ny.getDay(), h = ny.getHours();
  return (d === 0 && h >= 9) || (d === 1 && (h >= 19 || h < 1)) || (d === 4 && h >= 19) || (d === 5 && h < 1) || (d === 6 && h >= 12) || (d === 2 && h < 1);

function schedulePoll() {
  clearTimeout(STATE.timer);
  const s = M.cur;
  if (STATE.week !== s.currentWeek) return;
  if (!(STATE.gd?.anyLive || inGameWindow())) return;
  STATE.timer = setTimeout(async () => {
    if (document.hidden) return schedulePoll();
    try { await refreshGameday(true); if (["gameday", "stories", "outlook"].includes(STATE.view)) render(); else renderFooter(); } catch (e) { console.warn(e); schedulePoll(); }
  }, CONFIG.POLL_SECONDS * 1000);
}

function leagueIdFromInput(v) {
  v = String(v || "").trim();
  const m = v.match(/leagues\/(\d{10,})/) || v.match(/^(\d{10,})$/);
  return m ? m[1] : null;
}
function showSetup(msg) {
  $("#app").innerHTML = `<div class="setup panel ${msg ? "err" : ""}"><div class="eyebrow">Setup</div><h2 style="margin:6px 0 10px">Connect your league</h2>
    ${msg ? `<p>${esc(msg)}</p>` : ""}
    <p class="muted">Paste your Sleeper league ID or league URL. In the Sleeper web app it's the long number in the address bar (sleeper.com/leagues/<b>…</b>); in the mobile app it's under League → Settings → General. Invite links won't work.</p>
    <form id="setup-form"><label for="lid" class="eyebrow">League ID or URL</label><input id="lid" autocomplete="off" inputmode="numeric" placeholder="e.g. 1312175132118097920" value="${esc(currentLeagueId() || "")}">
    <p><button class="btn" type="submit">Load league</button></p><p class="note" id="setup-err"></p></form></div>`;
  $("#setup-form").addEventListener("submit", e => {
    e.preventDefault();
    const id = leagueIdFromInput($("#lid").value);
    if (!id) { $("#setup-err").textContent = "That doesn't look like a league ID. It should be a long number, 18 or so digits."; return; }
    store("leagueId", id);
    const u = new URL(location.href); u.searchParams.set("league", id); history.replaceState(null, "", u);
    boot();
  });
}
function currentLeagueId() {
  const q = new URLSearchParams(location.search).get("league");
  return leagueIdFromInput(q) || leagueIdFromInput(store("leagueId")) || leagueIdFromInput(CONFIG.LEAGUE_ID);
}

async function boot() {
  const id = currentLeagueId();
  $("#lock").hidden = !CONFIG.PASSWORD_SHA256;
  if (!id) return showSetup();
  const loading = loadAll(id);   // start pulling data while the gate is up
  loading.catch(() => {});
  if (!isUnlocked()) {
    const lg = await getJSON(`${API}/league/${id}`, { ttl: 10 * MIN, optional: true });
    await showGate(lg?.name);
  }
  $("#app").innerHTML = `<div class="loader"><div class="big">Warming up</div><p class="muted" id="progress">Connecting to Sleeper…</p></div>`;
  try {
    const data = await loading;
    M = buildModel(data);
  } catch (e) {
    console.error(e);
    return showSetup(`Couldn't load that league: ${e.message}. Check the ID, or try again in a minute if Sleeper is busy.`);
  }
  const s = M.cur, lg = s.league;
  document.title = `${lg.name} · Gameday Desk`;
  $("#lg-name").textContent = lg.name;
  $("#lg-sub").textContent = `${s.year} · ${lg.total_rosters || s.raw.rosters.length} teams · ${(lg.roster_positions || []).includes("SUPER_FLEX") ? "Superflex" : "1QB"} · ${s.scoring.rec === 1 ? "PPR" : s.scoring.rec === 0.5 ? "Half PPR" : s.scoring.rec ? s.scoring.rec + " PPR" : "Standard"}`;
  if (lg.avatar) { const im = $("#lg-av"); im.src = `https://sleepercdn.com/avatars/thumbs/${lg.avatar}`; im.hidden = false; }
  const lastWeekWithGames = Math.max(1, ...Object.entries(s.raw.weeks).filter(([, e]) => (e || []).some(x => x.matchup_id != null)).map(([w]) => +w));
  STATE.week = s.currentWeek ? Math.min(s.currentWeek, lastWeekWithGames) : Math.max(1, ...Object.entries(s.raw.weeks).filter(([, e]) => (e || []).some(x => ptsOf(x) > 0)).map(([w]) => +w));
  if (s.currentWeek) s.currentWeek = STATE.week;
  progress("Running the numbers…");
  await refreshGameday(false);
  route();
  // secondary sources in the background
  loadValues(s).then(v => { STATE.values = v; if (["dynasty", "franchises"].includes(STATE.view)) render(); else renderFooter(); });
  loadTrending().then(t => { STATE.trending = t; if (STATE.view === "dynasty") render(); });
  window.scrollTo(0, 0);
}

function route() {
  const v = location.hash.slice(1);
  const tm = v.match(/^team-(\d+)$/);
  const prev = STATE.view + STATE.team;
  STATE.team = tm ? +tm[1] : null;
  STATE.view = tm ? "franchises" : ["gameday", "stories", "outlook", "history", "dynasty", "franchises"].includes(v) ? v : "gameday";
  if (M) { render(); if (prev !== STATE.view + STATE.team) window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", route);
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) location.hash = t.dataset.v; });
$("#app").addEventListener("click", async e => {
  const wk = e.target.closest("[data-week]");
  if (wk) { STATE.week = +wk.dataset.week; await refreshGameday(false); render(); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); return; }
  const so = e.target.closest("[data-sort]");
  if (so) { const k = so.dataset.sort; STATE.sort = { k, d: STATE.sort.k === k ? -STATE.sort.d : -1 }; render(); }
});
$("#app").addEventListener("change", e => { if (e.target.id === "team-pick" && e.target.value) location.hash = "team-" + e.target.value; });
$("#refresh").addEventListener("click", async () => {
  if (!M) return boot();
  const b = $("#refresh"); b.disabled = true; b.textContent = "Refreshing…";
  try { await refreshGameday(true); render(); } catch (e) { console.warn(e); } finally { b.disabled = false; b.textContent = "Refresh"; }
});
$("#lock").addEventListener("click", lockAgain);
$("#change-league").addEventListener("click", () => { clearTimeout(STATE.timer); M = null; showSetup(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && M) schedulePoll(); });
boot();
</script>
</body>
</html>
